name: PHP lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'bootstrap/**'
      - 'public/index.php'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Syntax check
        run: |
          set -e
          find app routes bootstrap -name '*.php' -print0 | xargs -0 -n1 php -l
          test -f public/index.php && php -l public/index.php || true
