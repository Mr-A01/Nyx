
name: Semgrep Code Scanning

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: '13 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: PHP Security Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:1.182.0

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output=semgrep.sarif \
            --exclude vendor \
            --exclude storage \
            --exclude data \
            --exclude node_modules \
            --exclude docs \
            --exclude docs/site \
            --exclude docs/Whitpaper-and-Doucument \
            .

      - name: Upload SARIF to GitHub
        if: always() && hashFiles('semgrep.sarif') != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c # v3.28.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php
