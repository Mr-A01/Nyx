name: Deploy project site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/site/**'
      - 'docs/Whitpaper-and-Doucument/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assemble site
        run: |
          mkdir -p _site
          # Primary site = original NYX product pages
          cp docs/site/index.html _site/index.html
          cp docs/site/whitepaper.html _site/whitepaper.html
          cp docs/site/documentation.html _site/documentation.html
          # Fallback from source folder if site copies missing
          test -f _site/index.html || cp docs/Whitpaper-and-Doucument/Nyx-V-04.html _site/index.html
          test -f _site/whitepaper.html || cp docs/Whitpaper-and-Doucument/NYX-Whitpaper-01.html _site/whitepaper.html
          test -f _site/documentation.html || cp docs/Whitpaper-and-Doucument/NYX-Doucument-01.html _site/documentation.html
          # Optional brand assets
          mkdir -p _site/assets
          cp -r docs/site/assets/* _site/assets/ 2>/dev/null || true
          cp docs/assets/*.svg _site/assets/ 2>/dev/null || true
          # Convenience redirects / aliases
          cp _site/whitepaper.html _site/NYX-Whitpaper-01.html
          cp _site/documentation.html _site/NYX-Doucument-01.html
          # Simple 404 back home
          printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=./"><a href="./">NYX</a>' > _site/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
