name: Deploy docs site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/site/* _site/
          mkdir -p _site/docs
          cp docs/*.md _site/docs/ 2>/dev/null || true
          cp -r docs/Whitpaper-and-Doucument _site/docs/ 2>/dev/null || true
          cp README.md README-fa.md _site/ 2>/dev/null || true
          # rewrite relative links in index for assembled layout
          sed -i 's|href="../Whitpaper|href="docs/Whitpaper|g' _site/index.html
          sed -i 's|href="../INSTALL|href="docs/INSTALL|g' _site/index.html
          sed -i 's|href="../CHAIN|href="docs/CHAIN|g' _site/index.html
          sed -i 's|href="../|href="docs/|g' _site/index.html
          sed -i 's|href="../../README-fa|href="README-fa|g' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
