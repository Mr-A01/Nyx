name: Deploy docs site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README-fa.md'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/assets
          cp -r docs/site/* _site/
          cp docs/assets/*.svg _site/assets/ 2>/dev/null || true
          cp docs/site/assets/* _site/assets/ 2>/dev/null || true
          cp docs/*.md _site/docs/ 2>/dev/null || true
          cp -r docs/Whitpaper-and-Doucument _site/docs/ 2>/dev/null || true
          cp README.md README-fa.md _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
