<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYX – Professional Documentation</title>
  <link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    /* ===== CSS Variables & Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a12;
      --bg2: #111120;
      --bg3: #1a1a2e;
      --surface: #1e1e32;
      --border: #2a2a44;
      --text: #e0dce8;
      --text2: #a8a4b8;
      --text3: #6a6680;
      --violet: #8b6cf6;
      --violet2: #6d4fe0;
      --violet3: #3d2f7a;
      --purple: #a78bfa;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --cyan: #22d3ee;
      --radius: 10px;
      --shadow: 0 4px 30px rgba(0,0,0,0.4);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-width: 280px;
      --header-height: 64px;
      --font: 'Inter', 'Vazirmatn', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    a { color: var(--violet); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--purple); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--violet3); border-radius: 4px; }

    /* ===== Sidebar ===== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, background 0.3s, border-color 0.3s;
    }
    .sidebar-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-header .logo {
      font-family: var(--mono);
      font-size: 20pt;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
    }
    .sidebar-header .version {
      font-size: 7pt;
      color: var(--text3);
      font-family: var(--mono);
      background: var(--surface);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .sidebar-search {
      padding: 10px 16px 12px;
      position: relative;
      flex-shrink: 0;
    }
    .sidebar-search input {
      width: 100%;
      padding: 7px 12px 7px 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 8.5pt;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .sidebar-search input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(139,108,246,0.15);
    }
    .sidebar-search .search-icon {
      position: absolute;
      left: 26px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 11pt;
    }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 12px;
    }
    .sidebar-nav ul { list-style: none; padding: 0; margin: 0; }
    .sidebar-nav li { margin: 1px 0; }
    .sidebar-nav a {
      display: block;
      padding: 5px 20px 5px 24px;
      border-radius: 4px;
      font-size: 8.5pt;
      color: var(--text2);
      transition: all 0.15s;
      border-left: 2px solid transparent;
      font-weight: 450;
    }
    .sidebar-nav a:hover {
      background: var(--surface);
      color: var(--text);
      border-left-color: var(--violet);
    }
    .sidebar-nav a.active {
      background: var(--surface);
      color: var(--purple);
      border-left-color: var(--purple);
    }
    .sidebar-nav .section-group {
      font-family: var(--mono);
      font-size: 6.5pt;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text3);
      padding: 12px 20px 4px 20px;
      font-weight: 600;
    }
    .sidebar-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      font-size: 6.5pt;
      color: var(--text3);
      text-align: center;
      font-family: var(--mono);
      flex-shrink: 0;
    }

    /* ===== Main Content ===== */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 0 48px 60px;
      max-width: 1100px;
      background: var(--bg);
      transition: background 0.3s;
    }

    /* ===== Top Bar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      backdrop-filter: blur(12px);
      background: rgba(10,10,18,0.85);
      transition: background 0.3s, border-color 0.3s;
    }
    .topbar .breadcrumb {
      font-size: 8.5pt;
      color: var(--text3);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar .breadcrumb span { color: var(--text2); }
    .topbar .breadcrumb .sep { color: var(--violet3); }
    .topbar .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .topbar .controls button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 4px 14px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 7.5pt;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .topbar .controls button:hover {
      border-color: var(--violet3);
      color: var(--purple);
    }
    .topbar .controls .lang-btn {
      border-color: var(--violet3);
      color: var(--purple);
      min-width: 70px;
    }
    .topbar .controls .lang-btn:hover { background: var(--violet3); color: var(--bg); }
    .topbar .controls .level-btn {
      border-color: var(--green);
      color: var(--green);
      min-width: 90px;
    }
    .topbar .controls .level-btn:hover { background: var(--green); color: var(--bg); }
    .topbar .controls .theme-btn {
      border-color: var(--blue);
      color: var(--blue);
      min-width: 70px;
    }
    .topbar .controls .theme-btn:hover { background: var(--blue); color: var(--bg); }
    .topbar .controls .print-btn {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .topbar .controls .print-btn:hover { background: var(--yellow); color: var(--bg); }
    .menu-toggle {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 4px 12px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 10pt;
      cursor: pointer;
    }

    /* ===== Sections ===== */
    .section {
      margin-bottom: 48px;
      scroll-margin-top: 80px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section .section-tag {
      font-family: var(--mono);
      font-size: 7.5pt;
      color: var(--violet3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .section h2 {
      font-size: 22pt;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border);
      transition: color 0.3s, border-color 0.3s;
      letter-spacing: -0.01em;
    }
    .section h3 {
      font-size: 14pt;
      font-weight: 600;
      color: var(--purple);
      margin: 18px 0 8px;
    }
    .section h4 {
      font-size: 11pt;
      font-weight: 600;
      color: var(--text);
      margin: 12px 0 4px;
    }
    .section p {
      font-size: 9.5pt;
      line-height: 1.8;
      color: var(--text2);
      margin-bottom: 10px;
    }
    .section strong { color: var(--text); font-weight: 600; }
    .section em { color: var(--purple); font-style: italic; }
    .section code {
      font-family: var(--mono);
      font-size: 8pt;
      background: var(--surface);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--purple);
      border: 1px solid var(--border);
    }
    .section pre {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 10px 0 14px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 7.5pt;
      line-height: 1.7;
      color: var(--text2);
      position: relative;
      transition: background 0.3s, border-color 0.3s;
    }
    .section pre .copy-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 6pt;
      cursor: pointer;
      font-family: var(--mono);
      transition: all 0.2s;
      opacity: 0.5;
    }
    .section pre .copy-btn:hover { opacity: 1; color: var(--purple); border-color: var(--violet3); }
    .section pre code { background: none; border: none; padding: 0; font-size: 7.5pt; color: var(--text2); }
    .kw { color: var(--violet); }
    .str { color: var(--green); }
    .num { color: var(--yellow); }
    .cmt { color: var(--text3); }
    .typ { color: var(--blue); }

    .section .tbl-wrap {
      overflow-x: auto;
      margin: 12px 0 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: border-color 0.3s;
    }
    .section table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.5pt;
    }
    .section thead { background: var(--bg3); transition: background 0.3s; }
    .section th {
      font-family: var(--mono);
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .section td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
      vertical-align: top;
      font-size: 8.5pt;
      line-height: 1.6;
      transition: color 0.3s;
    }
    .section tr:last-child td { border-bottom: none; }

    .section ul, .section ol {
      margin: 6px 0 12px 20px;
      color: var(--text2);
      font-size: 9pt;
    }
    .section li { margin-bottom: 4px; line-height: 1.7; }
    .section li::marker { color: var(--violet3); }

    .section .callout {
      border-radius: var(--radius);
      padding: 12px 16px;
      margin: 12px 0;
      border-left: 4px solid;
      font-size: 8.5pt;
      background: rgba(255,255,255,0.02);
      transition: background 0.3s, border-color 0.3s;
    }
    .section .callout p { font-size: 8.5pt; margin-bottom: 0; }
    .section .callout-info { border-color: var(--blue); background: rgba(96,165,250,0.05); }
    .section .callout-warn { border-color: var(--yellow); background: rgba(251,191,36,0.05); }
    .section .callout-danger { border-color: var(--red); background: rgba(248,113,113,0.05); }
    .section .callout-ok { border-color: var(--green); background: rgba(74,222,128,0.05); }
    .section .callout-title {
      font-family: var(--mono);
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .callout-info .callout-title { color: var(--blue); }
    .callout-warn .callout-title { color: var(--yellow); }
    .callout-danger .callout-title { color: var(--red); }
    .callout-ok .callout-title { color: var(--green); }

    .section .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 6pt;
      padding: 1px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge-mvp { background: rgba(74,222,128,0.15); color: var(--green); border-color: rgba(74,222,128,0.3); }
    .badge-future { background: rgba(96,165,250,0.15); color: var(--blue); border-color: rgba(96,165,250,0.3); }
    .badge-exp { background: rgba(251,191,36,0.15); color: var(--yellow); border-color: rgba(251,191,36,0.3); }
    .badge-crit { background: rgba(248,113,113,0.15); color: var(--red); border-color: rgba(248,113,113,0.3); }
    .badge-stable { background: rgba(74,222,128,0.1); color: var(--green); border-color: rgba(74,222,128,0.2); }

    .section .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin: 14px 0;
    }
    .section .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }
    .section .card:hover { transform: translateY(-2px); border-color: var(--violet3); }
    .section .card h4 { margin-top: 0; font-size: 10.5pt; }
    .section .card p { font-size: 8.5pt; margin-bottom: 4px; }

    .section .diagram {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 12px 0;
      font-family: var(--mono);
      font-size: 7pt;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: var(--text2);
      transition: background 0.3s, border-color 0.3s;
    }
    .section .diagram .hl { color: var(--purple); }
    .section .diagram .dm { color: var(--text3); }

    .section .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px 3px 8px;
      border-radius: 20px;
      font-size: 7.5pt;
      font-family: var(--mono);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .status-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }

    /* ===== RTL ===== */
    [dir="rtl"] .sidebar { left: auto; right: 0; border-right: none; border-left: 1px solid var(--border); }
    [dir="rtl"] .main { margin-left: 0; margin-right: var(--sidebar-width); }
    [dir="rtl"] .sidebar-search .search-icon { left: auto; right: 26px; }
    [dir="rtl"] .sidebar-nav a { border-left: none; border-right: 2px solid transparent; }
    [dir="rtl"] .sidebar-nav a:hover, [dir="rtl"] .sidebar-nav a.active { border-right-color: var(--violet); }
    [dir="rtl"] .section ul, [dir="rtl"] .section ol { margin: 6px 20px 12px 0; }
    [dir="rtl"] .section .callout { border-left: none; border-right: 4px solid; }
    [dir="rtl"] .section th, [dir="rtl"] .section td { text-align: right; }
    [dir="rtl"] .section pre, [dir="rtl"] .section code { direction: ltr; text-align: left; }
    [dir="rtl"] .topbar .controls { direction: rtl; }
    [dir="rtl"] .topbar .breadcrumb { direction: rtl; }
    [dir="rtl"] .section .diagram { direction: ltr; text-align: left; }

    /* ===== Themes ===== */
    .theme-light {
      --bg: #f5f5f0; --bg2: #ebebe6; --bg3: #e0e0db; --surface: #d8d8d3;
      --border: #c8c8c0; --text: #1a1a2e; --text2: #3a3a50; --text3: #7a7a90;
      --violet: #5b3fd4; --violet2: #4a30b8; --violet3: #8b7bc8; --purple: #6d4fe0;
      --green: #2d8f4e; --yellow: #b8860b; --red: #b22222; --blue: #1e5fa8; --cyan: #1a7a8a;
    }
    .theme-highcontrast {
      --bg: #000000; --bg2: #1a1a1a; --bg3: #2a2a2a; --surface: #333333;
      --border: #666666; --text: #ffffff; --text2: #eeeeee; --text3: #cccccc;
      --violet: #cc99ff; --violet2: #aa77dd; --violet3: #8855bb; --purple: #bb88ff;
      --green: #66ff99; --yellow: #ffff66; --red: #ff6666; --blue: #66b3ff; --cyan: #66ffff;
    }
    .theme-terminal {
      --bg: #0c0c0c; --bg2: #181818; --bg3: #222222; --surface: #2a2a2a;
      --border: #3a3a3a; --text: #b3b3b3; --text2: #8a8a8a; --text3: #5a5a5a;
      --violet: #b3a0ff; --violet2: #8a7ad0; --violet3: #6a5a9a; --purple: #a080ff;
      --green: #80ff80; --yellow: #ffff80; --red: #ff8080; --blue: #80b3ff; --cyan: #80ffff;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
        border-right: 1px solid var(--border);
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 0 16px 40px; }
      .topbar { padding: 8px 0; flex-direction: column; align-items: stretch; }
      .topbar .controls { justify-content: center; }
      .menu-toggle { display: inline-block; }
      .section .card-grid { grid-template-columns: 1fr; }
      .section h2 { font-size: 18pt; }
    }
    @media print {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px; }
      .topbar .controls { display: none; }
      .menu-toggle { display: none; }
      .section { break-inside: avoid; page-break-inside: avoid; }
      .section .tbl-wrap, .section pre, .section .callout, .section .card, .section .diagram { break-inside: avoid; }
      body { background: white; }
      .section h2 { break-after: avoid; }
      .topbar { background: white; border-bottom: 1px solid #ccc; backdrop-filter: none; }
    }

    /* ===== Scroll progress ===== */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--violet), var(--purple));
      z-index: 999;
      transition: width 0.1s;
    }
    .scroll-progress.rtl { left: auto; right: 0; }
  </style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">NYX</span>
    <span class="version">v3.0</span>
  </div>
  <div class="sidebar-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search documentation..." data-i18n="sidebar.search">
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <ul id="navList">
      <!-- Generated by JS -->
    </ul>
  </nav>
  <div class="sidebar-footer" data-i18n="sidebar.footer">© 2025 · Open Source</div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main" id="mainContent">

  <!-- ===== TOP BAR ===== -->
  <div class="topbar" id="topbar">
    <div class="breadcrumb" id="breadcrumb">
      <span data-i18n="breadcrumb.home">Docs</span>
      <span class="sep">/</span>
      <span id="breadcrumbCurrent" data-i18n="breadcrumb.overview">Overview</span>
    </div>
    <div class="controls">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" data-i18n="sidebar.menu">☰</button>
      <button class="theme-btn" onclick="toggleTheme()" data-i18n="toolbar.theme">◐ Theme</button>
      <button class="lang-btn" id="langToggle" onclick="toggleLanguage()" data-i18n="toolbar.lang">🇬🇧 EN</button>
      <button class="level-btn" id="levelToggle" onclick="toggleLevel()" data-i18n="toolbar.level">🔬 Pro</button>
      <button class="print-btn" onclick="window.print()" data-i18n="toolbar.print">⎙ Print</button>
    </div>
  </div>

  <!-- ===== CONTENT CONTAINER ===== -->
  <div id="sectionsContainer"></div>

  <!-- ===== FOOTER ===== -->
  <hr style="border-color:var(--border); margin:40px 0 12px;">
  <p style="text-align:center; font-size:8pt; color:var(--text3);" data-i18n="footer">NYX Documentation · v3.0 · Open Source · 2025</p>
</main>

<!-- ============================================================ -->
<!-- ===== SCRIPTS ===== -->
<script>
  // =============================================================
  // 1. SECTION DATA (with IDs, labels, groups)
  // =============================================================
  const sectionsData = [
    { id: 'overview', label: 'Overview', group: 'Core' },

  // =============================================================
  // 4. BUILD NAVIGATION
  // =============================================================
  function buildNav() {
    const navList = document.getElementById('navList');
    navList.innerHTML = '';
    const groups = {};
    sectionsData.forEach(sec => {
      if (!groups[sec.group]) groups[sec.group] = [];
      groups[sec.group].push(sec);
    });
    for (const [group, items] of Object.entries(groups)) {
      const liGroup = document.createElement('li');
      liGroup.className = 'section-group';
      liGroup.textContent = group;
      navList.appendChild(liGroup);
      items.forEach(sec => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#section-' + sec.id;
        a.dataset.section = sec.id;
        a.textContent = sec.label;
        a.addEventListener('click', (e) => {
          document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
          a.classList.add('active');
          if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
          document.getElementById('breadcrumbCurrent').textContent = sec.label;
        });
        li.appendChild(a);
        navList.appendChild(li);
      });
    }
    // Highlight active on scroll
    const sections = document.querySelectorAll('.section');
    const navLinks = document.querySelectorAll('.sidebar-nav a');
    window.addEventListener('scroll', () => {
      let currentId = '';
      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top <= 100) currentId = sec.id.replace('section-', '');
      });
      navLinks.forEach(link => {
        link.classList.toggle('active', link.dataset.section === currentId);
      });
      if (currentId) {
        const label = sectionsData.find(s => s.id === currentId)?.label || currentId;
        document.getElementById('breadcrumbCurrent').textContent = label;
      }
    });
  }

              <tr><td><code>/trust/servers</code></td><td>GET</td><td data-i18n="api.r8c3">Trust/reputation</td></tr>
              <tr><td><code>/updates/manifest</code></td><td>GET</td><td data-i18n="api.r9c3">Update manifest</td></tr>
              <tr><td><code>/ledger/submit</code></td><td>POST</td><td data-i18n="api.r10c3">Token transaction</td></tr>
              <tr><td><code>/health</code></td><td>GET</td><td data-i18n="api.r11c3">Health check</td></tr>
            </tbody>
          </table>
        </div>
      `,
      federation: `
        <div class="section-tag" data-i18n="fed.tag">Federation</div>
        <h2 data-i18n="fed.title">Multi‑Relay Federation</h2>
        <p data-i18n="fed.p1">Clients connect to multiple relays and select routes based on a composite score (latency, reputation, uptime, trust).</p>
        <div class="diagram">Server selection score = w1*latency + w2*packet_loss + w3*uptime + w4*reputation + w5*capacity + w6*trust + ...</div>
        <p data-i18n="fed.discovery">Server discovery uses bootstrap lists, local config, and dynamic endpoints with signed updates.</p>
      `,
      'trust-reputation': `
        <div class="section-tag" data-i18n="trust.tag">Trust</div>
        <h2 data-i18n="trust.title">Trust Architecture & Reputation</h2>
        <p data-i18n="trust.p1">Trust levels: Unknown (0) → Registered (1) → Verified (2) → Trusted (3) → Authority (4). Admin servers use multi‑sig quorum.</p>
        <p data-i18n="trust.rep">Reputation is computed from uptime, delivery reliability, integrity, validator attestations, health checks, historical behavior, and audits.</p>
        <p data-i18n="trust.detection">Malicious behaviour (forged messages, modification, downtime, spam, integrity mismatch, fake identity) triggers reputation penalties and possible revocation.</p>
      `,
      integrity: `
        <div class="section-tag" data-i18n="integrity.tag">Integrity</div>
        <h2 data-i18n="integrity.title">Software Integrity & Merkle Trees</h2>
        <p data-i18n="integrity.p1">NYX uses layered integrity: source‑tree, artifact, runtime, environment, and configuration. Each release has a signed manifest with file hashes and a Merkle root.</p>
        <ul>
          <li data-i18n="integrity.li1">Modified files (hash mismatch)</li>
          <li data-i18n="integrity.li2">Missing or unexpected files</li>
          <li data-i18n="integrity.li3">Modified PHP code (per‑file hash)</li>
          <li data-i18n="integrity.li4">Downgraded versions (version constraint)</li>
          <li data-i18n="integrity.li5">Unapproved plugins (signature verification)</li>
        </ul>
      `,
      updates: `
        <div class="section-tag" data-i18n="updates.tag">Updates</div>
        <h2 data-i18n="updates.title">Auto‑Update System</h2>
        <p data-i18n="updates.p1">Updates are signed with Ed25519. The client verifies the manifest, artifact hash, version constraints, and TLS transport. Rollback is automatic on health check failure.</p>
        <p data-i18n="updates.chain">Offline root key → Release signing key → Signed manifest → Artifact download → Client verification.</p>
      `,
      deployment: `
        <div class="section-tag" data-i18n="deploy.tag">Deployment</div>
        <h2 data-i18n="deploy.title">Production Deployment</h2>
        <p data-i18n="deploy.p1">NYX can be deployed at various scales. The required stack includes Linux, PHP 8.3+ with Swoole, PostgreSQL, Redis, Nginx/Caddy, Vault, Prometheus, and Grafana.</p>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th data-i18n="deploy.table.scale">Scale</th><th data-i18n="deploy.table.users">Users</th><th data-i18n="deploy.table.arch">Architecture</th></tr></thead>
            <tbody>
              <tr><td data-i18n="deploy.r1c1">Local Dev</td><td>~10</td><td data-i18n="deploy.r1c3">Docker Compose: PHP + PostgreSQL + Redis</td></tr>
              <tr><td data-i18n="deploy.r2c1">Small</td><td>~1,000</td><td data-i18n="deploy.r2c3">3–5 relays, basic federation</td></tr>
              <tr><td data-i18n="deploy.r3c1">Medium</td><td>~10,000</td><td data-i18n="deploy.r3c3">10–20 relays, geo‑distributed, read replicas</td></tr>
              <tr><td data-i18n="deploy.r4c1">Large</td><td>~100,000</td><td data-i18n="deploy.r4c3">50+ relays, validator cluster, sharded DB</td></tr>
              <tr><td data-i18n="deploy.r5c1">Massive</td><td>1,000,000+</td><td data-i18n="deploy.r5c3">Global federation, edge caching, full sharding</td></tr>
            </tbody>
          </table>
        </div>
        <p data-i18n="deploy.reqs">Production Requirements: Linux, PHP 8.3+ with Swoole, PostgreSQL 16+, Redis 7+, Nginx/Caddy, Vault, Prometheus, Grafana, structured JSON logging.</p>
      `,
      plugins: `
        <div class="section-tag" data-i18n="plugins.tag">Plugins</div>
        <h2 data-i18n="plugins.title">Plugin System</h2>
        <p data-i18n="plugins.p1">Plugins are signed bundles with permission manifests. They run in a strict sandbox with limited capabilities.</p>
        <p data-i18n="plugins.manifest">Manifest includes plugin_id, version, author, signature, permissions, sandbox level, and trust level.</p>
        <pre><code><span class="cmt">// Plugin manifest example</span>
{
  <span class="str">"plugin_id"</span>: <span class="str">"my-plugin"</span>,
  <span class="str">"version"</span>: <span class="str">"1.0.0"</span>,
  <span class="str">"permissions"</span>: [<span class="str">"ui:panel"</span>],
  <span class="str">"sandbox"</span>: <span class="str">"strict"</span>
}</code></pre>
      `,
      'ai-assistant': `
        <div class="section-tag" data-i18n="ai.tag">AI</div>
        <h2 data-i18n="ai.title">Personal AI Assistant</h2>
        <p data-i18n="ai.p1">Optional local/remote AI for coding, debugging, documentation, and diagnostics. Strict permission controls and sandboxing.</p>
        <ul>
          <li data-i18n="ai.li1">Explicit allow‑list for file, commands, network</li>
          <li data-i18n="ai.li2">Prompt‑injection defense via input sanitisation</li>
          <li data-i18n="ai.li3">Auto‑detection and redaction of secrets</li>
          <li data-i18n="ai.li4">Isolated process with limited capabilities</li>
          <li data-i18n="ai.li5">Dangerous commands require explicit confirmation</li>
        </ul>
      `,
      'token-ledger': `
        <div class="section-tag" data-i18n="token.tag">Token</div>
        <h2 data-i18n="token.title">NYX Token & Distributed Ledger</h2>
        <p data-i18n="token.p1">The NYX token is a utility credit for anti‑spam, relay rewards, governance, and reputation staking. The ledger uses committee‑based BFT consensus (not PoW).</p>
        <ul>
          <li data-i18n="token.li1"><strong>Transaction Fee</strong>: 0.01 NYX base + size‑based fee.</li>
          <li data-i18n="token.li2"><strong>Fee Distribution</strong>: 60% validators, 30% relay operators, 10% burn.</li>
          <li data-i18n="token.li3"><strong>Chat Messages</strong>: FREE (no token cost).</li>
          <li data-i18n="token.li4"><strong>Consensus</strong>: Rotating committee of trusted validators, BFT with finality in <5 seconds.</li>
        </ul>
      `,
      security: `
        <div class="section-tag" data-i18n="security.tag">Security</div>
        <h2 data-i18n="security.title">Security Model & Threat Mitigations</h2>
        <p data-i18n="security.p1">Defence‑in‑depth. Main threats and mitigations:</p>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th data-i18n="security.table.actor">Threat Actor</th><th data-i18n="security.table.mitigation">Mitigation</th><th data-i18n="security.table.residual">Residual Risk</th></tr></thead>
            <tbody>
              <tr><td data-i18n="security.r1c1">Malicious user</td><td data-i18n="security.r1c2">Signatures, rate limits, abuse system</td><td data-i18n="security.r1c3">Low</td></tr>
              <tr><td data-i18n="security.r2c1">Spammer</td><td data-i18n="security.r2c2">Anti‑Sybil, token costs</td><td data-i18n="security.r2c3">Medium</td></tr>
              <tr><td data-i18n="security.r3c1">Compromised relay</td><td data-i18n="security.r3c2">Multi‑relay, E2EE, reputation</td><td data-i18n="security.r3c3">Medium</td></tr>
              <tr><td data-i18n="security.r4c1">Compromised admin</td><td data-i18n="security.r4c2">Multi‑sig quorum, distributed keys</td><td data-i18n="security.r4c3">Low</td></tr>
              <tr><td data-i18n="security.r5c1">MITM attacker</td><td data-i18n="security.r5c2">TLS + E2EE + cert pinning</td><td data-i18n="security.r5c3">Very low</td></tr>
              <tr><td data-i18n="security.r6c1">Supply‑chain attacker</td><td data-i18n="security.r6c2">Signed releases, integrity verify</td><td data-i18n="security.r6c3">Medium</td></tr>
              <tr><td data-i18n="security.r7c1">Network observer</td><td data-i18n="security.r7c2">Metadata minimization, relay indirection</td><td data-i18n="security.r7c3">Medium</td></tr>
            </tbody>
          </table>
        </div>
        <div class="callout callout-warn">
          <div class="callout-title" data-i18n="security.callout.title">Honest Limitations</div>
          <p data-i18n="security.callout.p">NYX cannot guarantee perfect anonymity, 100% availability, or protection against a compromised endpoint. The system is tamper‑evident, not tamper‑proof.</p>
        </div>
      `,
      devtools: `
        <div class="section-tag" data-i18n="devtools.tag">Developer</div>
        <h2 data-i18n="devtools.title">Developer Features & Plugins</h2>
        <p data-i18n="devtools.p1">NYX includes code snippets, Git integration, AI assistant, plugin system, and webhooks.</p>
        <div class="card-grid">
          <div class="card"><h4 data-i18n="devtools.card1.title">📋 Code Snippets</h4><p data-i18n="devtools.card1.desc">Syntax‑highlighted code blocks with language detection.</p></div>
          <div class="card"><h4 data-i18n="devtools.card2.title">🔗 Git Integration</h4><p data-i18n="devtools.card2.desc">Status, branches, commit logs, and diffs.</p></div>
          <div class="card"><h4 data-i18n="devtools.card3.title">🤖 AI Assistant</h4><p data-i18n="devtools.card3.desc">Local/remote AI for coding, debugging, and documentation.</p></div>
          <div class="card"><h4 data-i18n="devtools.card4.title">🧩 Plugin System</h4><p data-i18n="devtools.card4.desc">Signed plugins with permission manifests and sandboxing.</p></div>
          <div class="card"><h4 data-i18n="devtools.card5.title">📊 Webhooks</h4><p data-i18n="devtools.card5.desc">Incoming and outgoing webhooks for CI/CD and automation.</p></div>
        </div>
      `,
      roadmap: `
        <div class="section-tag" data-i18n="roadmap.tag">Roadmap</div>
        <h2 data-i18n="roadmap.title">Development Roadmap</h2>
        <div class="card-grid">
          <div class="card"><span class="badge badge-mvp" data-i18n="roadmap.badge.mvp">MVP</span><h4 data-i18n="roadmap.phase1.title">Phase 1 – Core Messaging</h4><p data-i18n="roadmap.phase1.desc">Python client, PHP server, DMs, public channels, basic TUI.</p></div>
          <div class="card"><span class="badge badge-future">Phase 2</span><h4 data-i18n="roadmap.phase2.title">Phase 2 – E2EE & Security</h4><p data-i18n="roadmap.phase2.desc">X3DH, Double Ratchet, multi‑device, security audit.</p></div>
          <div class="card"><span class="badge badge-future">Phase 3</span><h4 data-i18n="roadmap.phase3.title">Phase 3 – Federation</h4><p data-i18n="roadmap.phase3.desc">Multi‑relay routing, discovery, cross‑server messaging.</p></div>
          <div class="card"><span class="badge badge-future">Phase 4</span><h4 data-i18n="roadmap.phase4.title">Phase 4 – Integrity & Updates</h4><p data-i18n="roadmap.phase4.desc">Signed releases, Merkle trees, auto‑update with rollback.</p></div>
          <div class="card"><span class="badge badge-future">Phase 5</span><h4 data-i18n="roadmap.phase5.title">Phase 5 – Reputation & Trust</h4><p data-i18n="roadmap.phase5.desc">Reputation system, malicious detection, revocation.</p></div>
          <div class="card"><span class="badge badge-future">Phase 6</span><h4 data-i18n="roadmap.phase6.title">Phase 6 – Developer Platform</h4><p data-i18n="roadmap.phase6.desc">Git, plugins, webhooks, AI assistant.</p></div>
          <div class="card"><span class="badge badge-future">Phase 7</span><h4 data-i18n="roadmap.phase7.title">Phase 7 – Token & Ledger</h4><p data-i18n="roadmap.phase7.desc">NYX token, BFT consensus, rewards.</p></div>
          <div class="card"><span class="badge badge-future">Phase 8</span><h4 data-i18n="roadmap.phase8.title">Phase 8 – Advanced</h4><p data-i18n="roadmap.phase8.desc">AI scaling, governance, anti‑censorship, mobile.</p></div>
        </div>
      `,
      faq: `
        <div class="section-tag" data-i18n="faq.tag">FAQ</div>
        <h2 data-i18n="faq.title">Frequently Asked Questions</h2>
        <div style="margin:12px 0;">
          <h4 data-i18n="faq.q1">Do I need an email to create an account?</h4>
          <p data-i18n="faq.a1">No. NYX uses cryptographic identity keys. No email or third‑party OAuth is required.</p>
          <h4 data-i18n="faq.q2">Is NYX fully decentralized?</h4>
          <p data-i18n="faq.a2">NYX is federated, not fully decentralized. It uses a network of independent relays and trust nodes, but there is no global consensus for chat data — only for the token ledger.</p>
          <h4 data-i18n="faq.q3">How does NYX handle spam?</h4>
          <p data-i18n="faq.a3">NYX uses a combination of reputation systems, rate limiting, token costs for certain actions, and anti‑Sybil mechanisms like identity age and proof‑of‑service.</p>
          <h4 data-i18n="faq.q4">Can I run my own relay?</h4>
          <p data-i18n="faq.a4">Yes. NYX relays are open source and can be run by anyone. The relay will need to be registered and build reputation over time.</p>
          <h4 data-i18n="faq.q5">What happens if my device is lost?</h4>
          <p data-i18n="faq.a5">If you have a recovery key (BIP39 mnemonic), you can recover your identity on a new device. Without it, the identity is unrecoverable.</p>
        </div>
      `,
      changelog: `
        <div class="section-tag" data-i18n="changelog.tag">Changelog</div>
        <h2 data-i18n="changelog.title">Release History</h2>
        <div style="margin:12px 0;">
          <h4 data-i18n="changelog.v3.1">v3.1.0 – 2025-03-15</h4>
          <p data-i18n="changelog.v3.1.desc">Added PQXDH post‑quantum key agreement, improved federation routing, fixed memory leak in sync manager.</p>
          <h4 data-i18n="changelog.v3.0">v3.0.0 – 2025-01-20</h4>
          <p data-i18n="changelog.v3.0.desc">Major rewrite: new architecture, E2EE by default, token ledger, plugin system, AI assistant.</p>
          <h4 data-i18n="changelog.v2.5">v2.5.0 – 2024-11-01</h4>
          <p data-i18n="changelog.v2.5.desc">Added multi‑device support, improved terminal UI, initial reputation system.</p>
          <h4 data-i18n="changelog.v2.0">v2.0.0 – 2024-08-15</h4>
          <p data-i18n="changelog.v2.0.desc">First public beta: basic messaging, federation, CLI client.</p>
        </div>
      `,
      appendices: `
        <div class="section-tag" data-i18n="appendix.tag">Appendix</div>
        <h2 data-i18n="appendix.title">Appendices</h2>
        <h3 data-i18n="appendix.h3.a">A. Configuration Example (client)</h3>
        <pre><code><span class="cmt"># ~/.config/nyx/config.toml</span>
[identity]
key_storage = "encrypted-sqlite"
auto_lock_timeout = 300

[network]
default_server = "nyx://relay1.nyx.network"
max_relays = 5

[security]
require_verified_relay = true</code></pre>
        <h3 data-i18n="appendix.h3.b">B. CLI Commands Reference</h3>
        <ul>
          <li><code>/help</code> – Show help</li>
          <li><code>/server switch &lt;relay&gt;</code> – Switch relay</li>
          <li><code>/dm &lt;user&gt; &lt;msg&gt;</code> – Send DM</li>
          <li><code>/join &lt;channel&gt;</code> – Join channel</li>
          <li><code>/update check</code> – Check updates</li>
          <li><code>/ai ask &lt;question&gt;</code> – Ask AI</li>
        </ul>
        <h3 data-i18n="appendix.h3.c">C. Cryptographic Inventory</h3>
        <ul>
          <li>Ed25519 – Identity & device signatures</li>
          <li>X25519 – Key agreement (with X‑Wing PQ)</li>
          <li>XChaCha20‑Poly1305 – Message encryption</li>
          <li>BLAKE3 – Hashing & Merkle trees</li>
          <li>HKDF‑SHA256 – Key derivation</li>
          <li>TLS 1.3 – Transport security</li>
        </ul>
        <h3 data-i18n="appendix.h3.d">D. Glossary of Terms</h3>
        <ul>
          <li><strong>Relay</strong>: A server that routes messages between clients.</li>
          <li><strong>Federation</strong>: Inter‑relay communication.</li>
          <li><strong>E2EE</strong>: End‑to‑end encryption.</li>
          <li><strong>BFT</strong>: Byzantine Fault Tolerance.</li>
          <li><strong>PoW</strong>: Proof‑of‑Work (not used).</li>
          <li><strong>Sybil</strong>: Attack where one entity creates many fake identities.</li>
        </ul>
      `
    };

    // Build sections in order
    sectionsData.forEach(sec => {
      const sectionDiv = document.createElement('section');
      sectionDiv.id = 'section-' + sec.id;
      sectionDiv.className = 'section';
      sectionDiv.innerHTML = templates[sec.id] || '<p>Section content not found.</p>';
      // Add copy buttons to pre blocks
      sectionDiv.querySelectorAll('pre').forEach(pre => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', () => {
          const code = pre.querySelector('code')?.textContent || pre.textContent;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = '✓';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          });
        });
        pre.appendChild(btn);
      });
      container.appendChild(sectionDiv);
    });
  }

  // =============================================================
  // 6. TRANSLATION APPLICATION
  // =============================================================
  function applyTranslations() {
    const t = translations[currentLang]?.[currentLevel] || translations['en']['pro'];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) {
        if (['P','H1','H2','H3','H4','LI','TD','TH','DIV','SPAN'].includes(el.tagName)) {
          el.innerHTML = t[key];
        } else {
          el.textContent = t[key];
        }
      }
    });
    document.documentElement.lang = currentLang;
    document.documentElement.dir = (currentLang === 'fa') ? 'rtl' : 'ltr';
    document.getElementById('langToggle').textContent = (currentLang === 'fa') ? '🇮🇷 فارسی' : '🇬🇧 EN';
    document.getElementById('levelToggle').textContent = (currentLevel === 'pro') ? '🔬 Pro' : '📘 Simple';
    // Update search placeholder
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.placeholder = t['sidebar.search'] || 'Search...';
    }
  }

  // =============================================================
  // 7. THEME
  // =============================================================
  function applyTheme(theme) {
    document.documentElement.className = 'theme-' + theme;
    localStorage.setItem('nyxDocTheme', theme);
    currentTheme = theme;
  }

  // =============================================================
  // 8. SIDEBAR TOGGLE (mobile)
  // =============================================================
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  // =============================================================
  // 9. SEARCH
  // =============================================================
  function setupSearch() {
    const input = document.getElementById('searchInput');
    const navLinks = document.querySelectorAll('.sidebar-nav a');
    input.addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      navLinks.forEach(link => {
        const text = link.textContent.toLowerCase();
        const parent = link.parentElement;
        if (q === '' || text.includes(q)) {
          parent.style.display = '';
        } else {
          parent.style.display = 'none';
        }
      });
      // Show/hide group labels
      const groups = document.querySelectorAll('.section-group');
      groups.forEach(group => {
        let hasVisible = false;
        let next = group.nextElementSibling;
        while (next && !next.classList.contains('section-group')) {
          if (next.style.display !== 'none') hasVisible = true;
          next = next.nextElementSibling;
        }
        group.style.display = hasVisible ? '' : 'none';
      });
    });
  }

  // =============================================================
  // 10. SCROLL PROGRESS
  // =============================================================
  function setupScrollProgress() {
    const bar = document.getElementById('scrollProgress');
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      bar.style.width = progress + '%';
      if (document.documentElement.dir === 'rtl') {
        bar.style.left = 'auto';
        bar.style.right = '0';
      } else {
        bar.style.left = '0';
        bar.style.right = 'auto';
      }
    });
  }

  // =============================================================
  // 11. TOGGLES (global)
  // =============================================================
  function toggleLanguage() {
    currentLang = (currentLang === 'en') ? 'fa' : 'en';
    localStorage.setItem('nyxDocLang', currentLang);
    applyTranslations();
  }
  function toggleLevel() {
    currentLevel = (currentLevel === 'pro') ? 'simple' : 'pro';
    localStorage.setItem('nyxDocLevel', currentLevel);
    applyTranslations();
  }
  function toggleTheme() {
    const themes = ['dark', 'light', 'highcontrast', 'terminal'];
    let idx = themes.indexOf(currentTheme);
    idx = (idx + 1) % themes.length;
    currentTheme = themes[idx];
    applyTheme(currentTheme);
  }

  // =============================================================
  // 12. INIT
  // =============================================================
  function init() {
    buildNav();
    buildContent();
    applyTheme(currentTheme);
    applyTranslations();
    setupSearch();
    setupScrollProgress();
    // Close sidebar on outside click (mobile)
    document.addEventListener('click', function(e) {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
        if (!sidebar.contains(e.target) && !e.target.closest('.menu-toggle')) {
          sidebar.classList.remove('open');
        }
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Expose toggles
  window.toggleLanguage = toggleLanguage;
  window.toggleLevel = toggleLevel;
  window.toggleTheme = toggleTheme;
  window.toggleSidebar = toggleSidebar;

  console.log('✅ NYX Professional Documentation loaded.');
</script>
