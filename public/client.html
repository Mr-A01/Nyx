:root{
  --bg:#08090E; --bg-soft:#0C0E15; --surface:#0F1119; --surface-2:#141724;
  --line:rgba(255,255,255,0.06); --line-strong:rgba(255,255,255,0.11);
  --text:#E7EBF3; --text-2:#8B93A7; --text-3:#5A6178;
  --accent:#7FA8F0; --accent-soft:rgba(127,168,240,0.12); --violet:#9B8CF6;
  --ok:#4ADE80; --warn:#FBBF24; --crit:#F87171; --muted:#64748B;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:12px; --ease:cubic-bezier(0.32,0.72,0,1);
  --sbw:238px; --rpw:0px;
}
[data-theme="light"]{
  --bg:#FAFBFD; --bg-soft:#F4F6FA; --surface:#FFFFFF; --surface-2:#F1F4F9;
  --line:rgba(15,23,42,0.08); --line-strong:rgba(15,23,42,0.14);
  --text:#0F172A; --text-2:#5B6478; --text-3:#94A0B5;
  --accent:#3B6FD4; --accent-soft:rgba(59,111,212,0.1); --violet:#6D5BD0;
  --ok:#16A34A; --warn:#D97706; --crit:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-feature-settings:'tnum' 1}
mark{background:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--text);border-radius:2px;padding:0 1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

body.compact .convrow{padding:7px 9px}
body.compact .bubble{padding:6px 11px;font-size:12.5px}
body.compact .card{padding:11px 13px}
body.compact .wshead{height:50px}
body.compact .timeline{padding:10px 0 6px}

#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
.ldw{display:flex;flex-direction:column;align-items:center;gap:20px}
.ldm{width:60px;height:60px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
.ldt{font-size:12px;font-weight:600;letter-spacing:.5em;padding-inline-start:.5em}
.lds{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--text-3);text-transform:uppercase}

.app{display:grid;height:100dvh;
  grid-template-columns:var(--sbw) 322px minmax(0,1fr) var(--rpw);
  grid-template-rows:52px minmax(0,1fr);
  grid-template-areas:"brand header header header" "side list main right";
  transition:grid-template-columns .32s var(--ease)}
body.sb-collapsed{--sbw:60px}
body.right-open{--rpw:336px}

.brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);background:var(--surface);overflow:hidden;min-width:0}
.brand .moon{width:24px;height:24px;flex-shrink:0}
.brand .bt{font-size:12px;font-weight:600;letter-spacing:.24em;white-space:nowrap;transition:opacity .22s var(--ease)}
.brand .bt small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--text-3);font-weight:400;margin-top:1px}
.brand .tog{margin-inline-start:auto;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);flex-shrink:0;transition:background .15s}
.brand .tog:hover{background:var(--surface-2);color:var(--text)}
.brand .tog svg{width:15px;height:15px;transition:transform .3s var(--ease)}
body.sb-collapsed .brand{padding:0;justify-content:center}
body.sb-collapsed .brand .bt{opacity:0;width:0;pointer-events:none}
body.sb-collapsed .brand .tog{margin:0}
body.sb-collapsed .brand .tog svg{transform:rotate(180deg)}

.side{grid-area:side;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.sidenav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;scrollbar-width:thin}
.navgroup{margin-bottom:12px}
.navgroup-t{font-family:var(--mono);font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-3);padding:8px 11px 5px;white-space:nowrap;transition:opacity .2s}
body.sb-collapsed .navgroup-t{opacity:0;height:14px;padding:4px 0 0}
.navitem{width:100%;display:flex;align-items:center;gap:11px;padding:7.5px 10px;border-radius:9px;color:var(--text-2);font-size:12.5px;font-weight:450;transition:background .14s,color .14s;position:relative;white-space:nowrap;text-align:start}
.navitem svg{width:15.5px;height:15.5px;flex-shrink:0}
.navitem:hover{background:var(--surface-2);color:var(--text)}
.navitem.on{background:var(--accent-soft);color:var(--accent)}
.navitem.on::before{content:'';position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);width:2.5px;height:16px;border-radius:2px;background:var(--accent);box-shadow:0 0 7px var(--accent)}
.navitem .lbl{overflow:hidden;text-overflow:ellipsis}
.navitem .nb{margin-inline-start:auto;font-family:var(--mono);font-size:9px;font-weight:600;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#08090E;display:grid;place-items:center}
.navitem .nb.soft{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-strong)}
.navitem .nb.crit{background:var(--crit);color:#fff}
body.sb-collapsed .navitem{justify-content:center;padding:9px 0}
body.sb-collapsed .navitem .lbl,body.sb-collapsed .navitem .nb{display:none}
body.sb-collapsed .navitem .nbdot{position:absolute;top:5px;inset-inline-end:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
body:not(.sb-collapsed) .nbdot{display:none}
.acc{border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s;overflow:hidden;flex-shrink:0}
.acc:hover{background:var(--surface-2)}
.acc .an{min-width:0;flex:1}
.acc .n1{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .n2{font-family:var(--mono);font-size:9px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.acc .chev{color:var(--text-3);flex-shrink:0;transition:transform .2s;display:flex}
.acc:hover .chev{transform:rotate(180deg)}
body.sb-collapsed .acc{justify-content:center}
body.sb-collapsed .acc .an,body.sb-collapsed .acc .chev{display:none}
.pres{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}.pres.recent{background:#fbbf24}.pres.away{background:#94a3b8}
.pres.online{background:var(--ok);box-shadow:0 0 5px var(--ok)}
.pres.away{background:var(--warn)}
.pres.offline{background:var(--text-3)}

.av{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#EDF2FC;flex-shrink:0;user-select:none;line-height:1}
.av.s26{width:26px;height:26px;font-size:9px}.av.s30{width:30px;height:30px;font-size:10px}
.av.s32{width:32px;height:32px;font-size:11px}.av.s34{width:34px;height:34px;font-size:11.5px}
.av.s40{width:40px;height:40px;font-size:13px}.av.s48{width:48px;height:48px;font-size:15px}
.av.s64{width:64px;height:64px;font-size:20px}
.av.shaped{border-radius:30%}
.av svg{width:52%;height:52%}
.av.saved{background:linear-gradient(140deg,hsl(226 46% 36%),hsl(255 48% 27%))}
.av-wrap{position:relative;flex-shrink:0;display:inline-flex}
.av-wrap .pres{position:absolute;bottom:-1px;inset-inline-end:-1px;border:2px solid var(--surface);width:10px;height:10px}

.hdr{grid-area:header;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);min-width:0;z-index:30}
#mob-menu,#mob-back{display:none}
.hdr .ht{min-width:0;flex:1}
.hdr .htitle{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hsub{font-family:var(--mono);font-size:9px;color:var(--text-3);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hdr-r{margin-inline-start:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:100px;white-space:nowrap;border:1px solid;transition:all .2s}
.mode-chip.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent);background:color-mix(in srgb,var(--warn) 6%,transparent)}
.mode-chip.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent);background:color-mix(in srgb,var(--ok) 6%,transparent)}
.mode-chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.conn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);border:1px solid var(--line-strong);background:var(--surface);padding:4px 10px;border-radius:100px;white-space:nowrap;transition:all .2s}
.conn:hover{border-color:var(--text-3)}
.conn .dot{width:5.5px;height:5.5px;border-radius:50%;background:var(--muted)}
.conn.connected .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.conn.connecting .dot,.conn.reconnecting .dot{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.conn.offline .dot{background:var(--crit)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);transition:all .15s;position:relative;flex-shrink:0}
.hbtn:hover{background:var(--surface-2);color:var(--text)}
.hbtn svg{width:15px;height:15px}
.hbtn .bdot{position:absolute;top:4px;inset-inline-end:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg);display:none}
.hbtn .bdot.on{display:block}

.listcol{grid-area:list;background:var(--bg-soft);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.listhead{display:flex;align-items:center;gap:6px;padding:12px 14px 8px}
.listhead h2{font-size:13.5px;font-weight:600;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);border:1px solid transparent;transition:all .15s;flex-shrink:0;position:relative}
.icobtn:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.icobtn svg{width:14px;height:14px}
.icobtn .bdot{position:absolute;top:3px;inset-inline-end:3px;width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.icobtn .bdot.on{display:block}
.srch{position:relative;padding:0 14px 10px}
.srch .si{position:absolute;inset-inline-start:25px;top:9px;width:13px;height:13px;color:var(--text-3);pointer-events:none}
.srch input{width:100%;padding:8.5px 32px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12.5px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--text)}
.srch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srch input::placeholder{color:var(--text-3)}
.srch .clr{position:absolute;inset-inline-end:20px;top:7px;width:23px;height:23px;display:none;place-items:center;border-radius:6px;color:var(--text-3)}
.srch .clr.on{display:grid}
.srch .clr:hover{color:var(--text);background:var(--surface-2)}
.srch kbd{position:absolute;inset-inline-end:23px;top:9px;font-family:var(--mono);font-size:8.5px;color:var(--text-3);border:1px solid var(--line);padding:1px 5px;border-radius:4px;pointer-events:none}
.srch .spin{position:absolute;inset-inline-end:22px;top:9px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;display:none}
.srch.loading .spin{display:block}
.srch.loading kbd{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cats{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;align-items:center;flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:5.5px;padding:4.5px 11px;border-radius:100px;font-size:11.5px;font-weight:450;color:var(--text-2);border:1px solid transparent;white-space:nowrap;transition:all .15s var(--ease)}
.cat:hover{color:var(--text);background:var(--surface)}
.cat.on{color:var(--text);background:var(--surface-2);border-color:var(--line-strong)}
.cat .g{font-size:9.5px;line-height:1;opacity:.85}
.cat .n{font-family:var(--mono);font-size:9px;color:var(--text-3)}
.cat.on .n{color:var(--accent)}
.cat.manage{color:var(--text-3);font-family:var(--mono);font-size:13px;padding:4px 9px;margin-inline-start:2px}
.cat.manage:hover{color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,transparent)}
.convlist{flex:1;overflow-y:auto;padding:0 8px 14px;min-height:0}
.histbox{padding:4px 6px 10px}
.histbox .ht{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px}
.histbox .ht button{font-size:9px;color:var(--text-3);text-decoration:underline}
.histbox .chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 4px}
.histbox .hchip{font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--surface);border:1px solid var(--line);padding:3px 9px;border-radius:100px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histbox .hchip:hover{border-color:var(--accent);color:var(--accent)}
.histbox .hn{font-size:9.5px;color:var(--text-3);padding:6px 6px 0}
.convrow{display:flex;gap:11px;padding:10px;border-radius:12px;cursor:pointer;position:relative;transition:background .13s,border-color .13s;border:1px solid transparent;margin-bottom:1px;outline:none}
.convrow:hover{background:var(--surface)}
.convrow:focus-visible{border-color:var(--accent)}
.convrow.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 20%,transparent)}
.convrow .cmain{flex:1;min-width:0}
.ctop{display:flex;align-items:baseline;gap:7px}
.cname{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;display:flex;align-items:center;gap:5px;letter-spacing:-.01em}
.cname .pin{color:var(--accent);flex-shrink:0;display:inline-flex}
.cname .pin svg{width:9.5px;height:9.5px}
.ctime{font-family:var(--mono);font-size:9px;color:var(--text-3);flex-shrink:0}
.cbot{display:flex;align-items:center;gap:6px;margin-top:2.5px}
.cprev{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.45}
.cprev .who{color:var(--text-3)}
.cprev .draft{color:var(--warn)}
.cprev .sys{color:var(--text-3);font-style:italic}
.cprev .tick{display:inline-flex;vertical-align:-1.5px;margin-inline-end:3px;color:var(--text-3)}
.cprev .tick.read{color:var(--accent)}
.cprev .tick.failed{color:var(--crit)}
.cicons{display:flex;gap:4px;color:var(--text-3);flex-shrink:0;align-items:center}
.cicons svg{width:11px;height:11px}
.cbadge{font-family:var(--mono);font-size:9px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#08090E;display:grid;place-items:center;flex-shrink:0}
.cbadge.muted{background:var(--text-3);color:var(--bg)}
.cbadge.mention{background:var(--crit);color:#fff}
.convrow.unread .cname{font-weight:650}
.convrow.unread .cprev{color:var(--text)}
.moreb{position:absolute;top:7px;inset-inline-end:5px;width:24px;height:24px;border-radius:7px;display:none;place-items:center;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);z-index:2}
.convrow:hover .moreb,.convrow:focus-within .moreb{display:grid}
.moreb:hover{color:var(--text)}
.moreb svg{width:12px;height:12px}
@media (pointer:coarse){ .moreb{display:grid} }
.sres-t{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px;display:flex;align-items:center;gap:8px}
.sres-t::after{content:'';flex:1;height:1px;background:var(--line)}
.emptylist{padding:46px 26px;text-align:center;color:var(--text-3)}
.emptylist .t{font-size:12.5px;color:var(--text-2);font-weight:500;margin-bottom:5px}
.emptylist .d{font-size:11.5px;line-height:1.6}
.skel-row{display:flex;gap:11px;padding:10px}
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:7px}
@keyframes shim{to{background-position:-200% 0}}

.maincol{grid-area:main;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
.wshead{height:56px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface)}

.wshead .wi:hover{background:var(--surface-2)}
.wshead .wn{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.wshead .ws{font-family:var(--mono);font-size:9.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.wshead .acts{display:flex;gap:2px;flex-shrink:0}
.selectbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--accent-soft);flex-shrink:0}
.selectbar .sc{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.08em}
.selectbar .sacts{margin-inline-start:auto;display:flex;gap:4px}
.pins-wrap{position:relative;flex-shrink:0;z-index:5}
.pins-panel{border-bottom:1px solid var(--line);background:var(--bg);max-height:min(42vh,320px);overflow:auto}
.pins-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.pins-list{padding:6px 8px 10px;display:flex;flex-direction:column;gap:4px}
.pin-item{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:start;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text)}
.pin-item:hover{background:var(--accent-soft)}

.album-2{grid-template-columns:1fr 1fr}
.album-3,.album-4{grid-template-columns:1fr 1fr}
.album-grid .att-img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.lb-wrap{max-width:96vw}
.lb-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.lb-stage{display:flex;justify-content:center;align-items:center;min-height:40vh;background:#000;border-radius:12px;overflow:hidden}
.lb-stage img{max-width:100%;max-height:70vh;transition:transform .2s}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:50vh;overflow:auto}
.gal-item{aspect-ratio:1;overflow:hidden;border-radius:10px;cursor:pointer;background:#111}
.gal-item img,.gal-item video{width:100%;height:100%;object-fit:cover}
.poll-card,.todo-card,.event-card,.loc-card,.contact-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0;min-width:200px}
.poll-q{font-weight:600;margin-bottom:8px}
.poll-opt{display:flex;justify-content:space-between;width:100%;margin:4px 0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);cursor:pointer}
.poll-opt:hover{border-color:var(--accent)}
.todo-row{display:flex;gap:8px;align-items:center;margin:4px 0}
.att-pdf-frame{width:100%;max-width:280px;height:200px;border:0;border-radius:10px;background:#fff}
.vnote-preview{width:220px;height:220px;border-radius:50%;overflow:hidden;margin:12px auto;border:3px solid var(--accent)}
.vnote-preview video{width:100%;height:100%;object-fit:cover}
.reacts .react{transition:transform .15s ease}
.reacts .react:active{transform:scale(1.25)}
.vn-rate{font-size:11px;min-width:36px}
.ed-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}


/* NYX suite cohesive skin */
.stk-panel{width:min(320px,90vw)}
.stk-tabs{display:flex;gap:4px;margin-bottom:8px}
.stk-tabs button{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);cursor:pointer;font-size:12px}
.stk-tabs button.on{background:var(--accent);color:#fff;border-color:transparent}
.stk-body{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:220px;overflow:auto}
.stk-i{border:0;background:var(--bg-3);border-radius:10px;padding:6px;cursor:pointer;font-size:20px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stk-i img{width:100%;height:100%;object-fit:cover}
.stk-actions{margin-top:8px}
.views{opacity:.75;font-size:11px;margin-inline-start:6px}
.lb-modal .modal-card,.lb-wrap{animation:nyxIn .18s ease}
@keyframes nyxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.poll-card,.todo-card,.event-card,.loc-card,.contact-card,.album-grid,.att-media{
  box-shadow:0 1px 0 color-mix(in srgb, var(--line) 80%, transparent);
}
.msg .mb{border-radius:14px}
.reacts .react.mine{outline:1px solid var(--accent)}
.setsec,.spv,.gal-grid{border-radius:14px}


.ms-results{max-height:40vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.ms-hit{text-align:start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);cursor:pointer}
.ms-hit:hover{border-color:var(--accent)}

/*nyx-decrypt-batch-v2*/
async function nyxDecryptMessagesNewestFirst(cid){
  try{
    if(!cid||typeof E2EE==='undefined') return;
    const list=(A.D&&A.D.messages&&A.D.messages[cid])||[];
    // Chronological (oldest→newest) so timeline fills in time order
    const jobs=[];
    for(let i=0;i<list.length;i++){
      const m=list[i]; if(!m||m.deleted||m.system) continue;
      const ct=m.ciphertext; if(!ct||typeof ct!=='string') continue;
      if(!(ct.startsWith('e2ee1:')||ct.startsWith('e2ee2:')||ct.startsWith('e2ee3:'))) continue;
      const hasRealText=m.text&&String(m.text).trim()&&!String(m.text).startsWith('e2ee');
      if(hasRealText&&!m._pendingDecrypt) continue;
      jobs.push(m);
    }
    // Parallel decrypt, then single re-render to avoid flicker / out-of-order paints
    await Promise.all(jobs.map(async (m)=>{
      if(m._pendingDecrypt) return;
      m._pendingDecrypt=true;
      try{
        const pt=await E2EE.decrypt(cid,m.ciphertext,m.text||'');
        if(pt&&String(pt).trim()){ m.text=pt; m.e2ee=true; }
      }catch(e){}
      m._pendingDecrypt=false;
    }));
    try{
      const conv=A.conv&&A.conv(cid);
      if(conv&&typeof renderTimeline==='function'&&activeConv&&activeConv()&&activeConv().id===cid) renderTimeline(conv);
      else if(typeof MsgUI!=='undefined'&&MsgUI.updateNode){ jobs.forEach(m=>{ try{ MsgUI.updateNode(m); }catch(e){} }); }
    }catch(e){}
  }catch(e){ console.warn('decrypt batch',e); }
}

  // Simple chain ratchet per DM: advances after each send/receive for forward secrecy of future messages

    if (!st) st = { send_n: 0, recv_n: 0, root: null };
    const base = await E2EE._aesFromPeer(cid);
    if (!base) return null;
    const n = direction === 'send' ? (st.send_n++) : (st.recv_n++);
    const material = new TextEncoder().encode('nyx-ratchet|' + cid + '|' + direction + '|' + n);
    const bits = await crypto.subtle.exportKey('raw', base).catch(() => null);
    // non-extractable keys: derive via HKDF-like digest of counter + peer secret seal
    const dig = await crypto.subtle.digest('SHA-256', material);
    const key = await crypto.subtle.importKey('raw', dig, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    try { localStorage.setItem(k, JSON.stringify(st)); } catch (e) {}
    return { key, n };
  }

function parseHash() {
const h = location.hash.replace(/^#\/?/, '');
if (h.startsWith('c/')) return { view: 'chat', id: h.slice(2) };
if (['saved', 'contacts', 'activity', 'groups', 'channels', 'discover', 'events', 'notifications', 'settings'].includes(h)) return { view: h, id: null };
return { view: 'chat', id: null };
}

function ensureConversation(c) {
  if (!A.D || !c || !c.id) return null;
  A.D.conversations = A.D.conversations || [];
  A.D.messages = A.D.messages || {};
  const id = String(c.id);
  let ex = A.D.conversations.find(x => String(x.id) === id);
  if (ex) {
    Object.assign(ex, c);
    if (!A.D.messages[id]) A.D.messages[id] = [];
    return ex;
  }
  const row = Object.assign({
    pinned: false, muted: false, archived: false, unread: 0, mentionUnread: 0,
    lastMessageAt: Date.now(), memberIds: [], roles: {},
  }, c);
  A.D.conversations.unshift(row);
  if (!A.D.messages[id]) A.D.messages[id] = [];
  return row;
}
function bumpConvPreview(cid, text, ts) {

}

function openConversationPre(id) {

if (!c) return;
try { if (typeof LiveTransport !== 'undefined' && LiveTransport.resubscribe) LiveTransport.resubscribe(String(id)); } catch (e) {}

c.unread = 0; c.mentionUnread = 0;

c.readCursor = Date.now();
if (!_prevRead) S.unreadFrom = null;
if (c.archived) c.archived = false;
S.following = true; S.newCount = 0;

NyxApi.driver.markRead(id, Date.now()).catch(() => {});

const run = async () => {
try {

  try { await NyxApi.driver.loadBans && NyxApi.driver.loadBans(id); } catch (e) {}
  try { renderMain(); renderConvListSoon(); } catch (e) {}

const c2 = A.conv(id);

for (const mid of (c2.memberIds || [])) senders.push(mid);
}
for (const m of (A.D.messages[id] || [])) if (m && m.senderId) senders.push(m.senderId);
try { await NyxApi.driver.resolveUsers(senders); } catch (e) {}
try {
if (!(A.D.messages[id] && A.D.messages[id].length)) {
const me = HttpDriver.username || ACCOUNT_ID;
const syn = await HttpDriver.req('GET', '/api/v3/messages/sync?conversation_id=' + encodeURIComponent(id) + '&user_id=' + encodeURIComponent(me) + '&limit=50');
const list = (syn && (syn.messages || syn.items)) || [];
A.D.messages[id] = list.map(m => ({
id: m.message_id || m.id, convId: id, conversationId: id,
senderId: m.sender_id || m.senderId, displayName: m.display_name || m.displayName || m.sender_name || '', text: m.plaintext || m.text || m.body || '',
ts: m.timestamp || m.accepted_at_ms || Date.now(), status: 'sent',
}));
await NyxApi.driver.resolveUsers(A.D.messages[id].map(m => m.senderId));
}
} catch (e) {}
try { renderMain(); if (typeof renderConvListSoon === 'function') renderConvListSoon(); } catch (e) {}
};
run();
}
}

function resolveAttachmentUrl(a) {
  if (!a) return '';
  const id = a.id || a.serverId || a.attachment_id || '';
  // Prefer explicit non-blob URL
  if (a.url && typeof a.url === 'string' && !String(a.url).startsWith('blob:')) {
    let u = String(a.url);
    if (u.startsWith('http://') || u.startsWith('https://')) return u;
    if (u.startsWith('/nyx/')) return location.origin + u;
    if (u.startsWith('/')) return location.origin + u;
  }
  let base = '';
  try {
    if (a.host) {
      const h = String(a.host).replace(/\/$/, '');
      base = h.includes('/nyx') ? h : (h + '/nyx');
    }
  } catch (e) {}
  if (!base) {
    try { if (typeof HttpDriver !== 'undefined' && HttpDriver.base) base = String(HttpDriver.base).replace(/\/$/, ''); } catch (e) {}
  }
  if (!base) {
    const p = location.pathname;
    const ix = p.indexOf('/nyx');
    base = location.origin + (ix >= 0 ? p.slice(0, ix + 4) : '/nyx');
  }
  if (id) {
    // Local-only placeholder ids (a-xxxx without server) cannot be fetched
    if (/^a-[a-z0-9]+$/i.test(String(id)) && !String(id).startsWith('att_') && !a.serverId) {
      return '';
    }
    return base + '/api/v3/attachments/download?id=' + encodeURIComponent(id);
  }
  return '';
}

function hydrateMediaElements(root) {
  const scope = root || document;
  scope.querySelectorAll('audio[data-src], img[data-src-fetch]').forEach(async el => {
    const src = el.getAttribute('data-src') || el.getAttribute('data-src-fetch');
    if (!src || el.dataset.hydrated === '1') return;
    el.dataset.hydrated = '1';
    try {
      const headers = {};
      try { if (HttpDriver.token) headers['Authorization'] = 'Bearer ' + HttpDriver.token; } catch (e) {}
      const res = await fetch(src, { headers, credentials: 'omit', mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const obj = URL.createObjectURL(blob);
      if (el.tagName === 'AUDIO' || el.tagName === 'VIDEO') {
        el.src = obj;
        el.load();
      } else if (el.tagName === 'IMG') {
        el.src = obj;
      }
    } catch (e) {
      // fallback: direct src (may work same-origin)
      try { el.src = src; if (el.load) el.load(); } catch (e2) {}
      console.warn('[NYX] media hydrate failed', e);
    }
  });
}

function attachmentKind(a) {
  if (!a) return 'file';
  if (a.asFile || a.sendAs === 'file') return 'file';
  const mime = String(a.mime || a.type || '').toLowerCase();
  const name = String(a.name || '').toLowerCase();
  if (a.isVoice || mime.startsWith('audio/') || /\.(webm|ogg|mp3|m4a|wav)$/.test(name) || name.includes('voice')) return 'audio';
  if (mime.startsWith('video/') || /\.(mp4|webm|mov|mkv|m4v)$/.test(name)) return 'video';
  if (mime.startsWith('image/') || /\.(png|jpe?g|gif|webp|svg|bmp|heic)$/.test(name)) return 'image';
  return 'file';
}

/* ==== NYX Pro Suite: Privacy · Group · Channel · Org · Notif · Profile ==== */
const NyxStore = {
  get(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const NyxPrivacy = {
  key: 'nyx.privacy.v2',
  defaults: {
    lastSeen: 'everyone', // everyone|contacts|nobody
    readReceiptsDefault: true,
    screenshotProtect: false,
    chatLockPin: '',
    chatLockEnabled: false,
    secretArchivePin: '',
    proxyUrl: '',
    torMode: false,
    sealedSender: false,
    forwardHideSender: false,
    autoDisappearDmMs: 0, // 0 off, else ms
    safetyAlerts: true,
  },
  load() { return Object.assign({}, this.defaults, NyxStore.get(this.key, {})); },
  save(p) { NyxStore.set(this.key, p); },
  patch(o) { const p = Object.assign(this.load(), o); this.save(p); return p; },
  chatKey(cid) { return 'nyx.chatpriv.' + cid; },
  chatPriv(cid) { return Object.assign({ readReceipts: true, mentionOnly: false, notif: 'default', muteUntil: 0, locked: false }, NyxStore.get(this.chatKey(cid), {})); },
  setChatPriv(cid, o) { const p = Object.assign(this.chatPriv(cid), o); NyxStore.set(this.chatKey(cid), p); return p; },
  isMuted(cid) {
    const p = this.chatPriv(cid);
    return p.muteUntil && p.muteUntil > Date.now();
  },
  shouldSendRead(cid) {
    const g = this.load();
    if (g.readReceiptsDefault === false) return false;
    return this.chatPriv(cid).readReceipts !== false;
  },
  unlockPrompt() {
    const p = this.load();
    if (!p.chatLockEnabled || !p.chatLockPin) return true;
    const pin = prompt('Chat lock PIN');
    return pin === p.chatLockPin;
  },
  verifySecretArchive() {
    const p = this.load();
    if (!p.secretArchivePin) return true;
    return prompt('Secret archive PIN') === p.secretArchivePin;
  },
  safetyNumber(a, b) {
    const s = [String(a||''), String(b||'')].map(x => x.toLowerCase()).sort().join('|');
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    const n = Math.abs(h).toString(16).padStart(8, '0');
    return (n + n + n + n).slice(0, 16).match(/.{4}/g).join(' ');
  },
  reportUser(uid, reason) {
    const list = NyxStore.get('nyx.reports.v1', []);
    list.push({ uid, reason, at: Date.now(), by: ACCOUNT_ID });
    NyxStore.set('nyx.reports.v1', list.slice(-200));
    try {
      if (HttpDriver && HttpDriver.token) {
        HttpDriver.req('POST', '/api/v3/blocks', { user_id: ACCOUNT_ID, target_id: uid, report: reason }).catch(()=>{});
      }
    } catch (e) {}
  },
};

const NyxGroupPro = {
  confKey(cid) { return 'nyx.gconf.' + cid; },
  conf(cid) {
    return Object.assign({
      roles: { owner: 100, admin: 80, mod: 60, vip: 40, member: 20, readonly: 10 },
      perms: {
        member: { send: true, media: true, links: true, mentionAll: false, pin: false },
        vip: { send: true, media: true, links: true, mentionAll: true, pin: false },
        mod: { send: true, media: true, links: true, mentionAll: true, pin: true },
        admin: { send: true, media: true, links: true, mentionAll: true, pin: true },
        owner: { send: true, media: true, links: true, mentionAll: true, pin: true },
        readonly: { send: false, media: false, links: false, mentionAll: false, pin: false },
      },
      antiSpam: { linkFilter: false, floodMax: 8, floodWindowMs: 10000, newMemberMuteSec: 0 },
      welcome: '',
      rules: '',
      topics: [],
      announcement: false,
      bannedWords: [],
      slowmodeBase: 0,
      dynamicSlowmode: false,
      freeze: false,
      memberTags: {}, // uid -> VIP|verified|bot
      tempAdmins: {}, // uid -> expiresAt
    }, NyxStore.get(this.confKey(cid), {}));
  },
  save(cid, c) { NyxStore.set(this.confKey(cid), c); },
  roleOf(conv, uid) {
    const me = String(uid || ACCOUNT_ID || '').toLowerCase();
    const roles = (conv && conv.roles) || {};
    let r = roles[me] || roles[uid] || 'member';
    const c = this.conf(conv && conv.id);
    if (c.tempAdmins && c.tempAdmins[me] && c.tempAdmins[me] > Date.now()) r = 'admin';
    if (c.freeze && r !== 'owner' && r !== 'admin') r = 'readonly';
    return r;
  },
  can(conv, action) {
    const r = this.roleOf(conv, ACCOUNT_ID);
    const c = this.conf(conv && conv.id);
    const p = (c.perms && c.perms[r]) || c.perms.member || {};
    if (c.freeze && r !== 'owner' && r !== 'admin' && action === 'send') return false;
    if (c.announcement && r !== 'owner' && r !== 'admin' && r !== 'mod' && action === 'send') return false;
    return p[action] !== false;
  },
  checkAntiSpam(conv, text) {
    const c = this.conf(conv && conv.id);
    const a = c.antiSpam || {};
    if (a.linkFilter && /https?:\/\//i.test(text || '') && !this.can(conv, 'links')) {
      return { ok: false, reason: 'Links are restricted in this group' };
    }
    const words = c.bannedWords || [];
    const low = String(text || '').toLowerCase();
    for (const w of words) {
      if (w && low.includes(String(w).toLowerCase())) return { ok: false, reason: 'Message blocked by auto-mod' };
    }
    // flood
    const k = 'nyx.flood.' + (conv && conv.id) + '.' + ACCOUNT_ID;
    const now = Date.now();
    let arr = NyxStore.get(k, []);
    arr = arr.filter(t => now - t < (a.floodWindowMs || 10000));
    arr.push(now);
    NyxStore.set(k, arr);
    if (arr.length > (a.floodMax || 12)) return { ok: false, reason: 'Flood limit — slow down' };
    return { ok: true };
  },
  dynamicSlowSec(conv) {
    const c = this.conf(conv && conv.id);
    let sec = Number(c.slowmodeBase || 0);
    if (c.dynamicSlowmode) {
      const msgs = (A.D && A.D.messages[conv.id]) || [];
      const recent = msgs.filter(m => m && (Date.now() - (m.ts || 0)) < 60000).length;
      if (recent > 30) sec = Math.max(sec, 15);
      else if (recent > 15) sec = Math.max(sec, 8);
      else if (recent > 8) sec = Math.max(sec, 3);
    }
    return sec;
  },
  stats(conv) {
    const list = (A.D && A.D.messages[conv.id]) || [];
    const day = Date.now() - 86400000;
    const recent = list.filter(m => m && !m.system && (m.ts || 0) > day);
    const by = {};
    for (const m of recent) {
      const id = m.senderId || '?';
      by[id] = (by[id] || 0) + 1;
    }
    const top = Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0, 8).map(([id,n]) => ({
      id, n, name: (A.user(id)||{}).displayName || id
    }));
    return { messages24h: recent.length, top, members: (conv.memberIds||[]).length };
  },
  exportHistory(conv, asHtml) {
    const list = (A.D && A.D.messages[conv.id]) || [];
    if (asHtml) {
      const rows = list.map(m => `<div><b>${esc((A.user(m.senderId)||{}).displayName||m.senderId||'')}</b> <small>${esc(new Date(m.ts||0).toISOString())}</small><div>${esc(m.text||'')}</div></div>`).join('');
      return `<!doctype html><meta charset="utf-8"><title>${esc(conv.name||conv.id)}</title>${rows}`;
    }
    return JSON.stringify({ space: conv.id, name: conv.name, exportedAt: Date.now(), messages: list }, null, 2);
  },
};

const NyxNotifPro = {

  load() {

    }, NyxStore.get(this.key, {}), {

      quietTo: (prefs && prefs.quietTo) || '08:00',
    });
  },
  save(p) { NyxStore.set(this.key, p); },
  inQuietHours() {
    const p = this.load();
    if (!p.quietEnabled && !(prefs && prefs.quietEnabled)) return false;
    const from = p.quietFrom || (prefs && prefs.quietFrom) || '22:00';
    const to = p.quietTo || (prefs && prefs.quietTo) || '08:00';
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    const [fh, fm] = from.split(':').map(Number);
    const [th, tm] = to.split(':').map(Number);
    const a = fh * 60 + (fm || 0), b = th * 60 + (tm || 0);
    if (a === b) return false;
    if (a < b) return cur >= a && cur < b;

    if (p.keywords && p.keywords.length && msg) {

    }
    return true;
  },
  pushHistory(item) {
    const h = NyxStore.get(this.histKey, []);
    h.unshift(Object.assign({ at: Date.now() }, item));

function nyxDownloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function openGlobalSearch() {
  const saved = NyxOrg.savedSearches();
  const m = openModal(`<h2>Search</h2>
    <div class="field"><input class="input" id="gs-q" placeholder="Messages, media, links, #hashtag, @user"/></div>
    <div class="seg" id="gs-t">
      <button type="button" data-t="all" class="on">All</button>
      <button type="button" data-t="media">Media</button>
      <button type="button" data-t="links">Links</button>
      <button type="button" data-t="files">Files</button>
    </div>
    <div class="field"><label>Saved</label><div id="gs-saved">${saved.map((s,i)=>`<button type="button" class="btn sm" data-sv="${i}">${esc(s.q)}</button>`).join('') || '<span class="hint">None</span>'}</div></div>
    <div id="gs-out" class="ms-results hint">Enter a query</div>
    <div class="mrow"><button class="btn sm" id="gs-save">Save search</button><button class="btn pri" id="gs-x">Close</button></div>`, { wide: true });
  let type = 'all';
  $$('#gs-t button', m).forEach(b => b.onclick = () => { $$('#gs-t button', m).forEach(x=>x.classList.remove('on')); b.classList.add('on'); type=b.dataset.t; run(); });
  const run = () => {
    const q = (($('#gs-q', m)||{}).value || '').trim().toLowerCase();
    const hits = [];
    for (const conv of (A.D.conversations || [])) {
      for (const msg of (A.D.messages[conv.id] || [])) {
        if (!msg || msg.deleted) continue;
        const text = String(msg.text || '');
        const low = text.toLowerCase();
        const atts = msg.attachments || [];
        const hasMedia = atts.some(a => /image|video|audio/.test(String(a.mime||a.type||'')));
        const hasFile = atts.length > 0;
        const hasLink = /https?:|nyx:|#\\w+/i.test(text);
        if (type==='media' && !hasMedia) continue;
        if (type==='files' && !hasFile) continue;
        if (type==='links' && !hasLink) continue;
        if (q && !(low.includes(q) || String(msg.senderId||'').toLowerCase().includes(q) || String(conv.name||'').toLowerCase().includes(q))) continue;
        if (!q && type==='all') continue;
        hits.push({ conv, msg });
        if (hits.length >= 50) break;
      }
      if (hits.length >= 50) break;
    }
    const out = $('#gs-out', m);
    if (!out) return;
    out.innerHTML = hits.length ? hits.map(h => `<button type="button" class="ms-hit" data-cid="${esc(h.conv.id)}" data-mid="${esc(h.msg.id)}"><b>${esc(h.conv.name||h.conv.id)}</b> · ${esc(String(h.msg.text||'(media)').slice(0,70))}</button>`).join('') : '<div class="hint">No results</div>';
    $$('.ms-hit', m).forEach(b => b.onclick = () => {
      closeModal(); setRoute('chat', b.dataset.cid);
      setTimeout(() => { try { scrollToMessage(A.conv(b.dataset.cid), b.dataset.mid); } catch(e){} }, 200);
    });
  };
  $('#gs-q', m).oninput = run;
  $('#gs-save', m).onclick = () => {
    const q = ($('#gs-q', m).value || '').trim();
    if (!q) return;
    NyxOrg.addSavedSearch(q, { type });
    toast('Search saved', '', 'ok');
  };
  $$('[data-sv]', m).forEach(b => b.onclick = () => {
    const s = saved[Number(b.dataset.sv)];
    if (!s) return;
    $('#gs-q', m).value = s.q; run();
  });
  $('#gs-x', m).onclick = closeModal;
}

const NyxMedia = {
  quality: () => (typeof prefs !== 'undefined' && prefs.mediaQuality) || (S && S.mediaQuality) || 'compressed',
  qualityParams() {
    const q = this.quality();
    if (q === 'original') return { maxDim: 8000, quality: 0.98, skip: true };
    if (q === 'hd') return { maxDim: 2560, quality: 0.9, skip: false };
    return { maxDim: 1600, quality: 0.82, skip: false };
  },
  
  async recordVideoNote() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 }, audio: true });
      const m = openModal(`<h2>Video note</h2><p class="mdesc">Up to 15 seconds · circular</p>
        <div class="vnote-preview"><video id="vn-prev" autoplay muted playsinline></video></div>

      const v = $('#vn-prev', m);

      let rec, chunks = [];
      $('#vn-x', m).onclick = () => { stream.getTracks().forEach(t => t.stop()); closeModal(); };
      $('#vn-rec', m).onclick = () => {
        chunks = [];
        rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' });
        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        rec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: 'video/webm' });
          closeModal();
          const file = new File([blob], 'videonote-' + Date.now() + '.webm', { type: 'video/webm' });
          await stageFiles([file], { asFile: false, asImage: false, videoNote: true });
          toast('Video note ready', 'Send when ready', 'ok');
        };
        rec.start();

        $('#vn-rec', m).onclick = () => { try { rec.stop(); } catch (e) {} };
      };
    } catch (e) {
      toast('Camera unavailable', String(e.message||e).slice(0, 60), 'warn');
    }
  },

  openLightbox(urls, startIdx) {
    const list = (urls || []).filter(Boolean);
    if (!list.length) return;
    let idx = Math.max(0, Math.min(startIdx || 0, list.length - 1));
    const m = openModal(`<div class="lb-wrap">
      <div class="lb-toolbar">
        <span id="lb-count">${idx+1}/${list.length}</span>
        <button type="button" class="btn sm" id="lb-prev">‹</button>

        <button type="button" class="btn sm" id="lb-ss">Slideshow</button>
        <button type="button" class="btn sm" id="lb-x">Close</button>
      </div>
      <div class="lb-stage"><img id="lb-img" src="${list[idx]}" alt=""/></div>
    </div>`);
    try { m.classList.add('lb-modal'); } catch (e) {}
    let rot = 0, zoom = 1, ss = null;
    const img = () => $('#lb-img', m);
    const show = () => {
      const el = img(); if (!el) return;
      el.src = list[idx];
      el.style.transform = `rotate(${rot}deg) scale(${zoom})`;
      const c = $('#lb-count', m); if (c) c.textContent = (idx+1) + '/' + list.length;
      const dl = $('#lb-dl', m); if (dl) dl.href = list[idx];
    };
    $('#lb-x', m).onclick = () => { if (ss) clearInterval(ss); closeModal(); };
    $('#lb-prev', m).onclick = () => { idx = (idx - 1 + list.length) % list.length; rot=0; zoom=1; show(); };
    $('#lb-next', m).onclick = () => { idx = (idx + 1) % list.length; rot=0; zoom=1; show(); };
    $('#lb-zoom', m).onclick = () => { zoom = zoom >= 2 ? 1 : zoom + 0.5; show(); };
    $('#lb-rot', m).onclick = () => { rot = (rot + 90) % 360; show(); };
    $('#lb-ss', m).onclick = () => {
      if (ss) { clearInterval(ss); ss = null; toast('Slideshow off', '', 'info'); return; }
      ss = setInterval(() => { idx = (idx + 1) % list.length; rot=0; zoom=1; show(); }, 2800);
      toast('Slideshow on', '', 'ok');
    };
    document.addEventListener('keydown', function onk(e) {
      if (!document.body.contains(m)) { document.removeEventListener('keydown', onk); return; }
      if (e.key === 'Escape') { if (ss) clearInterval(ss); closeModal(); }
      if (e.key === 'ArrowLeft') $('#lb-prev', m).click();
      if (e.key === 'ArrowRight') $('#lb-next', m).click();
    });
  },
  openChatGallery(conv) {
    if (!conv || !A.D) return;
    const items = [];
    for (const msg of (A.D.messages[conv.id] || [])) {
      if (!msg || msg.deleted) continue;
      for (const a of (msg.attachments || [])) {
        const k = typeof attachmentKind === 'function' ? attachmentKind(a) : '';
        const url = resolveAttachmentUrl(a);
        if (url && (k === 'image' || k === 'video')) items.push({ url, kind: k, name: a.name || '', mid: msg.id, ts: msg.ts });
      }
    }
    if (!items.length) { toast('No media', 'This chat has no photos or videos yet.', 'info'); return; }
    const grid = items.map((it, i) => it.kind === 'video'
      ? `<div class="gal-item" data-gi="${i}"><video src="${it.url}" muted preload="metadata"></video></div>`
      : `<div class="gal-item" data-gi="${i}"><img src="${it.url}" loading="lazy" alt=""/></div>`).join('');
    const m = openModal(`<h2>Chat gallery</h2><p class="mdesc">${items.length} items · batch tools below</p>
      <div class="gal-grid">${grid}</div>
      <div class="mrow">
        <button class="btn" id="gal-dl">Download all</button>
        <button class="btn pri" id="gal-ss">Slideshow</button>
        <button class="btn" id="gal-x">Close</button>
      </div>`);
    $$('.gal-item', m).forEach(el => el.onclick = () => {
      const i = Number(el.dataset.gi);
      closeModal();
      NyxMedia.openLightbox(items.map(x => x.url), i);
    });
    $('#gal-x', m).onclick = closeModal;
    $('#gal-ss', m).onclick = () => { closeModal(); NyxMedia.openLightbox(items.map(x => x.url), 0); setTimeout(() => { const b = document.getElementById('lb-ss'); if (b) b.click(); }, 200); };
    $('#gal-dl', m).onclick = async () => {
      toast('Downloading…', items.length + ' files', 'info');
      for (const it of items) {
        try {
          const a = document.createElement('a');
          a.href = it.url; a.download = it.name || 'media'; a.target = '_blank'; a.rel = 'noopener';
          document.body.appendChild(a); a.click(); a.remove();
          await new Promise(r => setTimeout(r, 350));
        } catch (e) {}
      }
      toast('Done', 'Check your downloads', 'ok');
    };
  },
  async openEditor(file) {
    if (!file || !file.type || !file.type.startsWith('image/')) return file;
    return new Promise(async (resolve) => {
      let bmp;
      try { bmp = await createImageBitmap(file); } catch (e) { resolve(file); return; }
      const canvas = document.createElement('canvas');
      canvas.width = bmp.width; canvas.height = bmp.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bmp, 0, 0);
      let drawing = false, mode = 'draw', last = null;
      const m = openModal(`<h2>Edit photo</h2>
        <div class="ed-toolbar">
          <button type="button" class="btn sm on" data-ed="draw">Draw</button>
          <button type="button" class="btn sm" data-ed="text">Text</button>
          <button type="button" class="btn sm" data-ed="blur">Blur area</button>
          <button type="button" class="btn sm" data-ed="crop">Crop center</button>
        </div>
        <div class="ed-stage" style="overflow:auto;max-height:50vh"><canvas id="ed-cv" style="max-width:100%;cursor:crosshair"></canvas></div>
        <div class="mrow"><button class="btn" id="ed-cancel">Cancel</button><button class="btn pri" id="ed-ok">Use photo</button></div>`);
      const cv = $('#ed-cv', m);
      cv.width = canvas.width; cv.height = canvas.height;
      cv.getContext('2d').drawImage(canvas, 0, 0);
      const c = cv.getContext('2d');
      $$('[data-ed]', m).forEach(b => b.onclick = () => {
        $$('[data-ed]', m).forEach(x => x.classList.remove('on')); b.classList.add('on'); mode = b.dataset.ed;
        if (mode === 'crop') {
          const w = cv.width, h = cv.height;
          const s = Math.min(w, h) * 0.85;
          const x = (w - s) / 2, y = (h - s) / 2;
          const out = document.createElement('canvas');
          out.width = s; out.height = s;
          out.getContext('2d').drawImage(cv, x, y, s, s, 0, 0, s, s);
          cv.width = s; cv.height = s;
          c.drawImage(out, 0, 0);
        }
        if (mode === 'text') {
          const t = prompt('Text overlay');
          if (t) { c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 3; c.font = Math.max(18, cv.width/18) + 'px sans-serif'; c.strokeText(t, 24, cv.height - 28); c.fillText(t, 24, cv.height - 28); }
        }
      });
      const pos = (e) => {
        const r = cv.getBoundingClientRect();
        const x = (e.clientX - r.left) * (cv.width / r.width);
        const y = (e.clientY - r.top) * (cv.height / r.height);
        return { x, y };
      };
      cv.onpointerdown = (e) => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); };
      cv.onpointerup = () => { drawing = false; last = null; };
      cv.onpointermove = (e) => {
        if (!drawing || !last) return;
        const p = pos(e);
        if (mode === 'draw') {
          c.strokeStyle = '#ff3b5c'; c.lineWidth = Math.max(3, cv.width/200); c.lineCap = 'round';
          c.beginPath(); c.moveTo(last.x, last.y); c.lineTo(p.x, p.y); c.stroke();
        } else if (mode === 'blur') {
          const s = Math.max(12, cv.width/40);
          c.save(); c.beginPath(); c.arc(p.x, p.y, s, 0, Math.PI*2); c.clip();
          c.filter = 'blur(8px)'; c.drawImage(cv, 0, 0); c.restore(); c.filter = 'none';
        }
        last = p;
      };
      $('#ed-cancel', m).onclick = () => { closeModal(); resolve(file); };
      $('#ed-ok', m).onclick = () => {
        cv.toBlob(async (blob) => {
          closeModal();
          if (!blob) { resolve(file); return; }
          resolve(new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.92);
      };
    });
  },
};

function openImageViewer(url, allUrls) {
  const list = Array.isArray(allUrls) && allUrls.length ? allUrls : [url];
  const idx = Math.max(0, list.indexOf(url));
  NyxMedia.openLightbox(list, idx < 0 ? 0 : idx);
}

    try {

const NyxInteract = {
  parseSpecial(m) {
    const t = String(m && m.text || '');
    if (t.startsWith('§POLL§')) { try { return { type: 'poll', data: JSON.parse(t.slice(6)) }; } catch (e) {} }
    if (t.startsWith('§QUIZ§')) { try { return { type: 'quiz', data: JSON.parse(t.slice(6)) }; } catch (e) {} }
    if (t.startsWith('§TODO§')) { try { return { type: 'todo', data: JSON.parse(t.slice(6)) }; } catch (e) {} }
    if (t.startsWith('§EVENT§')) { try { return { type: 'event', data: JSON.parse(t.slice(7)) }; } catch (e) {} }
    if (t.startsWith('§LOC§')) { try { return { type: 'loc', data: JSON.parse(t.slice(5)) }; } catch (e) {} }
    if (t.startsWith('§CONTACT§')) { try { return { type: 'contact', data: JSON.parse(t.slice(9)) }; } catch (e) {} }
    return null;
  },
  renderSpecial(sp, m) {
    if (!sp) return '';
    if (sp.type === 'poll' || sp.type === 'quiz') {
      const d = sp.data || {};
      const votes = d.votes || {};
      const total = Object.values(votes).reduce((s, arr) => s + ((arr && arr.length) || 0), 0);
      const labelV = (uid) => {
        try {
          const u = (typeof A !== 'undefined' && A.user) ? A.user(uid) : null;
          if (u && (u.displayName || u.username)) return u.displayName || u.username;
        } catch (e) {}
        const s = String(uid||'');
        if (/^[a-f0-9]{24,}$/i.test(s)) return s.slice(0,6)+'…';
        return s;
      };
      const opts = (d.opts || []).map((o, i) => {
        const arr = votes[i] || votes[String(i)] || [];
        const n = arr.length;
        const pct = total ? Math.round((n / total) * 100) : 0;
        const who = arr.slice(0, 4).map(labelV).join(', ') + (arr.length > 4 ? '…' : '');
        return `<button type="button" class="poll-opt" data-poll="${esc(m.id)}" data-opt="${i}" style="display:block;width:100%;text-align:left;margin:4px 0;position:relative;overflow:hidden">
          <span style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:rgba(99,120,255,.15);pointer-events:none"></span>
          <span style="position:relative">${esc(o)} <span class="poll-n">${n}${total?(' · '+pct+'%'):''}</span></span>
          ${who ? `<div class="hint" style="position:relative;margin-top:2px;font-size:11px">${esc(who)}</div>` : ''}
        </button>`;
      }).join('');
      return `<div class="poll-card" data-mid="${esc(m.id)}"><div class="poll-q">${esc(d.q || 'Poll')}${sp.type==='quiz'?' · Quiz':''}</div>${opts}<div class="hint" style="margin-top:6px">${total} vote${total===1?'':'s'}</div></div>`;
    }
    if (sp.type === 'todo') {
      const items = (sp.data.items || []).map((it, i) =>
        `<label class="todo-row"><input type="checkbox" data-todo="${esc(m.id)}" data-i="${i}" ${it.done?'checked':''}/> <span>${esc(it.t||'')}</span></label>`).join('');
      return `<div class="todo-card"><div class="poll-q">Checklist</div>${items}</div>`;
    }
    if (sp.type === 'event') {
      const d = sp.data || {};
      return `<div class="event-card"><div class="poll-q">📅 ${esc(d.title||'Event')}</div>
        <div class="hint">${esc(d.when||'')} ${d.where?('· '+esc(d.where)):''}</div>
        <div class="mrow" style="margin-top:8px">
          <button class="btn sm" data-rsvp="${esc(m.id)}" data-v="yes">Going</button>
          <button class="btn sm" data-rsvp="${esc(m.id)}" data-v="maybe">Maybe</button>
          <button class="btn sm" data-rsvp="${esc(m.id)}" data-v="no">Can't</button>
        </div>
        <div class="hint" id="rsvp-${esc(m.id)}">${esc(JSON.stringify(d.rsvp||{}).slice(0,80))}</div>
      </div>`;
    }
    if (sp.type === 'loc') {
      const d = sp.data || {};
      const live = d.live ? ' · live' : '';
      const map = `https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lng}#map=16/${d.lat}/${d.lng}`;
      return `<div class="loc-card"><div class="poll-q">📍 Location${live}</div>
        <div class="hint">${Number(d.lat).toFixed(5)}, ${Number(d.lng).toFixed(5)}</div>
        <a class="btn sm" href="${map}" target="_blank" rel="noopener">Open map</a></div>`;
    }
    if (sp.type === 'contact') {
      const d = sp.data || {};
      return `<div class="contact-card"><div class="poll-q">👤 ${esc(d.name||d.username||'Contact')}</div>
        <div class="hint mono">@${esc(d.username||'')}</div>
        <button class="btn sm" data-nyx-user="${esc(d.username||'')}" data-open-user="${esc(d.username||'')}">Open profile</button></div>`;
    }
    return '';
  },
  openCreatePoll(kind) {
    const isQuiz = kind === 'quiz';
    const m = openModal(`<h2>${isQuiz?'Quiz':'Poll'}</h2>
      <div class="field"><label>Question</label><input class="input" id="pq" maxlength="200"/></div>
      <div class="field"><label>Options (one per line)</label><textarea class="input" id="po" rows="4" placeholder="Option A&#10;Option B"></textarea></div>
      ${isQuiz?'<div class="field"><label>Correct option index (0-based)</label><input class="input" id="pc" type="number" min="0" value="0"/></div>':''}
      <div class="mrow"><button class="btn" id="px">Cancel</button><button class="btn pri" id="pok">Send</button></div>`);
    $('#px', m).onclick = closeModal;
    $('#pok', m).onclick = async () => {

      if (!q || opts.length < 2) { toast('Need question + 2 options', '', 'warn'); return; }
      const data = { q, opts, votes: {}, correct: isQuiz ? Number($('#pc', m).value||0) : undefined };
      const prefix = isQuiz ? '§QUIZ§' : '§POLL§';
      closeModal();
      await NyxInteract.sendSpecial(prefix + JSON.stringify(data));

  },
  openCreateTodo() {
    const m = openModal(`<h2>Shared checklist</h2>
      <div class="field"><label>Items (one per line)</label><textarea class="input" id="td" rows="5"></textarea></div>
      <div class="mrow"><button class="btn" id="tx">Cancel</button><button class="btn pri" id="tok">Send</button></div>`);

    $('#tok', m).onclick = async () => {

      if (!items.length) { toast('Add items', '', 'warn'); return; }

  openCreateEvent() {
    const m = openModal(`<h2>Event / RSVP</h2>
      <div class="field"><label>Title</label><input class="input" id="ev-t"/></div>
      <div class="field"><label>When</label><input class="input" id="ev-w" type="datetime-local"/></div>
      <div class="field"><label>Where</label><input class="input" id="ev-loc"/></div>
      <div class="mrow"><button class="btn" id="ex">Cancel</button><button class="btn pri" id="eok">Send</button></div>`);
    $('#ex', m).onclick = closeModal;
    $('#eok', m).onclick = async () => {
      const title = ($('#ev-t', m).value||'').trim();
      if (!title) { toast('Title required', '', 'warn'); return; }
      const when = $('#ev-w', m).value ? new Date($('#ev-w', m).value).toLocaleString() : '';
      closeModal();
      await NyxInteract.sendSpecial('§EVENT§' + JSON.stringify({ title, when, where: ($('#ev-loc', m).value||'').trim(), rsvp: {} }));
    };
  },
  async shareLocation(live) {
    if (!navigator.geolocation) { toast('Location unavailable', '', 'warn'); return; }
    toast('Getting location…', '', 'info');
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const data = { lat: pos.coords.latitude, lng: pos.coords.longitude, live: !!live, at: Date.now() };
      await NyxInteract.sendSpecial('§LOC§' + JSON.stringify(data));
      if (live) {
        toast('Live location', 'Updates for 15 minutes while tab is open', 'ok');
        const ends = Date.now() + 15 * 60000;
        const iv = setInterval(() => {
          if (Date.now() > ends) { clearInterval(iv); return; }
          navigator.geolocation.getCurrentPosition(() => {});
        }, 60000);
      }
    }, () => toast('Permission denied', '', 'warn'), { enableHighAccuracy: true, timeout: 10000 });
  },
  async shareContact() {
    const me = (A.me && A.me()) || {};
    const username = me.username || ACCOUNT_ID || HttpDriver.username || '';
    await NyxInteract.sendSpecial('§CONTACT§' + JSON.stringify({ username, name: me.displayName || username }));
  },
  async sendSpecial(text) {
    const conv = typeof activeConv === 'function' ? activeConv() : null;
    if (!conv) return;
    const ta = $('#composer-input');
    if (ta) { ta.value = text; }
    try {
      if (typeof pipeline !== 'undefined' && pipeline.send) await pipeline.send(conv);
      else if (typeof doSend === 'function') await doSend(conv);
    } catch (e) { toast('Send failed', String(e.message||e).slice(0,60), 'warn'); }
  },
  reactionDetail(m) {
    const map = normalizeReactions(m.reactions || {});
    const labelOf = (uid) => {
      try {
        const u = (typeof A !== 'undefined' && A.user) ? A.user(uid) : null;
        if (u) {
          const dn = u.displayName || u.display_name || u.username || '';
          const un = u.username || '';
          if (dn && un && dn.toLowerCase() !== un.toLowerCase()) return dn + ' (@' + un + ')';
          if (dn) return dn;
          if (un) return '@' + un;
        }
      } catch (e) {}
      const s = String(uid || '');
      // Hide raw 32-char hashes
      if (/^[a-f0-9]{24,}$/i.test(s)) return 'User ' + s.slice(0, 6) + '…';
      return s ? ('@' + s) : 'Unknown';
    };
    const rows = Object.entries(map).filter(([,u]) => u && u.length).map(([e, users]) => {
      const names = users.map(labelOf);
      return `<div class="kv" style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line,rgba(255,255,255,.08))">
        <span class="k" style="font-size:22px;line-height:1">${e}</span>
        <span class="v" style="flex:1"><strong>${users.length}</strong> · ${names.map(n => esc(n)).join(', ')}</span>
      </div>`;
    }).join('') || '<div class="hint">No reactions yet</div>';
    openModal(`<h2>Reactions</h2><div style="max-height:50vh;overflow:auto">${rows}</div><div class="mrow"><button class="btn pri" onclick="(window.closeModal||function(){})()">Close</button></div>`);
  },
};

function bindMediaSuite(root, conv) {
  if (!root) return;
  const imgs = [];
  root.querySelectorAll('[data-img]').forEach(el => { if (el.dataset.img) imgs.push(el.dataset.img); });
  root.querySelectorAll('[data-img]').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openImageViewer(el.dataset.img, imgs); };
  });
  root.querySelectorAll('[data-voice-play]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const src = btn.getAttribute('data-voice-play');
      const card = btn.closest('.voicecard');
      let audio = card && card._audio;
      if (!audio) {
        audio = new Audio(src);
        if (card) card._audio = audio;
        audio.playbackRate = Number((card && card.dataset.rate) || 1);
      }
      if (audio.paused) { audio.play(); btn.classList.add('on'); }
      else { audio.pause(); btn.classList.remove('on'); }
      audio.onended = () => btn.classList.remove('on');
    };
  });
  root.querySelectorAll('[data-voice-rate]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const card = btn.closest('.voicecard');
      if (!card) return;
      const rates = [0.5, 1, 1.5, 2];
      let r = Number(card.dataset.rate || 1);
      r = rates[(rates.indexOf(r) + 1) % rates.length];
      card.dataset.rate = r;
      btn.textContent = r + '×';
      if (card._audio) card._audio.playbackRate = r;
    };
  });
  root.querySelectorAll('[data-voice-transcribe]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { toast('Transcription unsupported', 'Browser has no SpeechRecognition', 'warn'); return; }
      toast('Listening…', 'Play the voice near the mic, or use live dictation', 'info');
      const rec = new SR();
      rec.lang = (prefs && prefs.lang === 'fa') ? 'fa-IR' : 'en-US';
      rec.onresult = (ev) => {
        const text = ev.results[0][0].transcript;
        openModal(`<h2>Transcription</h2><div style="white-space:pre-wrap">${esc(text)}</div><div class="mrow"><button class="btn pri" onclick="(window.closeModal||function(){})()">Close</button></div>`);
      };
      rec.onerror = () => toast('Transcription failed', '', 'warn');
      rec.start();
    };
  });
  root.querySelectorAll('.poll-opt').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const mid = btn.getAttribute('data-poll');
      const opt = Number(btn.getAttribute('data-opt'));
      const msg = A.msgById(mid);
      if (!msg) return;
      const sp = NyxInteract.parseSpecial(msg);
      if (!sp || !sp.data) return;
      let me = '';
      try {
        const u = (typeof A !== 'undefined' && A.me) ? (typeof A.me === 'function' ? A.me() : A.me) : null;
        me = String((u && (u.username || u.id || u.user_id)) || ACCOUNT_ID || '').toLowerCase();
      } catch (err) { me = String(ACCOUNT_ID || '').toLowerCase(); }
      if (!me) return;
      sp.data.votes = sp.data.votes || {};
      for (const k of Object.keys(sp.data.votes)) {
        sp.data.votes[k] = (sp.data.votes[k] || []).filter(u => {
          const s = String(u).toLowerCase();
          return s !== me && s !== String(ACCOUNT_ID || '').toLowerCase();
        });
      }
      const key = String(opt);
      sp.data.votes[key] = sp.data.votes[key] || [];
      if (!sp.data.votes[key].map(String).map(s => s.toLowerCase()).includes(me)) sp.data.votes[key].push(me);
      const prefix = sp.type === 'quiz' ? '§QUIZ§' : '§POLL§';
      const nextText = prefix + JSON.stringify(sp.data);
      msg.text = nextText;
      try {
        const cid = msg.convId || msg.conversationId || (conv && conv.id) || '';
        if (NyxApi && NyxApi.driver && NyxApi.driver.editMessage) {
          await NyxApi.driver.editMessage(mid, nextText, cid);
        }
      } catch (err) {
        console.warn('poll persist', err);
        toast('Vote not synced', String(err.message || err).slice(0, 50), 'warn');
      }
      if (sp.type === 'quiz' && Number(sp.data.correct) === opt) toast('Correct!', '', 'ok');
      else toast('Vote recorded', '', 'ok');
      try { renderTimeline(conv); } catch (err) {}
    };
  });
  
root.querySelectorAll('[data-todo]').forEach(inp => {

      toast('File type blocked', ext + ' not allowed in this space', 'warn'); continue;
    }
  }
} catch (e) {}

const f = {
  name: (file.name || original.name || 'file').replace(/[^\w.\-() ]+/g, '_').slice(0, 80),

    ff.host = up.host || (location.origin + '/nyx');

const VoicePlayer = {
  current: null,
  currentBtn: null,
  blobCache: Object.create(null),
  localBlobs: Object.create(null),
  registerLocal(key, blobOrUrl) {
    if (!key) return;
    try {
      if (this.localBlobs[key] && String(this.localBlobs[key]).startsWith('blob:')) {
        try { URL.revokeObjectURL(this.localBlobs[key]); } catch (e) {}
      }
      this.localBlobs[key] = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    } catch (e) {}
  },
  absUrl(src) {
    if (!src) return '';
    src = String(src).trim();
    if (src.startsWith('blob:') || src.startsWith('http://') || src.startsWith('https://') || src.startsWith('data:')) return src;
    if (src.startsWith('/nyx/')) return location.origin + src;
    if (src.startsWith('/api/')) return location.origin + '/nyx' + src;
    if (src.startsWith('/')) return location.origin + src;
    return src;
  },
  async fetchAsObjectUrl(src) {
    src = this.absUrl(src);
    if (!src) throw new Error('empty src');
    if (this.blobCache[src]) return this.blobCache[src];
    const r = await fetch(src, { credentials: 'omit', mode: 'cors', cache: 'no-cache' });

    let type = 'audio/webm';
    if (u8[0] === 0x4f && u8[1] === 0x67) type = 'audio/ogg';
    else if (u8[0] === 0x1a && u8[1] === 0x45) type = 'audio/webm';
    else if (u8[0] === 0xff || (u8[0] === 0x49 && u8[1] === 0x44)) type = 'audio/mpeg';
    const url = URL.createObjectURL(new Blob([buf], { type }));
    this.blobCache[src] = url;
    return url;
  },
  stopAll() {
    if (this.current) {
      try { this.current.pause(); } catch (e) {}
      try { this.current.onended = null; this.current.onerror = null; this.current.ontimeupdate = null; } catch (e) {}
      this.current = null;
    }

      el.classList.remove('playing');

  },

      btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    } else {
      btn.classList.remove('playing');
      card && card.classList.remove('playing');
      btn.setAttribute('aria-label', 'Play');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    }
  },
  playAudioEl(audio, btn, card, timeEl, seekEl) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const ok = () => { if (!settled) { settled = true; resolve(); } };
      const bad = (e) => { if (!settled) { settled = true; reject(e || new Error('play failed')); } };
      this.current = audio;
      audio.ontimeupdate = () => {
        try {
          if (timeEl) timeEl.textContent = fmtDur((audio.currentTime || 0) * 1000);
          if (seekEl && audio.duration && isFinite(audio.duration) && audio.duration > 0) {
            seekEl.value = String(Math.min(100, Math.round((audio.currentTime / audio.duration) * 100)));
          }
        } catch (e) {}
      };
      audio.onended = () => {
        this.setPlayingUi(btn, card, false);
        if (timeEl) timeEl.textContent = '0:00';
        if (seekEl) seekEl.value = '0';
        this.current = null;
        this.currentBtn = null;
      };
      audio.onerror = () => bad(new Error('decode'));
      const tryPlay = () => {
        const p = audio.play();
        if (p && p.then) p.then(ok).catch(bad);
        else ok();
      };
      if (audio.readyState >= 2) tryPlay();
      else {
        audio.oncanplay = tryPlay;
        audio.onloadeddata = tryPlay;
        setTimeout(() => { if (!settled) tryPlay(); }, 2500);
      }
    });
  },
  async toggle(btn) {
    const card = btn.closest('.voicecard');
    let src = (btn.getAttribute('data-voice-play') || card?.getAttribute('data-voice-src') || '').replace(/&amp;/g, '&');
    const id = btn.getAttribute('data-voice-id') || card?.getAttribute('data-voice-id') || '';
    const timeEl = card?.querySelector('.vn-time');
    const seekEl = card?.querySelector('.vn-seek');
    if (!src && !id) { toast('Voice unavailable', 'No audio source', 'warn'); return; }
    if (this.currentBtn === btn && this.current && !this.current.paused) {
      this.current.pause();
      this.setPlayingUi(btn, card, false);
      return;
    }
    if (this.currentBtn === btn && this.current && this.current.paused) {
      try { await this.current.play(); this.setPlayingUi(btn, card, true); return; } catch (e) {}
    }
    this.stopAll();
    this.currentBtn = btn;
    this.setPlayingUi(btn, card, true);
    const candidates = [];
    if (id && this.localBlobs[id]) candidates.push(this.localBlobs[id]);
    const abs = this.absUrl(src);
    if (abs) candidates.push(abs);
    if (id) candidates.push(location.origin + '/nyx/api/v3/attachments/download?id=' + encodeURIComponent(id));
    // unique
    const seen = new Set();
    const list = candidates.filter(c => c && !seen.has(c) && seen.add(c));
    let lastErr = null;
    for (const url of list) {
      try {
        const audio = new Audio();
        audio.preload = 'auto';
        try { audio.playsInline = true; audio.setAttribute('playsinline', ''); } catch (e) {}
        audio.src = url;
        await this.playAudioEl(audio, btn, card, timeEl, seekEl);
        return;
      } catch (e) {
        lastErr = e;
        console.warn('[NYX] voice direct fail', url, e);
      }
    }
    for (const url of list) {
      if (!url || url.startsWith('blob:') || url.startsWith('data:')) continue;
      try {
        const obj = await this.fetchAsObjectUrl(url);
        const audio = new Audio();
        audio.preload = 'auto';
        try { audio.playsInline = true; } catch (e) {}
        audio.src = obj;
        await this.playAudioEl(audio, btn, card, timeEl, seekEl);
        return;
      } catch (e) {
        lastErr = e;
        console.warn('[NYX] voice fetch fail', url, e);
      }
    }
    this.setPlayingUi(btn, card, false);
    this.current = null;
    this.currentBtn = null;
    const msg = (lastErr && lastErr.message) ? String(lastErr.message).slice(0, 80) : 'Could not decode this voice message';
    toast('Playback failed', msg, 'warn');
  },
};

const SCHED_KEY = 'nyx.scheduled.v1';
function loadScheduled() {
  try {

    return Array.isArray(list) ? list : [];

function saveScheduled(list) {

function scheduledForConv(cid) {
  return loadScheduled().filter(j => j && j.convId === cid && (j.status || 'pending') === 'pending');

function upsertScheduled(job) {
  const list = loadScheduled();
  const i = list.findIndex(x => x.id === job.id);

  saveScheduled(list);

}
function cancelScheduled(id) {

async function fireScheduledJob(job) {
  if (!job || !A.D) return;
  const conv = A.conv(job.convId);
  if (!conv) { job.status = 'failed'; job.error = 'conv missing'; upsertScheduled(job); return; }
  try {
    job.status = 'sending'; upsertScheduled(job);
    // Build optimistic message via pipeline-like path
    const text = String(job.text || '');
    const attachments = (job.attachments || []).filter(a => a && (a.serverId || a.id));
    const mid = 'm-' + Math.random().toString(36).slice(2);
    const msg = {
      id: mid, convId: job.convId, conversationId: job.convId,
      senderId: ((typeof A!=='undefined' && A.me && (A.me.user_id||A.me.identityId||A.me.id)) || ACCOUNT_ID), text, attachments, ts: Date.now(), createdAt: Date.now(),
      status: 'pending', clientId: mid, reactions: {}, scheduledFrom: job.id,
    };
    A.D.messages[job.convId] = A.D.messages[job.convId] || [];
    A.D.messages[job.convId].push(msg);
    if (typeof pipeline !== 'undefined' && pipeline.transmit) {
      await pipeline.transmit(msg);
    } else if (NyxApi && NyxApi.driver && NyxApi.driver.sendMessage) {
      await NyxApi.driver.sendMessage(job.convId, { text, clientId: mid, attachments });
      msg.status = 'sent';
    }
    job.status = 'sent'; job.sentAt = Date.now(); job.sentMsgId = mid;
    upsertScheduled(job);
    try { if (activeConv() && activeConv().id === job.convId) renderMain(); else renderConvListSoon(); } catch (e) {}
    toast('Scheduled sent', (text || 'message').slice(0, 40), 'ok');
  } catch (e) {
    job.status = 'failed'; job.error = String(e.message || e).slice(0, 120); upsertScheduled(job);
    toast('Schedule failed', job.error, 'warn');
    try { if (activeConv() && activeConv().id === job.convId) renderMain(); } catch (e2) {}
  }
}
function tickScheduled() {
  const now = Date.now();
  const list = loadScheduled();
  let changed = false;
  for (const job of list) {
    if ((job.status || 'pending') !== 'pending') continue;
    if (job.sendAt && job.sendAt <= now) {
      // fire async
      fireScheduledJob(job);
      changed = true;
    }
  }
  // refresh open chat badges
  try {
    if (changed && activeConv()) {
      const sc = document.querySelectorAll('.scheduled-msg .sched-badge');
      // full re-render lighter: update countdown only
    }
    const cid = activeConv() && activeConv().id;
    if (cid && document.querySelector('.scheduled-msg')) {
      // update countdowns in place
      document.querySelectorAll('.scheduled-msg[data-sched]').forEach(el => {
        const id = el.getAttribute('data-sched');
        const job = loadScheduled().find(j => j.id === id);
        if (!job || (job.status || 'pending') !== 'pending') { el.remove(); return; }
        const left = Math.max(0, (job.sendAt || 0) - Date.now());
        const leftStr = left > 86400000 ? Math.round(left/86400000)+'d' : left > 3600000 ? Math.round(left/3600000)+'h' : left > 60000 ? Math.round(left/60000)+'m' : Math.round(left/1000)+'s';
        const badge = el.querySelector('.sched-badge');
        if (badge) badge.textContent = '⏱ Scheduled · ' + new Date(job.sendAt).toLocaleString() + ' · in ' + leftStr;
      });
    }
  } catch (e) {}
}
if (typeof window !== 'undefined' && !window.__nyxSchedTimer) {
  window.__nyxSchedTimer = setInterval(tickScheduled, 5000);

function inQuietHours() {
  try {
    if (!prefs.quietEnabled && !prefs.dnd) return false;
    if (prefs.dnd) return true;
    const from = String(prefs.quietFrom || '23:00');
    const to = String(prefs.quietTo || '07:00');
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const parse = (s) => { const [h, m] = s.split(':').map(Number); return (h || 0) * 60 + (m || 0); };
    const a = parse(from), b = parse(to);
    if (a === b) return false;
    if (a < b) return mins >= a && mins < b;
    return mins >= a || mins < b;
  } catch (e) { return false; }
}

async function ensureWebPush() {

function pushSystemNotif({ title, desc, kind = 'system', convId = null, meta = null }) {
  if (!A.D) return;
  if (!Array.isArray(A.D.notifications)) A.D.notifications = [];
  const n = {
    id: 'ntf_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    title: title || 'System',
    desc: desc || '',
    kind: kind || 'system',
    convId: convId || null,
    meta: meta || null,
    ts: Date.now(),
    read: false,
  };
  A.D.notifications.unshift(n);
  if (A.D.notifications.length > 200) A.D.notifications = A.D.notifications.slice(0, 200);
  try {
    if (!Array.isArray(A.D.events)) A.D.events = [];
    A.D.events.unshift({
      id: 'ev_' + n.id, type: kind === 'mention' ? 'mention' : 'system',
      title: n.title, text: n.desc, convId: n.convId, ts: n.ts, read: false,
    });
    if (A.D.events.length > 200) A.D.events = A.D.events.slice(0, 200);
  } catch (e) {}
  try { updateBell(); } catch (e) {}
  try { if (typeof renderSidebarSoon === 'function') renderSidebarSoon(); } catch (e) {}
}

${step === 3 ? `<h2>Review & create</h2><p class="mdesc">Idempotent-guarded — a double submit cannot duplicate the group.</p><div class="kv"><span class="k">Name</span><span class="v">${esc(details.name || '—')}</span></div><div class="kv"><span class="k">Topic</span><span class="v">${esc(details.topic)}</span></div><div class="kv"><span class="k">Members</span><span class="v">${selected.size} + you (owner)</span></div><div style="margin:12px 0;display:flex;gap:6px;flex-wrap:wrap">${[...selected].map(id => `<span class="chip" style="color:var(--text-2);border-color:var(--line-strong)">${esc(A.user(id).displayName)}</span>`).join('')}</div><div class="mrow"><button class="btn" id="g-back2">Back</button><button class="btn pri" id="g-create">Create group</button></div>` : ''}`,

const NyxRealtime = {
  _abort: false,
  _running: false,
  _since: Object.create(null),
  stop() { this._abort = true; this._running = false; },
  async loop() {
    if (this._running) return;
    this._running = true; this._abort = false;
    while (!this._abort) {
      try {
        if (typeof NyxApi === 'undefined' || NyxApi.mode !== 'live' || !HttpDriver.token || !A.D) {
          await new Promise(r => setTimeout(r, 2000)); continue;
        }
        // Prefer WebSocket — long-poll only when WS down
        if (Net._liveWs && Net._liveWs.readyState === 1) {
          await new Promise(r => setTimeout(r, 5000)); continue;
        }
        const conv = (typeof activeConv === 'function') ? activeConv() : null;
        if (!conv || String(conv.id).startsWith('c-saved')) {
          await new Promise(r => setTimeout(r, 1500)); continue;
        }
        const cid = conv.id;
        const since = this._since[cid] || 0;
        let data = null;
        try {
          data = await HttpDriver.req('GET',
            '/api/v3/messages/wait?conv_id=' + encodeURIComponent(cid) +
            '&since_ms=' + encodeURIComponent(String(since)) +
            '&timeout=20&limit=50'
          );
        } catch (e) {
          // fallback compact delta sync
          try {
            data = await HttpDriver.req('GET',
              '/api/v3/messages/sync?conv_id=' + encodeURIComponent(cid) +
              '&since_ms=' + encodeURIComponent(String(since)) +
              '&limit=40'
            );
          } catch (e2) {
            await new Promise(r => setTimeout(r, 2500)); continue;
          }
        }
        const list = (data && (data.messages || data.items)) || [];
        if (list.length && typeof mergeServerMessages === 'function') {
          mergeServerMessages(cid, list);
          let maxTs = since;
          for (const m of list) {
            const t = Number(m.created_ms || m.ts || 0);
            if (t > maxTs) maxTs = t;
          }
          this._since[cid] = maxTs;
          try {
            if (activeConv() && activeConv().id === cid && typeof renderTimeline === 'function') {
              renderTimeline(A.conv(cid) || conv);
            } else if (typeof renderConvListSoon === 'function') renderConvListSoon();
          } catch (e3) {}
        } else if (data && data.newest_ms) {
          this._since[cid] = Math.max(since, Number(data.newest_ms) || since);
        }
      } catch (e) {
        await new Promise(r => setTimeout(r, 2000));
      }
    }
    this._running = false;
  },
  start() { this._abort = false; this.loop(); },
