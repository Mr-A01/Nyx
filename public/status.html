<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#3B6FD4"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NYX"/>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png"/>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NYX — Network Status</title>
<meta name="description" content="Independent relays. Observable health. Distributed communication." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<style>
  @import url('https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css');
  @import url('https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/index.css');

  :root {
    --bg: #08090E;
    --bg-soft: #0C0E15;
    --surface: #0F1119;
    --surface-2: #141724;
    --line: rgba(255,255,255,0.06);
    --line-strong: rgba(255,255,255,0.11);
    --text: #E7EBF3;
    --text-2: #8B93A7;
    --text-3: #5A6178;
    --accent: #7FA8F0;
    --accent-soft: rgba(127,168,240,0.12);
    --violet: #9B8CF6;
    --ok: #4ADE80;
    --warn: #FBBF24;
    --crit: #F87171;
    --muted: #64748B;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --r: 12px;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  [data-theme="light"] {
    --bg: #FAFBFD;
    --bg-soft: #F4F6FA;
    --surface: #FFFFFF;
    --surface-2: #F1F4F9;
    --line: rgba(15,23,42,0.08);
    --line-strong: rgba(15,23,42,0.14);
    --text: #0F172A;
    --text-2: #5B6478;
    --text-3: #94A0B5;
    --accent: #3B6FD4;
    --accent-soft: rgba(59,111,212,0.1);
    --violet: #6D5BD0;
    --ok: #16A34A;
    --warn: #D97706;
    --crit: #DC2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background .4s var(--ease), color .4s var(--ease);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .mono { font-family: var(--mono); font-feature-settings: 'tnum' 1; }
  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid var(--bg); }

  /* ===== LOADER ===== */
  #loader {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: grid; place-items: center; transition: opacity .8s var(--ease), visibility .8s;
  }
  #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .ld { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .ld-moon { width: 84px; height: 84px; position: relative; }
  .ld-moon svg { width: 100%; height: 100%; overflow: visible; }
  .ld-ring { transform-origin: 60px 60px; animation: spin 7s linear infinite; }
  .ld-ring2 { transform-origin: 60px 60px; animation: spin 11s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ld-crescent { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  .ld-name { font-size: 15px; font-weight: 500; letter-spacing: .55em; padding-inline-start: .55em; color: var(--text); }
  .ld-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .3em; color: var(--text-3); text-transform: uppercase; margin-top: 8px; text-align: center; }
  .ld-bar { width: 160px; height: 1.5px; background: var(--line-strong); border-radius: 2px; overflow: hidden; }
  .ld-fill { height: 100%; width: 0%; background: var(--accent); transition: width .5s var(--ease); }
  .ld-status { font-family: var(--mono); font-size: 9px; letter-spacing: .22em; color: var(--text-3); text-transform: uppercase; }

  /* ===== HEADER ===== */
  .hdr {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .hdr-in { max-width: 1320px; margin: 0 auto; padding: 0 32px; height: 60px; display: flex; align-items: center; gap: 32px; }
  .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .logo svg { width: 24px; height: 24px; }
  .logo-txt { font-size: 13px; font-weight: 600; letter-spacing: .22em; }
  .nav { display: flex; gap: 2px; }
  .nav a {
    padding: 6px 13px; font-size: 12.5px; color: var(--text-2); border-radius: 7px;
    transition: color .18s, background .18s; font-weight: 450;
  }
  .nav a:hover { color: var(--text); background: var(--surface-2); }
  .nav a.on { color: var(--text); background: var(--surface-2); }
  .hdr-r { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
  .hbtn {
    height: 32px; min-width: 32px; padding: 0 9px; display: inline-flex; align-items: center; gap: 7px;
    border-radius: 8px; color: var(--text-2); border: 1px solid transparent;
    transition: color .18s, background .18s, border-color .18s; font-size: 11.5px;
  }
  .hbtn:hover { color: var(--text); background: var(--surface-2); }
  .hbtn svg { width: 14px; height: 14px; }
  .hbtn kbd { font-family: var(--mono); font-size: 9px; padding: 1px 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--text-3); }
  .pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: pl 2.4s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .upd { font-family: var(--mono); font-size: 10px; color: var(--text-3); display: flex; align-items: center; gap: 7px; padding: 0 6px; }
  .seg { display: flex; padding: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; gap: 1px; }
  .seg button { padding: 3px 9px; font-family: var(--mono); font-size: 10px; color: var(--text-3); border-radius: 6px; transition: all .18s; }
  .seg button.on { color: var(--text); background: var(--surface-2); }

  /* ===== SHELL ===== */
  .wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 0 32px 96px; }
  .view { animation: vin .5s var(--ease); }
  @keyframes vin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== HERO ===== */
  .hero { padding: 72px 0 48px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .22em; text-transform: uppercase; color: var(--text-2);
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 100px; margin-bottom: 24px;
    background: var(--surface);
  }
  .hero h1 {
    font-size: clamp(38px, 6vw, 64px); font-weight: 500; letter-spacing: -.035em; line-height: 1.04;
    margin-bottom: 18px; max-width: 680px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { font-size: 15.5px; color: var(--text-2); max-width: 520px; line-height: 1.7; font-weight: 400; }
  .hero-state {
    margin-top: 36px; display: inline-flex; align-items: center; gap: 14px;
    padding: 14px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  }
  .hero-state .dot { width: 8px; height: 8px; border-radius: 50%; position: relative; }
  .hero-state .dot::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:1px solid currentColor; opacity:.3; animation: rip 2.6s ease-out infinite; }
  @keyframes rip { 0% { transform: scale(1); opacity:.35; } 100% { transform: scale(2.1); opacity:0; } }
  .hero-state .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); }
  .hero-state .val { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .dot-ok { background: var(--ok); color: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot-warn { background: var(--warn); color: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .dot-crit { background: var(--crit); color: var(--crit); box-shadow: 0 0 10px var(--crit); }
  .dot-unknown { background: var(--muted); color: var(--muted); }

  /* ===== METRICS ===== */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); margin-bottom: 24px; }
  .metric { padding: 22px 24px; border-inline-end: 1px solid var(--line); position: relative; }
  .metric:last-child { border-inline-end: none; }
  .metric-lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }
  .metric-val { font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -.03em; line-height: 1; color: var(--text); }
  .metric-val small { font-size: 13px; color: var(--text-3); font-weight: 400; margin-inline-start: 3px; }
  .metric-sub { font-size: 11px; color: var(--text-2); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .metric-sub .c-ok { color: var(--ok); } .metric-sub .c-warn { color: var(--warn); } .metric-sub .c-crit { color: var(--crit); }

  /* ===== SECTION ===== */
  .sec { margin-bottom: 56px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .sec-title { font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--text); font-family: var(--mono); }
  .sec-note { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .sec-link { font-size: 12px; color: var(--accent); display: inline-flex; align-items: center; gap: 5px; transition: opacity .18s; }
  .sec-link:hover { opacity: .75; }
  .sec-link svg { width: 12px; height: 12px; }

  /* ===== GLOBE ===== */
  .globe-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .globe-box {
    position: relative; aspect-ratio: 16/10; min-height: 460px;
    background: radial-gradient(ellipse at 50% 45%, var(--surface-2) 0%, var(--bg-soft) 60%, var(--bg) 100%);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .globe-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
  .globe-box canvas:active { cursor: grabbing; }
  .globe-load { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; background: var(--bg-soft); transition: opacity .7s var(--ease); }
  .globe-load.done { opacity: 0; pointer-events: none; }
  .globe-load .sp { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .85s linear infinite; }
  .globe-load .tx { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--text-3); text-transform: uppercase; margin-top: 14px; text-align: center; }
  .globe-fb { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 32px; color: var(--text-2); font-size: 13px; z-index: 2; }
  .globe-fb.on { display: grid; }

  .g-ui { position: absolute; z-index: 4; }
  .g-tools { top: 14px; inset-inline-start: 14px; display: flex; flex-direction: column; gap: 4px; }
  .g-tool {
    width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px;
    background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px);
    border: 1px solid var(--line); color: var(--text-2); transition: all .18s;
  }
  .g-tool:hover { color: var(--text); border-color: var(--line-strong); }
  .g-tool.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
  .g-tool svg { width: 13px; height: 13px; }
  .g-info { top: 14px; inset-inline-end: 14px; text-align: end; font-family: var(--mono); }
  .g-info .r { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
  .g-info .v { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .g-legend { bottom: 14px; inset-inline-start: 14px; display: flex; gap: 14px; padding: 7px 12px; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 8px; }
  .g-legend span { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--text-2); letter-spacing: .04em; }
  .ld { width: 5px; height: 5px; border-radius: 50%; }
  .g-count { bottom: 14px; inset-inline-end: 14px; display: flex; gap: 18px; padding: 8px 14px; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); }
  .g-count .k { font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
  .g-count .n { font-size: 13px; color: var(--text); margin-top: 2px; font-weight: 500; }

  /* ===== RELAY CARD ===== */
  .rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 20px; }
  .rcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .rcard-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
  .rcard-name { font-size: 17px; font-weight: 500; letter-spacing: -.015em; }
  .rcard-id { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 4px; word-break: break-all; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; border-radius: 100px; border: 1px solid; flex-shrink: 0; }
  .pill .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .pill.crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 30%, transparent); background: color-mix(in srgb, var(--crit) 8%, transparent); }
  .pill.unknown { color: var(--muted); border-color: color-mix(in srgb, var(--muted) 30%, transparent); background: color-mix(in srgb, var(--muted) 8%, transparent); }
  .rsec { display: flex; flex-direction: column; gap: 2px; }
  .rsec-t { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .rrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .rrow:last-child { border-bottom: none; }
  .rrow .k { color: var(--text-2); }
  .rrow .v { font-family: var(--mono); font-size: 11.5px; color: var(--text); text-align: end; }
  .rrow .v.dim { color: var(--text-3); }
  .cal { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; margin-top: 6px; }
  .cal i { aspect-ratio: 1; border-radius: 1.5px; background: var(--surface-2); }
  .cal i.ok { background: var(--ok); opacity: .7; }
  .cal i.warn { background: var(--warn); opacity: .75; }
  .cal i.crit { background: var(--crit); opacity: .8; }
  .cal i.unknown { background: var(--muted); opacity: .4; }
  .rfoot { display: flex; gap: 8px; margin-top: auto; }
  .btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 14px; font-size: 12px; font-weight: 500; border-radius: 8px; transition: all .18s;
    border: 1px solid var(--line); color: var(--text-2); background: var(--surface-2);
  }
  .btn:hover { color: var(--text); border-color: var(--line-strong); }
  .btn.pri { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .btn svg { width: 12px; height: 12px; }
  .btn.sq { flex: 0 0 auto; width: 36px; padding: 0; }

  /* ===== TABLE ===== */
  .tbl-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--surface-2); }
  th {
    text-align: start; padding: 11px 18px; font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--text-3); font-weight: 400; white-space: nowrap; cursor: pointer; user-select: none;
    transition: color .18s;
  }
  th:hover { color: var(--text-2); }
  th.on { color: var(--accent); }
  th .ar { margin-inline-start: 4px; opacity: .5; font-size: 8px; }
  th.on .ar { opacity: 1; }
  td { padding: 13px 18px; border-top: 1px solid var(--line); vertical-align: middle; }
  tbody tr { transition: background .15s; cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:first-child td { border-top: none; }
  .t-name { font-weight: 500; color: var(--text); font-size: 13px; }
  .t-sub { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .t-loc { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .t-cc { font-family: var(--mono); font-size: 9px; padding: 2px 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; color: var(--text-3); font-weight: 500; }
  .t-mono { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .t-mono.dim { color: var(--text-3); }
  .tbl-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .pager { display: flex; gap: 3px; }
  .pg { min-width: 26px; height: 26px; padding: 0 7px; display: grid; place-items: center; border-radius: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--text-2); border: 1px solid transparent; transition: all .18s; }
  .pg:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .pg.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .pg:disabled { opacity: .3; cursor: not-allowed; }

  /* ===== FILTERS ===== */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .chips { display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .chip { padding: 5px 11px; font-family: var(--mono); font-size: 10.5px; color: var(--text-2); border-radius: 7px; transition: all .18s; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--text); background: var(--surface-2); }
  .chip .n { font-size: 9px; color: var(--text-3); }
  .chip.on .n { color: var(--accent); }
  .srch { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 220px; transition: border-color .18s; }
  .srch:focus-within { border-color: var(--accent); }
  .srch svg { width: 13px; height: 13px; color: var(--text-3); flex-shrink: 0; }
  .srch input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 12.5px; font-family: var(--sans); }
  .srch input::placeholder { color: var(--text-3); }
  select.sel { padding: 7px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text-2); font-size: 11.5px; font-family: var(--mono); outline: none; cursor: pointer; }
  select.sel:hover { border-color: var(--line-strong); }
  select.sel option { background: var(--surface); }

  /* ===== PANEL ===== */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  /* ===== LISTS ===== */
  .plist { display: flex; flex-direction: column; }
  .prow { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .prow:last-child { border-bottom: none; }
  .prow .nm { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
  .prow .mt { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .prow .lt { font-family: var(--mono); font-size: 11px; color: var(--text-2); }

  .ilist { display: flex; flex-direction: column; }
  .irow { display: grid; grid-template-columns: 56px auto 1fr; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .irow:last-child { border-bottom: none; }
  .irow .tm { font-family: var(--mono); font-size: 10px; color: var(--text-3); padding-top: 2px; }
  .irow .bar { width: 2px; border-radius: 2px; margin-top: 3px; }
  .irow .bar.ok { background: var(--ok); } .irow .bar.warn { background: var(--warn); } .irow .bar.crit { background: var(--crit); }
  .irow .ttl { color: var(--text); font-weight: 450; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .irow .dsc { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 4px; }

  /* ===== STAT CARDS ===== */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; }
  .stat-l { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  .stat-v { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.025em; line-height: 1; }
  .stat-s { font-size: 11px; color: var(--text-2); margin-top: 8px; font-family: var(--mono); }

  /* ===== RELAY DETAIL ===== */
  .rhero { padding: 40px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
  .rhero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .rhero h1 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 500; letter-spacing: -.03em; margin-bottom: 10px; }
  .rhero-meta { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 14px; }
  .rhero-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .rhero-acts { display: flex; gap: 6px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 28px; overflow-x: auto; }
  .tab { padding: 10px 16px; font-size: 12.5px; color: var(--text-2); border-bottom: 1.5px solid transparent; margin-bottom: -1px; transition: all .18s; white-space: nowrap; font-weight: 450; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }

  .chart-box { position: relative; height: 220px; }
  .chart-box canvas { width: 100%; height: 100%; display: block; }

  .diag { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .diag-i { padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .diag-k { font-size: 11.5px; color: var(--text-2); }
  .diag-v { font-family: var(--mono); font-size: 11px; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .diag-d { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ===== TOPOLOGY ===== */
  .topo-box {
    position: relative; height: 480px;
    background: radial-gradient(ellipse at 50% 50%, var(--surface-2) 0%, var(--bg-soft) 70%, var(--bg) 100%);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .topo-box canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .topo-box canvas:active { cursor: grabbing; }
  .topo-legend {
    position: absolute; bottom: 14px; inset-inline-start: 14px; display: flex; gap: 14px;
    padding: 7px 12px; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 9.5px; color: var(--text-2);
  }
  .topo-legend span { display: flex; align-items: center; gap: 6px; }
  .topo-hint {
    position: absolute; top: 14px; inset-inline-end: 14px; padding: 7px 12px;
    background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
  }

  /* ===== ANALYTICS ===== */
  .bars { display: flex; flex-direction: column; gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 52px; gap: 12px; align-items: center; }
  .bar-k { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
  .bar-track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--violet)); border-radius: 3px; transition: width .8s var(--ease); }
  .bar-v { font-family: var(--mono); font-size: 11px; color: var(--text); text-align: end; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* ===== CMD ===== */
  .cmd-ov { position: fixed; inset: 0; background: rgba(4,5,9,.66); backdrop-filter: blur(6px); z-index: 200; display: none; align-items: flex-start; justify-content: center; padding-top: 16vh; }
  .cmd-ov.on { display: flex; animation: fin .18s var(--ease); }
  @keyframes fin { from { opacity: 0; } to { opacity: 1; } }
  .cmd-dlg { width: 520px; max-width: 92vw; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.5); animation: sld .25s var(--ease); }
  @keyframes sld { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
  .cmd-in { display: flex; align-items: center; gap: 11px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .cmd-in svg { width: 15px; height: 15px; color: var(--text-3); }
  .cmd-in input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: var(--sans); }
  .cmd-in input::placeholder { color: var(--text-3); }
  .cmd-res { max-height: 340px; overflow-y: auto; padding: 7px; }
  .cmd-g { padding: 9px 10px 4px; font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); }
  .cmd-i { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: background .12s; }
  .cmd-i:hover, .cmd-i.sel { background: var(--surface-2); }
  .cmd-ic { width: 26px; height: 26px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; color: var(--accent); flex-shrink: 0; }
  .cmd-ic svg { width: 12px; height: 12px; }
  .cmd-lb { flex: 1; color: var(--text); }
  .cmd-ht { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); }
  .cmd-ft { padding: 9px 16px; border-top: 1px solid var(--line); display: flex; gap: 14px; font-family: var(--mono); font-size: 9.5px; color: var(--text-3); }
  .cmd-ft kbd { padding: 1px 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; margin-inline-end: 4px; }

  /* ===== TOOLTIP / TOAST ===== */
  .tip { position: fixed; pointer-events: none; z-index: 300; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; font-size: 11.5px; box-shadow: 0 8px 32px rgba(0,0,0,.4); opacity: 0; transform: translateY(3px); transition: opacity .14s, transform .14s; max-width: 260px; }
  .tip.on { opacity: 1; transform: none; }
  .tip-t { font-weight: 500; margin-bottom: 3px; }
  .tip-m { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .toasts { position: fixed; bottom: 22px; inset-inline-end: 22px; z-index: 400; display: flex; flex-direction: column; gap: 7px; }
  .toast { padding: 10px 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; font-size: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4); display: flex; align-items: center; gap: 10px; animation: tin .3s var(--ease); }
  .toast.out { animation: tout .25s var(--ease) forwards; }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes tout { to { opacity: 0; transform: translateY(8px); } }

  .empty { padding: 56px 24px; text-align: center; }
  .empty-t { font-size: 13px; color: var(--text-2); font-weight: 500; margin-bottom: 6px; }
  .empty-d { font-size: 12px; color: var(--text-3); }

  /* ===== FOOTER ===== */
  .ftr { border-top: 1px solid var(--line); margin-top: 40px; }

  .ftr-r { display: flex; gap: 20px; font-size: 11.5px; color: var(--text-2); }
  .ftr-r a:hover { color: var(--text); }
  .ftr-m { font-family: var(--mono); font-size: 10px; color: var(--text-3); display: flex; gap: 16px; }

function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function buildData() {
  const now = Date.now();
  const relays = SEEDS.map((r, i) => {
    const R = rng(i * 7919 + 13);
    const hist = Array.from({ length: 90 }, () => {
      const x = R();
      const cc = r.st === 'crit' ? .35 : r.st === 'warn' ? .07 : .012;
      const wc = r.st === 'crit' ? .22 : r.st === 'warn' ? .17 : .035;
      if (x < cc) return 'crit';
      if (x < cc + wc) return 'warn';
      if (x < cc + wc + .02) return 'unknown';
      return 'ok';
    });
    for (let k = 86; k < 90; k++) {
      if (r.st === 'crit') hist[k] = 'crit';
      else if (r.st === 'warn' && R() < .28) hist[k] = 'warn';
      else if (r.st === 'ok') hist[k] = R() < .025 ? 'warn' : 'ok';
    }
    const calc = n => hist.slice(90 - n).reduce((s, d) => s + (d === 'ok' ? 1 : d === 'warn' ? .7 : 0), 0) / n * 100;
    const lat = Array.from({ length: 96 }, (_, k) => ({ t: now - (95 - k) * 9e5, v: Math.round((r.ms || 200) * (.86 + R() * .28) + Math.sin(k / 6) * (r.ms || 200) * .07) }));
    return {
      id: 'nyx-' + r.n.replace(/[^a-z0-9]/g, ''), name: r.n, endpoint: `https://${r.n}.nyx.network`,
      country: r.cc, city: r.city, latitude: r.lat, longitude: r.lng, location_verified: true,
      status: r.st,
      status_reason: r.st === 'ok' ? 'Recent checks nominal' : r.st === 'warn' ? 'Elevated latency / partial federation' : r.st === 'crit' ? 'Unreachable > 5 min' : 'No recent observations',
      observed_at: now - (r.st === 'unknown' ? 9e5 : Math.floor(R() * 3e4)),
      last_success_at: r.st === 'crit' ? now - 42e4 : now - Math.floor(R() * 6e4),
      latency_ms: r.ms, latency_p50: r.ms != null ? Math.round(r.ms * .92) : null, latency_p95: r.ms != null ? Math.round(r.ms * 1.44) : null,
      success_rate: r.st === 'crit' ? 0 : r.st === 'warn' ? 96.4 : 99.9,
      uptime_percent: r.up, uptime_24h: calc(1), uptime_7d: calc(7), uptime_30d: calc(30),
      incidents_30d: hist.slice(60).filter(d => d === 'crit').length,
      last_downtime: hist.slice(60).includes('crit') ? now - Math.floor(R() * 432e6) : null,
      protocol_version: r.pv, software_version: r.sv, php_version: '8.2.' + Math.floor(R() * 20),
      sodium: true, sqlite: r.st === 'crit' ? 'unknown' : 'ok',
      api_health: r.st === 'crit' ? 'crit' : r.st === 'warn' ? 'warn' : 'ok',
      discovery: r.st === 'crit' ? 'crit' : 'ok',
      selftest: r.st === 'crit' ? 'failed' : r.st === 'warn' ? 'warning' : 'passed',
      queue: r.st === 'crit' ? null : Math.floor(R() * 50),
      messages: Math.floor(R() * 5e5) + 1e4, memberships: Math.floor(R() * 2e3) + 50,
      peer_count: r.pc,
      peers: r.pc ? Array.from({ length: r.pc }, (_, j) => ({
        id: `peer-${i}-${j}`, name: SEEDS[(i + j + 3) % SEEDS.length].n,
        status: R() > .14 ? 'ok' : 'warn', latency_ms: Math.round(40 + R() * 200),
        last_seen: now - Math.floor(R() * 12e4), remote_version: R() > .2 ? 'v3.0.2' : 'v3.0.1',
      })) : [],
      uptime_history: hist, latency_history: lat, probe: 'EU-CENTRAL-1',
    };
  });

  const links = [];
  relays.forEach(r => r.peers.forEach(p => {
    const tg = relays.find(x => x.name === p.name);
    if (tg && !links.some(l => (l.a === r.id && l.b === tg.id) || (l.a === tg.id && l.b === r.id)))
      links.push({ a: r.id, b: tg.id, status: p.status, latency_ms: p.latency_ms });
  }));

  const incidents = [
    { time: now - 24e4, sev: 'crit', relay: 'nyx-dubai-01', title: 'Relay became unreachable', detail: 'HTTP timeout after 3 consecutive checks', resolved: false },
    { time: now - 18e5, sev: 'warn', relay: 'nyx-saopaulo-01', title: 'Latency elevated', detail: 'Median latency exceeded 200ms threshold', resolved: false },
    { time: now - 36e5, sev: 'warn', relay: 'nyx-sydney-01', title: 'Partial federation', detail: '2 of 4 peers unreachable', resolved: false },
    { time: now - 72e5, sev: 'ok', relay: 'nyx-berlin-01', title: 'Relay recovered', detail: 'All checks nominal after maintenance', resolved: true },
    { time: now - 144e5, sev: 'warn', relay: 'nyx-auckland-01', title: 'Self-test warning', detail: 'Sodium availability check slow', resolved: true },
    { time: now - 288e5, sev: 'ok', relay: 'nyx-tokyo-01', title: 'Peer connection restored', detail: 'Federation link re-established', resolved: true },
    { time: now - 432e5, sev: 'warn', relay: 'nyx-mumbai-01', title: 'Queue depth warning', detail: 'Message queue exceeded soft limit', resolved: true },
    { time: now - 72e6, sev: 'crit', relay: 'nyx-dubai-01', title: 'Protocol compatibility warning', detail: 'Remote version mismatch detected', resolved: true },
    { time: now - 864e5, sev: 'warn', relay: 'nyx-lagos-01', title: 'Intermittent timeouts', detail: '3 timeouts in last hour', resolved: true },
    { time: now - 108e6, sev: 'ok', relay: 'nyx-oslo-01', title: 'Software updated', detail: 'Upgraded to v0.9.4 successfully', resolved: true },
  ];

  const lh = [], sh = [], R1 = rng(42), R2 = rng(77);
  for (let i = 96; i >= 0; i--) {
    lh.push({ t: now - i * 9e5, v: Math.round(85 + Math.sin(i / 8) * 14 + R1() * 18) });
    sh.push({ t: now - i * 9e5, v: Math.min(100, Math.max(95.5, 99.3 + Math.sin(i / 10) * .35 + R2() * .28)) });
  }
  const av = [], R3 = rng(99);
  for (let i = 30; i >= 0; i--) av.push({ t: now - i * 864e5, v: 99 + R3() * .95 });

  return { generated_at: now, demo: true, relays, links, incidents, latency_history: lh, success_history: sh, availability_history: av, protocol_version: 'v3.0.2' };
}

function health(relays) {
  const c = { ok: 0, warn: 0, crit: 0, unknown: 0 };
  (Array.isArray(relays) ? relays : []).forEach(r => { const s = (r && r.status) || 'unknown'; c[s] = (c[s] || 0) + 1; });
  const total = relays.length;
  let overall = 'ok';
  if (!total) overall = 'unknown';
  else if (c.crit / total >= .3) overall = 'crit';
  else if ((c.crit + c.warn) / total >= .25 || c.crit >= 2) overall = 'warn';
  else if (!c.ok) overall = 'unknown';
  return { overall, c, total };
}

function bindOverview() {

function renderMetrics() {
  const el = document.getElementById('metrics');
  if (!el || !state.data) return;
  const h = health(state.data.relays);
  const lats = (state.data.relays||[]).map(r => r.latency_ms).filter(v => v != null).sort((a, b) => a - b);
  const med = lats.length ? lats[Math.floor(lats.length / 2)] : null;
  const last = Math.max(...(state.data.relays||[]).map(r => r.observed_at));
  const items = [
    { l: t('m.relays'), v: h.total, s: `<span class="c-ok">${h.c.ok} healthy</span> · ${h.c.unknown} unknown` },
    { l: t('m.healthy'), v: h.c.ok, s: `${(h.c.ok / Math.max(1, h.total) * 100).toFixed(1)}% of fleet` },
    { l: t('m.latency'), v: med != null ? med : '—', u: med != null ? 'ms' : '', s: med != null ? `p95 ${lats[Math.floor(lats.length * .95)] || med}ms` : 'insufficient data' },
    { l: t('m.observed'), v: rel(last), s: new Date(last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) },
  ];
  el.innerHTML = items.map(m => `
    <div class="metric">
      <div class="metric-lbl">${m.l}</div>
      <div class="metric-val">${m.v}${m.u ? `<small>${m.u}</small>` : ''}</div>
      <div class="metric-sub">${m.s}</div>
    </div>`).join('');
}

function renderTopTable() {
  const el = document.getElementById('top-body');
  if (!el) return;
  const ord = { ok: 0, warn: 1, crit: 2, unknown: 3 };
  const rows = (state.data.relays||[]).slice().sort((a, b) => ord[a.status] - ord[b.status] || (a.latency_ms ?? 9999) - (b.latency_ms ?? 9999)).slice(0, 8);
  el.innerHTML = rows.map(r => `
    <tr data-id="${esc(r.id)}">
      <td><div class="t-name">${esc(r.name)}</div><div class="t-sub">${esc(r.endpoint)}</div></td>
      <td><div class="t-loc"><span class="t-cc">${esc(r.country)}</span>${esc(r.city)}</div></td>
      <td><span class="pill ${r.status}"><span class="d"></span>${t('st.' + r.status)}</span></td>
      <td class="t-mono ${r.latency_ms == null ? 'dim' : ''}">${r.latency_ms != null ? r.latency_ms + ' ms' : '—'}</td>
      <td class="t-mono ${r.uptime_percent == null ? 'dim' : ''}">${r.uptime_percent != null ? r.uptime_percent.toFixed(2) + '%' : '—'}</td>
      <td class="t-mono ${r.peer_count == null ? 'dim' : ''}">${r.peer_count != null ? r.peer_count : '—'}</td>
    </tr>`).join('');
  el.querySelectorAll('tr').forEach(tr => tr.onclick = () => go('relay', tr.dataset.id));
}

/* ---------- VIEW: Directory ---------- */
function vDirectory() {
  return `

        <input type="search" id="srch" value="${esc(state.search)}" placeholder="${t('search.ph')}" data-i18n-ph="search.ph"/>
      </div>
      <select class="sel" id="f-cc"><option value="">All countries</option></select>
      <select class="sel" id="f-pv"><option value="">All protocols</option></select>
    </div>
    <div class="tbl-box">
      <div class="tbl-scroll">
        <table><thead><tr>
          <th data-s="name">${t('th.name')}<span class="ar">↕</span></th>
          <th data-s="country">${t('th.loc')}<span class="ar">↕</span></th>
          <th data-s="status">${t('th.status')}<span class="ar">↕</span></th>
          <th data-s="latency_ms">${t('th.lat')}<span class="ar">↕</span></th>
          <th data-s="uptime_percent">${t('th.up')}<span class="ar">↕</span></th>
          <th data-s="protocol_version">${t('th.proto')}<span class="ar">↕</span></th>
          <th data-s="peer_count">${t('th.peers')}<span class="ar">↕</span></th>
          <th data-s="observed_at">${t('th.last')}<span class="ar">↕</span></th>
        </tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="tbl-foot"><span id="tinfo">—</span><div class="pager" id="pager"></div></div>
    </div>
  </div>`;
}

function bindDirectory() {
  const h = health(state.data.relays);
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('cn-all', h.total); set('cn-ok', h.c.ok); set('cn-warn', h.c.warn); set('cn-crit', h.c.crit); set('cn-unknown', h.c.unknown);

  const ccs = [...new Set((state.data.relays||[]).map(r => r.country))].sort();
  const ccEl = document.getElementById('f-cc');
  ccs.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if (c === state.countryFilter) o.selected = true; ccEl.appendChild(o); });
  const pvs = [...new Set((state.data.relays||[]).map(r => r.protocol_version))].sort();
  const pvEl = document.getElementById('f-pv');
  pvs.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; if (p === state.protoFilter) o.selected = true; pvEl.appendChild(o); });

  ccEl.onchange = () => { state.countryFilter = ccEl.value; state.page = 1; drawTable(); };
  pvEl.onchange = () => { state.protoFilter = pvEl.value; state.page = 1; drawTable(); };
  document.querySelectorAll('#chips .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('#chips .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); state.filter = c.dataset.f; state.page = 1; drawTable();
  });
  document.getElementById('srch').oninput = e => { state.search = e.target.value; state.page = 1; drawTable(); };
  document.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => {
    const k = th.dataset.s;
    if (state.sort.key === k) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort.key = k; state.sort.dir = 'asc'; }
    drawTable();
  });
  drawTable();
}

function drawTable() {
  let rows = (state.data.relays||[]).slice();
  if (state.filter !== 'all') rows = rows.filter(r => r.status === state.filter);
  if (state.countryFilter) rows = rows.filter(r => r.country === state.countryFilter);
  if (state.protoFilter) rows = rows.filter(r => r.protocol_version === state.protoFilter);
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(q) || r.country.toLowerCase().includes(q) || r.city.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
  }
  const ord = { ok: 0, warn: 1, crit: 2, unknown: 3 };
  rows.sort((a, b) => {
    const k = state.sort.key;
    let av = a[k], bv = b[k];
    if (k === 'status') { av = ord[av]; bv = ord[bv]; }
    if (av == null) return 1; if (bv == null) return -1;
    return (av < bv ? -1 : av > bv ? 1 : 0) * (state.sort.dir === 'asc' ? 1 : -1);
  });

  const total = rows.length, ps = state.pageSize;
  const tp = Math.max(1, Math.ceil(total / ps));
  state.page = Math.min(state.page, tp);
  const start = (state.page - 1) * ps;
  const pr = rows.slice(start, start + ps);

  const tb = document.getElementById('tbody');
  if (!pr.length) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty"><div class="empty-t">${t('empty.t')}</div><div class="empty-d">${t('empty.d')}</div></div></td></tr>`;
  } else {
    tb.innerHTML = pr.map(r => `
      <tr data-id="${esc(r.id)}">
        <td><div class="t-name">${esc(r.name)}</div><div class="t-sub">${esc(r.endpoint)}</div></td>
        <td><div class="t-loc"><span class="t-cc">${esc(r.country)}</span>${esc(r.city)}</div></td>
        <td><span class="pill ${r.status}"><span class="d"></span>${t('st.' + r.status)}</span></td>
        <td class="t-mono ${r.latency_ms == null ? 'dim' : ''}">${r.latency_ms != null ? r.latency_ms + ' ms' : '—'}</td>
        <td class="t-mono ${r.uptime_percent == null ? 'dim' : ''}">${r.uptime_percent != null ? r.uptime_percent.toFixed(2) + '%' : '—'}</td>
        <td class="t-mono">${esc(r.protocol_version)}</td>
        <td class="t-mono ${r.peer_count == null ? 'dim' : ''}">${r.peer_count != null ? r.peer_count : '—'}</td>
        <td class="t-mono dim">${rel(r.observed_at)} ago</td>
      </tr>`).join('');
    tb.querySelectorAll('tr').forEach(tr => tr.onclick = () => go('relay', tr.dataset.id));
  }

  document.getElementById('tinfo').textContent = total ? `${start + 1}–${Math.min(start + ps, total)} / ${total}` : '0';
  const pg = document.getElementById('pager');
  let ph = `<button class="pg" ${state.page <= 1 ? 'disabled' : ''} data-p="${state.page - 1}">‹</button>`;
  for (let i = 1; i <= tp; i++) {
    if (tp > 7 && i > 2 && i < tp - 1 && Math.abs(i - state.page) > 1) { if (i === 3) ph += `<span style="color:var(--text-3);padding:0 3px">…</span>`; continue; }
    ph += `<button class="pg ${i === state.page ? 'on' : ''}" data-p="${i}">${i}</button>`;
  }
  ph += `<button class="pg" ${state.page >= tp ? 'disabled' : ''} data-p="${state.page + 1}">›</button>`;
  pg.innerHTML = ph;
  pg.querySelectorAll('.pg').forEach(b => b.onclick = () => { const p = +b.dataset.p; if (p >= 1 && p <= tp) { state.page = p; drawTable(); } });
  document.querySelectorAll('th[data-s]').forEach(th => th.classList.toggle('on', th.dataset.s === state.sort.key));
}

/* ---------- VIEW: Federation ---------- */
function vFederation() {
  const d = state.data || { relays: [], links: [] };
  const relays = Array.isArray(d.relays) ? d.relays : [];
  const peers = [];
  relays.forEach(r => {
    (Array.isArray(r.peers) ? r.peers : []).forEach(p => peers.push({ from: r.name, ...(p || {}) }));
  });
  if (!peers.length && Array.isArray(d.links)) {
    d.links.forEach(l => peers.push({ from: l.from || l.a, name: l.to || l.b || l.name, status: l.status || 'ok', remote_version: l.remote_version }));
  }
  const seen = new Set();
  const uniq = peers.filter(p => { const k = [p.from, p.name].sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
  const conn = uniq.filter(p => p.status === 'ok').length;
  const warn = uniq.filter(p => p.status === 'warn').length;
  const fail = uniq.filter(p => p.status === 'crit').length;
  const vc = {};
  uniq.forEach(p => { const v = p.remote_version || 'unknown'; vc[v] = (vc[v] || 0) + 1; });
  const vs = Object.entries(vc).sort((a, b) => b[1] - a[1]);
  const vmax = vs[0]?.[1] || 1;

  return `
  <div class="view">
    <div class="sec-head" style="padding-top:48px">
      <div><div class="sec-title">${t('page.fed')}</div><div class="sec-note" style="margin-top:6px">${t('page.fed.d')}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-l">${t('fed.links')}</div><div class="stat-v">${uniq.length}</div><div class="stat-s">observed pairs</div></div>
      <div class="stat"><div class="stat-l">${t('fed.connected')}</div><div class="stat-v" style="color:var(--ok)">${conn}</div><div class="stat-s">${(conn / Math.max(1, uniq.length) * 100).toFixed(1)}% healthy</div></div>
      <div class="stat"><div class="stat-l">${t('fed.degraded')}</div><div class="stat-v" style="color:var(--warn)">${warn}</div><div class="stat-s">partial issues</div></div>
      <div class="stat"><div class="stat-l">${t('fed.failed')}</div><div class="stat-v" style="color:var(--crit)">${fail}</div><div class="stat-s">unreachable</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="sec-head" style="margin-bottom:14px"><div class="sec-title">${t('fed.peers')}</div><div class="sec-note">${t('fed.note', { c: conn, t: uniq.length })}</div></div>
        <div class="plist">${uniq.slice(0, 24).map(p => `
          <div class="prow">
            <span class="pill ${p.status}" style="padding:2px 8px"><span class="d"></span></span>
            <div><div class="nm">${esc(p.name)}</div><div class="mt">from ${esc(p.from)}</div></div>
            <span class="lt">${p.latency_ms} ms</span>
            <span class="mt">${rel(p.last_seen)} ago</span>
          </div>`).join('')}</div>
      </div>
      <div class="panel">
        <div class="sec-head" style="margin-bottom:18px"><div class="sec-title">${t('fed.versions')}</div></div>
        <div class="bars">${vs.map(([v, n]) => `
          <div class="bar-row">
            <span class="bar-k">${esc(v)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(n / vmax) * 100}%"></div></div>
            <span class="bar-v">${n}</span>
          </div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

function bindTopology() {
  document.querySelectorAll('#topo-chips .chip').forEach(c => c.onclick = () => {

    c.classList.add('on');
    state.topoFilter = c.dataset.f;
    drawTopology();
  });
}

let topoState = { nodes: [], edges: [], tx: 0, ty: 0, scale: 1, hover: null };
function drawTopology() {
  const cv = document.getElementById('topo-cv');
  if (!cv || !state.data) return;
  const dpr = window.devicePixelRatio || 1;
  const rc = cv.getBoundingClientRect();
  if (!rc.width) return;
  cv.width = rc.width * dpr; cv.height = rc.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rc.width, H = rc.height;
  const dark = document.documentElement.dataset.theme === 'dark';

  let relays = state.data.relays;
  if (state.topoFilter === 'healthy') relays = relays.filter(r => r.status === 'ok');
  if (state.topoFilter === 'issues') relays = relays.filter(r => r.status !== 'ok');
  const ids = new Set(relays.map(r => r.id));

  const nodes = relays.map((r, i) => ({
    id: r.id, name: r.name, status: r.status, city: r.city, cc: r.country,
    latency: r.latency_ms, peers: r.peer_count,
    x: W / 2 + Math.cos(i * 2.399) * Math.min(W, H) * .3,
    y: H / 2 + Math.sin(i * 2.399) * Math.min(W, H) * .3,
    vx: 0, vy: 0,
  }));
  const nm = {}; nodes.forEach(n => nm[n.id] = n);
  const rawL = Array.isArray(state.data.links) ? state.data.links : [];
  const edges = rawL.map(l => {
    const a = l.a || l.source; const b = l.b || l.target;
    if (!ids.has(a) || !ids.has(b) || !nm[a] || !nm[b]) return null;
    return { s: nm[a], t: nm[b], st: l.status || 'ok' };
  }).filter(Boolean);

  // force simulation
  for (let it = 0; it < 140; it++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        const d2 = dx * dx + dy * dy + 1, d = Math.sqrt(d2);
        const f = 4200 / d2;
        nodes[i].vx -= (dx / d) * f; nodes[i].vy -= (dy / d) * f;
        nodes[j].vx += (dx / d) * f; nodes[j].vy += (dy / d) * f;
      }
    }
    edges.forEach(e => {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 1;
      const f = (d - 95) * .014;
      e.s.vx += (dx / d) * f; e.s.vy += (dy / d) * f;
      e.t.vx -= (dx / d) * f; e.t.vy -= (dy / d) * f;
    });
    nodes.forEach(n => {
      n.vx += (W / 2 - n.x) * .0035; n.vy += (H / 2 - n.y) * .0035;
      n.x += n.vx * .22; n.y += n.vy * .22;
      n.vx *= .78; n.vy *= .78;
      n.x = Math.max(56, Math.min(W - 56, n.x));
      n.y = Math.max(56, Math.min(H - 56, n.y));
    });
  }

  const _prev = topoState || {};
  topoState = { nodes, edges, W, H, tx: _prev.tx || 0, ty: _prev.ty || 0, scale: _prev.scale || 1, hover: null };
  // stats
  const deg = {};
  edges.forEach(e => { deg[e.s.id] = (deg[e.s.id] || 0) + 1; deg[e.t.id] = (deg[e.t.id] || 0) + 1; });
  const sn = id => document.getElementById(id);
  if (sn('tp-n')) sn('tp-n').textContent = nodes.length;
  if (sn('tp-e')) sn('tp-e').textContent = edges.length;
  if (sn('tp-d')) sn('tp-d').textContent = nodes.length ? (edges.length * 2 / nodes.length).toFixed(1) : '—';
  if (sn('tp-i')) sn('tp-i').textContent = nodes.filter(n => !deg[n.id]).length;

  paintTopology(cv, ctx, W, H, dark);

  // interaction (bind once so soft refresh keeps pan/zoom)
  if (!cv._topoBound) {
    cv._topoBound = true;
    let drag = false, lx = 0, ly = 0, moved = false;
    cv.onpointerdown = e => { drag = true; moved = false; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; };
    cv.onpointermove = e => {
      if (!topoState.nodes) return;
      const rr = cv.getBoundingClientRect();
      const mx = e.clientX - rr.left, my = e.clientY - rr.top;
      const sc = topoState.scale || 1, tx = topoState.tx || 0, ty = topoState.ty || 0;
      if (drag) {
        const dx = e.clientX - lx, dy = e.clientY - ly;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        topoState.tx += dx; topoState.ty += dy;
        lx = e.clientX; ly = e.clientY;
        paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark');
        return;
      }
      const hit = topoState.nodes.find(n => Math.hypot(n.x * sc + tx - mx, n.y * sc + ty - my) < 14);
      const tip = document.getElementById('tip');
      if (hit) {
        const deg = {};
        (topoState.edges || []).forEach(e => { deg[e.s.id] = (deg[e.s.id] || 0) + 1; deg[e.t.id] = (deg[e.t.id] || 0) + 1; });
        tip.innerHTML = `<div class="tip-t">${esc(hit.name)}</div><div class="tip-m">${esc(hit.city || '')}${hit.cc ? ', ' + esc(hit.cc) : ''} · ${hit.latency != null ? hit.latency + 'ms' : '—'}</div><div class="tip-m">${t('st.' + hit.status)} · ${hit.peers || 0} peers · ${deg[hit.id] || 0} links</div>`;
        tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
        tip.classList.add('on');
        cv.style.cursor = 'pointer';
        if (topoState.hover !== hit.id) { topoState.hover = hit.id; paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark'); }
      } else {
        tip.classList.remove('on');
        cv.style.cursor = 'grab';
        if (topoState.hover !== null) { topoState.hover = null; paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark'); }
      }
    };
    cv.onpointerup = e => {
      drag = false;
      cv.style.cursor = 'grab';
      const tipEl = document.getElementById('tip');
      if (tipEl) tipEl.classList.remove('on');
      if (!moved && topoState.nodes) {
        const rr = cv.getBoundingClientRect();
        const mx = e.clientX - rr.left, my = e.clientY - rr.top;
        const sc = topoState.scale || 1, tx = topoState.tx || 0, ty = topoState.ty || 0;
        const hit = topoState.nodes.find(n => Math.hypot(n.x * sc + tx - mx, n.y * sc + ty - my) < 14);
        if (hit) { if (tipEl) tipEl.classList.remove('on'); go('relay', hit.id); }
      }
    };
    cv.onpointerleave = () => { drag = false; const tip = document.getElementById('tip'); if (tip) tip.classList.remove('on'); if (topoState) { topoState.hover = null; paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark'); } };
    cv.ondblclick = () => { topoState.tx = 0; topoState.ty = 0; topoState.scale = 1; paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark'); };
    cv.onwheel = e => {
      e.preventDefault();
      if (!topoState) return;
      const rr = cv.getBoundingClientRect();
      const mx = e.clientX - rr.left, my = e.clientY - rr.top;
      const old = topoState.scale || 1;
      topoState.scale = Math.max(0.4, Math.min(3.5, old - e.deltaY * 0.0012));
      const k = topoState.scale / old;
      topoState.tx = mx - (mx - (topoState.tx || 0)) * k;
      topoState.ty = my - (my - (topoState.ty || 0)) * k;
      paintTopology(cv, cv.getContext('2d'), topoState.W, topoState.H, document.documentElement.dataset.theme === 'dark');
    };
  }
}

function paintTopology(cv, ctx, W, H, dark) {
  ctx.clearRect(0, 0, W, H);
  const { nodes, edges, tx, ty, scale, hover } = topoState;
  const COL = { ok: '#4ADE80', warn: '#FBBF24', crit: '#F87171', unknown: '#64748B' };
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);

  // edges
  edges.forEach(e => {
    const c = COL[e.st] || COL.unknown;
    const active = hover && (e.s.id === hover || e.t.id === hover);
    ctx.strokeStyle = active ? c : (dark ? c + '33' : c + '55');
    ctx.lineWidth = active ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
  });

  // nodes
  nodes.forEach(n => {
    const c = COL[n.status] || COL.unknown;
    const isH = hover === n.id;
    const rad = isH ? 8 : 5.5;
    // glow
    ctx.beginPath(); ctx.arc(n.x, n.y, rad * 2.4, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.globalAlpha = isH ? .14 : .07; ctx.fill(); ctx.globalAlpha = 1;
    // core
    ctx.beginPath(); ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.shadowColor = c; ctx.shadowBlur = isH ? 16 : 8;
    ctx.fill(); ctx.shadowBlur = 0;
    // ring
    if (isH) {
      ctx.beginPath(); ctx.arc(n.x, n.y, rad + 5, 0, Math.PI * 2);
      ctx.strokeStyle = c; ctx.globalAlpha = .4; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
    }
    // label
    ctx.font = '9.5px "JetBrains Mono", monospace';
    ctx.fillStyle = isH ? (dark ? '#E7EBF3' : '#0F172A') : (dark ? '#8B93A7' : '#5B6478');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(n.name.replace('nyx-', '').replace('-01', ''), n.x, n.y + rad + 7);
  });
  ctx.restore();
}

function renderAnBars() {

function drawAnalytics() {
  if (!state.data) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  // stats
  const lats = (state.data.relays||[]).map(r => r.latency_ms).filter(v => v != null).sort((a, b) => a - b);
  const p50 = lats.length ? lats[Math.floor(lats.length * .5)] : null;
  const p95 = lats.length ? lats[Math.floor(lats.length * .95)] : null;
  const mn = lats.length ? lats[0] : null;
  const mx = lats.length ? lats[lats.length - 1] : null;
  const el = document.getElementById('an-stats');
  if (el) el.innerHTML = `
    <div class="stat"><div class="stat-l">${t('an.p50')}</div><div class="stat-v">${p50 != null ? p50 + 'ms' : '—'}</div><div class="stat-s">median across fleet</div></div>

}

/* ---------- Charts ---------- */
function drawLine(id, data, o = {}) {
  const cv = document.getElementById(id);
  if (!cv || !data || !data.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rc = cv.getBoundingClientRect();
  if (!rc.width) return;
  cv.width = rc.width * dpr; cv.height = rc.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rc.width, H = rc.height;
  ctx.clearRect(0, 0, W, H);
  const dark = document.documentElement.dataset.theme === 'dark';
  const grid = dark ? 'rgba(255,255,255,.045)' : 'rgba(15,23,42,.07)';
  const txt = dark ? '#5A6178' : '#94A0B5';
  const line = o.color || (dark ? '#7FA8F0' : '#3B6FD4');
  const fill = o.fill || (dark ? 'rgba(127,168,240,.1)' : 'rgba(59,111,212,.08)');
  const pl = 44, pr = 12, pt = 12, pb = 26;
  const pw = W - pl - pr, ph = H - pt - pb;
  const vs = data.map(d => d.v);
  const mn = o.minV != null ? o.minV : Math.min(...vs) - (o.pad || 8);
  const mx = o.maxV != null ? o.maxV : Math.max(...vs) + (o.pad || 8);
  const t0 = data[0].t, t1 = data[data.length - 1].t;
  ctx.font = '9.5px "JetBrains Mono", monospace'; ctx.fillStyle = txt;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const y = pt + ph * i / 4, v = mx - (mx - mn) * i / 4;
    ctx.strokeStyle = grid; ctx.beginPath(); ctx.setLineDash([2, 4]); ctx.moveTo(pl, y); ctx.lineTo(W - pr, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillText((o.fmtV ? o.fmtV(v) : Math.round(v)) + (o.unit || ''), pl - 7, y);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i <= 5; i++) {
    const x = pl + pw * i / 5, tt = t0 + (t1 - t0) * i / 5;
    const d = new Date(tt);
    ctx.fillText(String(d.getHours()).padStart(2, '0') + ':00', x, H - pb + 8);
  }
  const X = tt => pl + (tt - t0) / (t1 - t0) * pw, Y = v => pt + (1 - (v - mn) / (mx - mn)) * ph;
  ctx.beginPath();
  data.forEach((d, i) => { const x = X(d.t), y = Y(d.v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  const g = ctx.createLinearGradient(0, pt, 0, pt + ph);
  g.addColorStop(0, fill); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.lineTo(X(t1), pt + ph); ctx.lineTo(X(t0), pt + ph); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath();
  data.forEach((d, i) => { const x = X(d.t), y = Y(d.v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.strokeStyle = line; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
  const last = data[data.length - 1], lx = X(last.t), ly = Y(last.v);
  ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI * 2); ctx.fillStyle = line; ctx.fill();
  ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.strokeStyle = line; ctx.globalAlpha = .25; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
}

function drawHist(id, values) {
  const cv = document.getElementById(id);
  if (!cv || !values.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rc = cv.getBoundingClientRect();
  if (!rc.width) return;
  cv.width = rc.width * dpr; cv.height = rc.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rc.width, H = rc.height;
  ctx.clearRect(0, 0, W, H);
  const dark = document.documentElement.dataset.theme === 'dark';
  const txt = dark ? '#5A6178' : '#94A0B5';
  const buckets = 10;
  const mn = Math.min(...values), mx = Math.max(...values);
  const bs = (mx - mn) / buckets || 1;
  const counts = new Array(buckets).fill(0);
  values.forEach(v => counts[Math.min(buckets - 1, Math.floor((v - mn) / bs))]++);
  const mc = Math.max(...counts);
  const pl = 34, pr = 10, pt = 10, pb = 26;
  const pw = W - pl - pr, ph = H - pt - pb;
  const bw = pw / buckets - 5;

  ctx.font = '9px "JetBrains Mono", monospace'; ctx.fillStyle = txt;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const y = pt + ph * i / 3;
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.045)' : 'rgba(15,23,42,.07)';
    ctx.beginPath(); ctx.setLineDash([2, 4]); ctx.moveTo(pl, y); ctx.lineTo(W - pr, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillText(Math.round(mc - mc * i / 3), pl - 6, y);
  }
  counts.forEach((c, i) => {
    const x = pl + i * (pw / buckets) + 2.5;
    const h = (c / mc) * ph;
    const g = ctx.createLinearGradient(0, pt + ph - h, 0, pt + ph);
    g.addColorStop(0, dark ? '#7FA8F0' : '#3B6FD4');
    g.addColorStop(1, dark ? 'rgba(155,140,246,.35)' : 'rgba(109,91,208,.35)');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, pt + ph - h, bw, h, [3, 3, 0, 0]); ctx.fill(); }
    else { ctx.fillRect(x, pt + ph - h, bw, h); }
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = txt;
  for (let i = 0; i <= buckets; i += 2) {
    const x = pl + i * (pw / buckets);
    ctx.fillText(Math.round(mn + i * bs) + 'ms', x, H - pb + 8);
  }
}

function drawCharts() {
  if (!state.data) return;
  if (state.route.page === 'analytics') drawAnalytics();
  if (state.route.page === 'relay' && state.relayTab === 'perf') {
    const r = (state.data.relays||[]).find(x => x.id === state.route.param);
    if (r) drawLine('c-lat', r.latency_history, { unit: 'ms' });
  }
  if (state.route.page === 'topology') drawTopology();
}

   GLOBE — realistic Earth (real textures + procedural fallback)
   ===================================================================== */
let globe = null;
async function initGlobe() {
  ld(24, 'Loading 3D engine');
  let THREE;
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  try {
    const sources = [
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
      'https://unpkg.com/three@0.160.0/build/three.module.min.js',
      'https://esm.sh/three@0.160.0',
      './vendor/three.module.min.js'
    ];
    let last = null;
    for (const src of sources) {
      try { THREE = await withTimeout(import(src), src.startsWith('.') ? 2500 : 9000); if (THREE) break; }
      catch (e) { last = e; }
    }
    if (!THREE) { console.warn('three.js unavailable', last); return null; }
  } catch (e) { console.warn('three.js unavailable', e); return null; }
  ld(42, 'Fetching Earth textures');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, .1, 100);
  camera.position.set(0, 0, 3.1);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0, 0);

  const group = new THREE.Group();
  scene.add(group);

  const tl = new THREE.TextureLoader();
  tl.setCrossOrigin('anonymous');
  const load = u => new Promise(res => {
    tl.load(u, res, undefined, () => {
      // fallback remote only if local missing
      if (u.includes('/vendor/textures/')) {
        const name = u.split('/').pop();
        tl.load('https://unpkg.com/three-globe@2.31.0/example/img/' + name, res, undefined, () => res(null));
      } else res(null);
    });
  });
  // Prefer same-origin textures under assets/ (CSP-safe); remote only as last resort
  const LOCAL = (function(){
    try {
      const base = location.pathname.replace(/\/[^/]*$/, '/');
      return base + 'assets/images/globe/';
    } catch (e) { return 'assets/images/globe/'; }
  })();
  const REMOTE = 'https://unpkg.com/three-globe@2.31.0/example/img/';
  const loadTimed = (u, ms) => Promise.race([
    load(u),
    new Promise(res => setTimeout(() => res(null), ms))
  ]);
  const loadTex = async (name) => {
    let t = await loadTimed(LOCAL + name, 4000);
    if (!t) t = await loadTimed(REMOTE + name, 6000);
    return t;
  };
  const [dayT, nightT, topoT] = await Promise.all([
    loadTex('earth-blue-marble.jpg'),
    loadTex('earth-night.jpg'),
    loadTex('earth-topology.png')
  ]);
  ld(64, 'Building scene');

  function fallbackTex() {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
    const g = c.getContext('2d');
    const dark = document.documentElement.dataset.theme === 'dark';
    const og = g.createLinearGradient(0, 0, 0, 1024);
    if (dark) { og.addColorStop(0, '#0B1830'); og.addColorStop(.5, '#060B16'); og.addColorStop(1, '#0B1830'); }
    else { og.addColorStop(0, '#DCE6F2'); og.addColorStop(.5, '#C8D6E8'); og.addColorStop(1, '#DCE6F2'); }
    g.fillStyle = og; g.fillRect(0, 0, 2048, 1024);
    const land = dark ? '#16263F' : '#AEBFD4', hi = dark ? '#1E3355' : '#9BB0C8';
    function poly(pts) {
      g.fillStyle = land; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) {
        const [px, py] = pts[i - 1], [x, y] = pts[i];
        g.quadraticCurveTo((px + x) / 2 + (Math.random() - .5) * 10, (py + y) / 2 + (Math.random() - .5) * 10, x, y);
      }
      g.closePath(); g.fill();
    }
    poly([[270,170],[330,150],[400,145],[460,160],[500,190],[515,240],[500,300],[465,345],[420,380],[375,395],[335,380],[295,345],[265,300],[255,250],[258,205]]);
    poly([[375,395],[400,420],[412,455],[395,475],[372,462],[365,425]]);
    poly([[440,470],[485,480],[525,525],[545,590],[543,670],[520,750],[490,810],[458,835],[428,812],[416,748],[410,668],[415,590],[422,520]]);
    poly([[975,195],[1015,182],[1058,192],[1098,215],[1108,258],[1088,300],[1048,322],[1008,312],[978,282],[965,238]]);

/* ===== Client RTT: measure latency from USER browser to this relay ===== */
async function measureSelfRtt() {
  const paths = [
    location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + 'api/v3/ops/selftest',
    location.origin + '/nyx/api/v3/ops/selftest',
    location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + '?json=1'
  ];
  let best = null;
  for (const u of paths) {
    try {
      const t0 = performance.now();
      const r = await fetch(u, { cache: 'no-store', headers: { Accept: 'application/json' } });
      const t1 = performance.now();
      if (r.ok) {
        const ms = Math.max(1, Math.round(t1 - t0));
        if (best == null || ms < best) best = ms;
      }
    } catch (_) {}
  }
  return best;
}
async function applyClientLatency(data) {
  if (!data || !Array.isArray(data.relays)) return data;
  const selfHost = (location.hostname || '').toLowerCase();
  const rtt = await measureSelfRtt();
  if (rtt == null) return data;
  data.relays = data.relays.map(r => {
    if (r.is_self || String(r.name || '').toLowerCase() === selfHost) {
      return { ...r, latency_ms: rtt, latency_p50: rtt, latency_p95: Math.round(rtt * 1.2), status_reason: 'Measured from your browser' };
    }
    return r;
  });
  return data;
}
