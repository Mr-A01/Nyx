<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="NYX is a lightweight, terminal-oriented communication system: a small language-independent protocol, a Rust terminal client and pluggable server implementations.">
<title>NYX — Whitepaper</title>
<style>
:root{
  --fs:16px;
  --lh:1.72;
  --rw:76ch;
  --bar-h:60px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body-font:var(--sans);
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
}
html[data-lang="fa"]{
  --sans:"Vazirmatn","Vazir","IRANSans","Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif;
  --body-font:var(--sans);
}
html[data-theme="dark"]{
  --bg:#090c10;
  --bg-alt:#0d1117;
  --panel:#10161d;
  --panel-2:#0b1016;
  --code-bg:#0a0e13;
  --line:#1e2833;
  --line-soft:#161e27;
  --text:#dce4ed;
  --text-soft:#aab6c4;
  --muted:#7b8798;
  --accent:#45d8c0;
  --accent-ink:#06231f;
  --accent-dim:rgba(69,216,192,.10);
  --info:#79a6f2;
  --info-dim:rgba(121,166,242,.10);
  --warn:#e2b252;
  --warn-dim:rgba(226,178,82,.10);
  --fut:#9aa5b1;
  --fut-dim:rgba(154,165,177,.10);
  --grid:rgba(255,255,255,.022);
  --glow:rgba(69,216,192,.10);
  --bar-bg:rgba(9,12,16,.86);
  --shadow:0 12px 34px rgba(0,0,0,.42);
}
html[data-theme="light"]{
  --bg:#f5f7f9;
  --bg-alt:#ffffff;
  --panel:#ffffff;
  --panel-2:#f1f4f7;
  --code-bg:#f7f9fb;
  --line:#dce2e9;
  --line-soft:#e8edf2;
  --text:#141a21;
  --text-soft:#39434f;
  --muted:#6a7684;
  --accent:#0c7d6c;
  --accent-ink:#ffffff;
  --accent-dim:rgba(12,125,108,.08);
  --info:#2c5fc4;
  --info-dim:rgba(44,95,196,.08);
  --warn:#96690d;
  --warn-dim:rgba(150,105,13,.09);
  --fut:#6b7580;
  --fut-dim:rgba(107,117,128,.09);
  --grid:rgba(16,24,32,.035);
  --glow:rgba(12,125,108,.07);
  --bar-bg:rgba(245,247,249,.88);
  --shadow:0 10px 28px rgba(20,30,45,.08);
}
html[data-theme="reading"]{
  --bg:#faf7f0;
  --bg-alt:#fffdf8;
  --panel:#fffdf8;
  --panel-2:#f5f0e6;
  --code-bg:#f7f3ea;
  --line:#e3dbc9;
  --line-soft:#ece5d7;
  --text:#241f19;
  --text-soft:#453d33;
  --muted:#7a7062;
  --accent:#8a5a24;
  --accent-ink:#fffdf8;
  --accent-dim:rgba(138,90,36,.08);
  --info:#3f5f7a;
  --info-dim:rgba(63,95,122,.08);
  --warn:#8a6a1f;
  --warn-dim:rgba(138,106,31,.10);
  --fut:#7c7466;
  --fut-dim:rgba(124,116,102,.10);
  --grid:transparent;
  --glow:transparent;
  --bar-bg:rgba(250,247,240,.92);
  --shadow:none;
  --body-font:Georgia,"Iowan Old Style","Times New Roman",serif;
}
html[data-theme="reading"][data-lang="fa"]{
  --body-font:"Noto Naskh Arabic","Vazirmatn",Tahoma,serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--body-font);
  font-size:var(--fs);
  line-height:var(--lh);
  overflow-x:hidden;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:38px 38px;
}
.bg-glow{
  position:fixed;z-index:0;pointer-events:none;inset-block-start:-220px;inset-inline-start:50%;
  width:900px;height:520px;transform:translateX(-50%);
  background:radial-gradient(closest-side,var(--glow),transparent 72%);
}
.progress{
  position:fixed;inset-block-start:0;inset-inline-start:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--accent),var(--info));z-index:90;
}
.skip{
  position:absolute;inset-inline-start:12px;inset-block-start:-60px;z-index:120;
  background:var(--accent);color:var(--accent-ink);padding:.5rem .8rem;border-radius:var(--r-sm);
  font:600 .8rem/1 var(--mono);text-decoration:none;transition:top .15s ease;
}
.skip:focus{inset-block-start:12px}
.topbar{
  position:sticky;inset-block-start:0;z-index:60;height:var(--bar-h);
  display:flex;align-items:center;gap:.6rem;
  padding-inline:clamp(.7rem,2.5vw,1.5rem);
  background:var(--bar-bg);border-block-end:1px solid var(--line);
  backdrop-filter:saturate(140%) blur(10px);
}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--text);min-width:0}
.mark{width:26px;height:26px;color:var(--accent);flex:none;filter:drop-shadow(0 0 8px var(--glow))}
.brand-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-name{font:700 1.02rem/1 var(--mono);letter-spacing:.16em}
.brand-sub{font:400 .62rem/1.4 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-spacer{flex:1 1 auto}
.bar-group{display:flex;align-items:center;gap:.35rem}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langsw button{
  border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 .74rem/1 var(--mono);padding:.45rem .62rem;letter-spacing:.04em;
}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{
  display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;
  background:var(--panel-2);color:var(--text-soft);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.42rem .6rem;font:600 .74rem/1 var(--mono);
}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn svg{width:15px;height:15px}
.only-mobile{display:none}
.settings-wrap{position:relative}
.pop{
  position:absolute;inset-block-start:calc(100% + 10px);inset-inline-end:0;z-index:80;
  width:min(320px,calc(100vw - 24px));
  background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow);padding:.9rem;display:none;
}
.pop.open{display:block}
.pop h2{font:600 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
.pop-field{margin-block-end:.85rem}
.pop-field label{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font:500 .78rem/1.3 var(--mono);color:var(--text-soft);margin-block-end:.35rem}
.pop-field output{color:var(--accent);font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--accent);background:transparent;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.22rem}
.seg button{
  border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;
  padding:.4rem .2rem;font:600 .72rem/1 var(--mono);
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pop-reset{width:100%}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s ease}
.backdrop.show{opacity:1;pointer-events:auto}
.layout{
  position:relative;z-index:1;
  display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);
  gap:clamp(1.4rem,3.4vw,3.4rem);
  width:min(1420px,100%);margin-inline:auto;
  padding:clamp(1rem,2.6vw,2.2rem) clamp(.9rem,3vw,2.2rem) 3rem;
}
.sidebar{position:sticky;inset-block-start:calc(var(--bar-h) + 1rem);align-self:start;max-height:calc(100vh - var(--bar-h) - 2rem);overflow:auto;padding-block-end:1rem}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.toc-title{font:600 .68rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem;padding-inline:.5rem}
.toc{list-style:none;margin:0;padding:0}
.toc li{margin:0}
.toc a{
  display:grid;grid-template-columns:2.4ch minmax(0,1fr);gap:.55rem;align-items:baseline;
  padding:.36rem .5rem;border-radius:var(--r-sm);text-decoration:none;color:var(--text-soft);
  border-inline-start:2px solid transparent;font-size:.855rem;line-height:1.4;
}
.toc a:hover{background:var(--panel);color:var(--text)}
.toc a[aria-current="true"]{color:var(--accent);border-inline-start-color:var(--accent);background:var(--accent-dim)}
.toc-num{font:600 .7rem/1.5 var(--mono);color:var(--muted);letter-spacing:.04em}
.toc a[aria-current="true"] .toc-num{color:var(--accent)}
.side-note{margin:1.2rem .5rem 0;padding:.7rem .8rem;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-size:.76rem;line-height:1.55}
.doc{min-width:0;max-width:var(--rw)}
.sec{padding-block:clamp(1.6rem,3vw,2.6rem);border-block-start:1px solid var(--line-soft)}
.sec:first-child{border-block-start:0;padding-block-start:.4rem}
.sec-kicker{
  margin:0 0 .5rem;font:600 .68rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  display:flex;align-items:center;gap:.6rem;
}
.sec-kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec h2{
  font-family:var(--sans);font-size:calc(var(--fs) * 1.62);line-height:1.22;font-weight:700;
  margin:0 0 1rem;letter-spacing:-.012em;
}
.sec h3{font-family:var(--sans);font-size:calc(var(--fs) * 1.1);margin:1.9rem 0 .6rem;letter-spacing:-.005em}
.sec h4{font-family:var(--sans);font-size:calc(var(--fs) * .95);margin:1.4rem 0 .4rem;color:var(--text-soft)}
.sec p{margin:0 0 .95rem;color:var(--text-soft)}
.sec p strong,.sec li strong{color:var(--text);font-weight:650}
.sec ul,.sec ol{margin:0 0 1rem;padding-inline-start:1.25rem;color:var(--text-soft)}
.sec li{margin-block-end:.42rem}
.lede{font-size:calc(var(--fs) * 1.08);color:var(--text) !important;line-height:1.62}
.tick{list-style:none;padding-inline-start:0}
.tick li{position:relative;padding-inline-start:1.5rem}
.tick li::before{
  content:"";position:absolute;inset-inline-start:.15rem;inset-block-start:.62em;
  width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.85;
}
.mono-list{list-style:none;padding-inline-start:0;font-family:var(--mono);font-size:.86rem}
.mono-list li{padding:.28rem 0;border-block-end:1px dashed var(--line-soft);color:var(--text-soft)}
.mono-list li:last-child{border-block-end:0}
.badge{
  display:inline-block;font:700 .63rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:.36em .55em;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:middle;
}
.b-def{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.b-plan{color:var(--info);border-color:var(--info);background:var(--info-dim)}
.b-exp{color:var(--warn);border-color:var(--warn);background:var(--warn-dim)}
.b-fut{color:var(--fut);border-color:var(--fut);background:var(--fut-dim)}
.cards{display:grid;gap:.8rem;margin:1.1rem 0 1.3rem}
.cards-2{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.cards-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cards-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  padding:.95rem 1.05rem;
}
.card h3,.card h4{margin:.05rem 0 .45rem;font-size:calc(var(--fs) * .98)}
.card p{margin:0;font-size:.885rem}
.card-tag{display:block;font:600 .64rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-block-end:.5rem}
.card-accent{border-inline-start:3px solid var(--accent)}
.card-info{border-inline-start:3px solid var(--info)}
.card-warn{border-inline-start:3px solid var(--warn)}
.card-fut{border-inline-start:3px solid var(--fut)}
.note{
  margin:1.2rem 0;padding:.85rem 1rem;background:var(--accent-dim);
  border-inline-start:3px solid var(--accent);
  border-start-end-radius:var(--r-md);border-end-end-radius:var(--r-md);
  color:var(--text-soft);font-size:.92rem;
}
.note p{margin:0}
.note p + p{margin-block-start:.5rem}
.note-warn{background:var(--warn-dim);border-inline-start-color:var(--warn)}
.note-plain{background:var(--panel);border-inline-start-color:var(--line);border:1px solid var(--line);border-inline-start:3px solid var(--muted)}
.legend{list-style:none;padding:0;margin:1rem 0 1.2rem;display:grid;gap:.55rem}
.legend li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem;align-items:baseline;font-size:.9rem;color:var(--text-soft);margin:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);margin:1.1rem 0 1.4rem;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:.885rem}
caption{caption-side:top;text-align:start;padding:.7rem .9rem;color:var(--muted);font:500 .74rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-block-end:1px solid var(--line)}
th{
  text-align:start;font:600 .68rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:.65rem .85rem;background:var(--panel-2);border-block-end:1px solid var(--line);white-space:nowrap;
}
td{padding:.62rem .85rem;border-block-end:1px solid var(--line-soft);color:var(--text-soft);vertical-align:top}
tbody tr:last-child td{border-block-end:0}
td code,li code,p code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line-soft);border-radius:4px;padding:.08em .34em;color:var(--text)}
.codewrap{border:1px solid var(--line);border-radius:var(--r-md);background:var(--code-bg);overflow:hidden;margin:1.1rem 0 1.4rem}
.codebar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.42rem .55rem .42rem .8rem;background:var(--panel-2);border-block-end:1px solid var(--line)}
.codelabel{font:600 .64rem/1.4 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.copybtn{
  cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text-soft);
  border-radius:var(--r-sm);padding:.3rem .55rem;font:600 .66rem/1 var(--mono);letter-spacing:.06em;
}
.copybtn:hover{color:var(--accent);border-color:var(--accent)}
pre{
  margin:0;padding:.9rem 1rem;overflow-x:auto;direction:ltr;text-align:left;
  font-family:var(--mono);font-size:.82rem;line-height:1.62;color:var(--text-soft);
  tab-size:2;
}
pre.ascii{font-size:.735rem;line-height:1.42}
.diagram{margin:1.3rem 0 1.6rem;padding:clamp(.9rem,2.4vw,1.5rem);border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.diagram-title{margin:0 0 1rem;font:600 .66rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.node{
  width:min(460px,100%);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--bg-alt);padding:.7rem .9rem;text-align:center;
}
.node-k{display:block;font:600 .6rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-block-end:.35rem}
.node-t{display:block;font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--text)}
.node-s{display:block;font-size:.76rem;color:var(--muted);margin-block-start:.28rem;line-height:1.45}
.node-accent{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim),0 0 24px -12px var(--accent)}
.node-accent .node-t{color:var(--accent)}
.node-info{border-color:var(--info)}
.node-info .node-t{color:var(--info)}
.connector{width:2px;height:26px;background:var(--line);position:relative;margin-block:2px}
.connector::after{
  content:"";position:absolute;inset-block-end:-1px;inset-inline-start:50%;transform:translateX(-50%);
  border-inline:5px solid transparent;border-block-start:7px solid var(--accent);
}
.fanout{width:100%;margin-block-start:.2rem}
.rail{height:2px;background:var(--line);width:82%;margin-inline:auto;position:relative}
.rail::before,.rail::after{content:"";position:absolute;inset-block-start:0;width:2px;height:12px;background:var(--line)}
.rail::before{inset-inline-start:0}
.rail::after{inset-inline-end:0}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:.55rem;width:100%;margin-block-start:.1rem}
.branch{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-alt);padding:.55rem .4rem;text-align:center;padding-block-start:.9rem}
.branch::before{content:"";position:absolute;inset-block-start:-12px;inset-inline-start:50%;width:2px;height:12px;background:var(--line)}
.branch-name{display:block;font:600 .78rem/1.2 var(--mono);color:var(--text)}
.branch-sub{display:block;font-size:.66rem;color:var(--muted);margin-block-start:.2rem;font-family:var(--mono)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.9rem;margin:1.2rem 0 1.4rem}
.split-panel{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:.95rem 1.05rem}
.split-panel h4{margin:0 0 .6rem;font:600 .68rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.split-core h4{color:var(--accent)}
.split-edge h4{color:var(--info)}
.split-panel ul{margin:0;padding-inline-start:1.1rem;font-size:.88rem}
.tree{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.85rem}
.tree li{position:relative;padding-inline-start:1.5rem;padding-block:.34rem;color:var(--text-soft)}
.tree li::before{content:"";position:absolute;inset-inline-start:.35rem;inset-block-start:0;bottom:0;border-inline-start:1px solid var(--line)}
.tree li::after{content:"";position:absolute;inset-inline-start:.35rem;inset-block-start:1.05em;width:.85rem;border-block-start:1px solid var(--line)}
.tree li:last-child::before{bottom:calc(100% - 1.05em)}
.tree .tag-name{color:var(--accent)}
.tree .tag-desc{font-family:var(--body-font);font-size:.86em;color:var(--muted)}
.timeline{list-style:none;margin:1.3rem 0;padding:0 0 0 0;position:relative}
.timeline li{position:relative;padding-inline-start:2.6rem;padding-block-end:1.5rem}
.timeline li::before{content:"";position:absolute;inset-inline-start:.85rem;inset-block-start:.4rem;bottom:0;border-inline-start:2px solid var(--line)}
.timeline li:last-child::before{bottom:auto;height:1rem}
.phase-mark{
  position:absolute;inset-inline-start:0;inset-block-start:0;
  width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:2px solid var(--line);color:var(--muted);
  font:700 .74rem/1 var(--mono);
}
.timeline li.now .phase-mark{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}
.timeline li.done .phase-mark{border-color:var(--info);color:var(--info)}
.phase-body{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:.85rem 1rem}
.phase-body h3{margin:0 0 .45rem;font-size:calc(var(--fs) * 1);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.phase-body ul{margin:0;padding-inline-start:1.1rem;font-size:.86rem}
.phase-body li{padding-inline-start:0;padding-block-end:.2rem}
.phase-body li::before{display:none}
details.tech{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);margin:1.1rem 0 1.4rem;overflow:hidden}
details.tech summary{
  cursor:pointer;list-style:none;padding:.75rem .95rem;
  font:600 .78rem/1.4 var(--mono);color:var(--text);
  display:flex;align-items:center;gap:.6rem;
}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary::before{content:"+";color:var(--accent);font-weight:700;width:1ch}
details.tech[open] summary::before{content:"–"}
details.tech summary:hover{background:var(--panel-2)}
.tech-body{padding:0 .95rem .95rem;border-block-start:1px solid var(--line-soft)}
.tech-body p{font-size:.9rem}
.cover{padding-block:clamp(1.6rem,5vw,3.4rem) clamp(1.4rem,3vw,2.4rem)}
.cover-eyebrow{display:flex;flex-wrap:wrap;gap:.45rem;margin-block-end:1.2rem}
.cover h1{
  font-family:var(--mono);font-weight:700;letter-spacing:.16em;
  font-size:clamp(2.6rem,10vw,4.6rem);line-height:1;margin:0 0 .7rem;
  color:var(--text);text-shadow:0 0 42px var(--glow);
}
.cover-sub{font-size:calc(var(--fs) * 1.14);color:var(--text-soft);margin:0 0 1.4rem;max-width:60ch;line-height:1.55}
.cover-rule{height:1px;background:linear-gradient(90deg,var(--accent),transparent);margin:0 0 1.4rem;border:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin:1.4rem 0 0}
.fact{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:.7rem .8rem}
.fact dt{font:600 .62rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-block-end:.4rem}
.fact dd{margin:0;font-size:.86rem;color:var(--text)}
.caret{display:inline-block;width:.55ch;height:1em;background:var(--accent);vertical-align:-.15em;animation:blink 1.15s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.doc-footer{margin-block-start:2.4rem;padding-block-start:1.4rem;border-block-start:1px solid var(--line);color:var(--muted);font-size:.84rem}
.doc-footer p{color:var(--muted);font-size:.84rem}
.top-link{display:inline-flex;align-items:center;gap:.4rem;font:600 .74rem/1 var(--mono);color:var(--accent);text-decoration:none;margin-block-start:.6rem}
.print-head{display:none}
.q-group{margin-block-end:1.1rem}
.q-group h4{margin:0 0 .4rem;font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
@media (max-width:1000px){
  .only-mobile{display:inline-flex}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .sidebar{
    position:fixed;inset-block-start:0;inset-block-end:0;inset-inline-start:0;z-index:70;
    width:min(85vw,320px);max-height:none;background:var(--bg-alt);
    border-inline-end:1px solid var(--line);padding:1rem .8rem;
    transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow);
  }
  html[dir="rtl"] .sidebar{transform:translateX(104%)}
  .sidebar.open{transform:translateX(0)}
  .doc{max-width:none}
  .brand-sub{display:none}
}
@media (max-width:620px){

}

<div class="note note-plain"><p>ایدهٔ راهنما: <strong>هستهٔ کوچک، پروتکل باز، اولویت با پایانه، مستقل از زبان، گسترش در لبه‌ها.</strong></p></div>`}

    {
      id:"abstract",slug:"abstract",num:1,
      en:{title:"Abstract",body:
`<p class="lede">NYX is a proposal for a small communication system built around a terminal client and a language-independent protocol. It takes the interaction model of IRC — channels, nicknames, commands, one connection — and the communication goals associated with modern private messengers, and deliberately leaves everything else out.</p>
<p>This document is a whitepaper, not a specification. It records direction, boundaries and current status. NYX is an early-stage project: the protocol is not frozen, no reference server has been released, and the Rust client is in design. Where a mechanism does not exist yet it is labelled <span class="badge b-plan">Planned</span>, <span class="badge b-exp">Experimental</span> or <span class="badge b-fut">Future</span> instead of being described as available.</p>
<p>Four status labels are used consistently in this document:</p>
<ul class="legend">
<li><span class="badge b-def">Defined</span><span>The direction is settled and written down. It can still change, but it is what NYX means today.</span></li>
<li><span class="badge b-plan">Planned</span><span>Intended and scoped, not yet implemented.</span></li>
<li><span class="badge b-exp">Experimental</span><span>Being tried. May change shape or be removed entirely.</span></li>
<li><span class="badge b-fut">Future</span><span>Out of scope now. Recorded so the design does not accidentally block it later.</span></li>
</ul>
<p>Every decision in NYX is measured against one narrow question: does it keep the core small, the protocol implementable by one person in one language, and the terminal experience good? If the answer is no, the feature does not belong in the core.</p>
<p>NYX descends from earlier experiments that carried too many ambitious subsystems at once. Those ideas were dropped. This restart keeps the useful part — the terminal interaction model — and reduces everything around it.</p>`},

`<p class="lede">NYX پیشنهادی است برای یک سامانهٔ ارتباطی کوچک که گردِ یک کارخواه پایانه‌ای و یک پروتکلِ مستقل از زبان ساخته می‌شود. NYX مدل تعاملی IRC را برمی‌دارد — کانال، نام کاربری، فرمان، یک اتصال — و اهداف ارتباطی پیام‌رسان‌های خصوصی امروزی را نیز در نظر می‌گیرد، و آگاهانه هر چیز دیگری را بیرون می‌گذارد.</p>
<p>این سند یک سپیدنامه است، نه یک مشخصات فنی. جهت‌گیری، مرزها و وضعیت کنونی را ثبت می‌کند. NYX پروژه‌ای در مرحلهٔ ابتدایی است: پروتکل هنوز قطعی نشده، سرور مرجعی منتشر نشده و کارخواه Rust در مرحلهٔ طراحی است. هر سازوکاری که هنوز وجود ندارد، به‌جای آنکه موجود وانمود شود، با برچسب <span class="badge b-plan">برنامه‌ریزی‌شده</span>، <span class="badge b-exp">آزمایشی</span> یا <span class="badge b-fut">آینده</span> مشخص می‌شود.</p>
<p>در این سند چهار برچسب وضعیت به‌طور پیوسته به کار می‌رود:</p>
<ul class="legend">
<li><span class="badge b-def">تعریف‌شده</span><span>جهت‌گیری settled و مکتوب است؛ هنوز ممکن است تغییر کند، اما امروز معنای NYX همین است.</span></li>
<li><span class="badge b-plan">برنامه‌ریزی‌شده</span><span>قصد و دامنهٔ آن مشخص است، اما هنوز پیاده‌سازی نشده.</span></li>
<li><span class="badge b-exp">آزمایشی</span><span>در حال آزمودن؛ ممکن است تغییر شکل دهد یا کاملاً حذف شود.</span></li>
<li><span class="badge b-fut">آینده</span><span>اکنون خارج از دامنه است؛ ثبت شده تا طراحی بعدها ناخواسته راه آن را نبندد.</span></li>
</ul>
<p>هر تصمیم در NYX با یک پرسش باریک سنجیده می‌شود: آیا هسته را کوچک نگه می‌دارد، آیا پروتکل را طوری نگه می‌دارد که یک نفر با یک زبان بتواند پیاده‌اش کند، و آیا تجربهٔ پایانه را خوب نگه می‌دارد؟ اگر پاسخ منفی باشد، آن ویژگی جایگاهی در هسته ندارد.</p>
<p>NYX از آزمایش‌های پیشینی می‌آید که هم‌زمان زیرسامانه‌های بلندپروازانهٔ زیادی را حمل می‌کردند. آن ایده‌ها کنار گذاشته شدند. این شروع دوباره بخش مفید را نگه می‌دارد — مدل تعاملی پایانه — و هرچه اطراف آن است را کاهش می‌دهد.</p>`}

      en:{title:"What is NYX?",body:
`<p class="lede">NYX is three things at once: a protocol, a terminal client, and a family of possible server implementations.</p>
<div class="cards cards-3">
<article class="card card-accent"><span class="card-tag">Protocol</span><h3>A small contract</h3><p>An explicit, versioned, language-independent message protocol. It defines what a client may send, what a server must answer, and how both negotiate capabilities. Nothing more.</p></article>
<article class="card card-info"><span class="card-tag">Client</span><h3>A terminal UI</h3><p>The official client is a Rust program that renders a fast, keyboard-driven interface in a terminal. It is the reference for how the protocol is used, not the only possible client.</p></article>
<article class="card card-fut"><span class="card-tag">Servers</span><h3>Any implementation</h3><p>A server is anything that speaks the protocol: Python, PHP, JavaScript or TypeScript, Rust, Go, or a language nobody has tried yet. The protocol matters more than any single server.</p></article>
</div>
<h3>The conceptual core</h3>
<p>The whole model fits in a short list. If a concept is not here, it is an extension, not a requirement:</p>
<ul class="tick">
<li><strong>Identity</strong> — a persistent handle that a client authenticates as.</li>
<li><strong>Session</strong> — one live connection between a client and a server.</li>
<li><strong>Channel</strong> — a named multi-participant conversation.</li>
<li><strong>Conversation</strong> — a direct exchange between two identities.</li>
<li><strong>Message</strong> — the unit of content moving between them.</li>
<li><strong>Capability</strong> — an optional feature a client or server declares support for.</li>
<li><strong>Tag</strong> — a descriptive label attached to a participant or a message.</li>
</ul>
<div class="note"><p>NYX is not a hosted service. It is a specification plus implementations. Running NYX means running a server, exactly as running an IRC network means running an IRC server.</p></div>`},
      fa:{title:"NYX چیست؟",body:
`<p class="lede">NYX هم‌زمان سه چیز است: یک پروتکل، یک کارخواه پایانه‌ای، و خانواده‌ای از پیاده‌سازی‌های ممکنِ سرور.</p>
<div class="cards cards-3">
<article class="card card-accent"><span class="card-tag">پروتکل</span><h3>یک قرارداد کوچک</h3><p>پروتکل پیام‌رسانیِ صریح، نسخه‌پذیر و مستقل از زبان. تعیین می‌کند کارخواه چه چیزی می‌تواند بفرستد، سرور چه پاسخی باید بدهد، و هر دو چگونه قابلیت‌ها را مذاکره کنند. نه بیشتر از این.</p></article>
<article class="card card-info"><span class="card-tag">کارخواه</span><h3>یک رابط پایانه‌ای</h3><p>کارخواه رسمی برنامه‌ای با Rust است که رابطی سریع و صفحه‌کلیدمحور را در پایانه ترسیم می‌کند. این کارخواه مرجعِ چگونگی استفاده از پروتکل است، نه تنها کارخواهٔ ممکن.</p></article>
<article class="card card-fut"><span class="card-tag">سرورها</span><h3>هر پیاده‌سازی</h3><p>سرور هر چیزی است که پروتکل را حرف بزند: Python، PHP، جاوااسکریپت یا TypeScript، Rust، Go، یا زبانی که هنوز کسی نیازموده است. پروتکل از هر سرورِ واحدی مهم‌تر است.</p></article>
</div>
<h3>هستهٔ مفهومی</h3>
<p>کل مدل در یک فهرست کوتاه جا می‌شود. اگر مفهومی اینجا نیست، افزونه است، نه الزام:</p>
<ul class="tick">
<li><strong>هویت</strong> — نام ماندگاری که کارخواه با آن احراز هویت می‌کند.</li>
<li><strong>نشست</strong> — یک اتصال زنده میان کارخواه و سرور.</li>
<li><strong>کانال</strong> — گفتگوی نام‌گذاری‌شده با چند شرکت‌کننده.</li>
<li><strong>گفتگو</strong> — تبادل مستقیم میان دو هویت.</li>
<li><strong>پیام</strong> — واحد محتوایی که میان آن‌ها جابه‌جا می‌شود.</li>
<li><strong>قابلیت</strong> — ویژگی اختیاری که کارخواه یا سرور پشتیبانی از آن را اعلام می‌کند.</li>
<li><strong>برچسب</strong> — نشان توصیفی که به یک شرکت‌کننده یا پیام الصاق می‌شود.</li>
</ul>
<div class="note"><p>NYX یک سرویس میزبانی‌شده نیست؛ مشخصات است به‌علاوهٔ پیاده‌سازی‌ها. اجرای NYX یعنی اجرای یک سرور، دقیقاً مانند اینکه اجرای یک شبکهٔ IRC یعنی اجرای یک سرور IRC.</p></div>`}
    },
    {
      id:"why",slug:"why",num:3,
      en:{title:"Why NYX?",body:
`<p class="lede">NYX exists because of a gap, not because the world needs another messenger.</p>
<h3>What is actually missing</h3>
<ul class="tick">
<li><strong>Terminal clients are an afterthought.</strong> Most modern protocols ship a graphical client first and a terminal client — if any — much later. NYX inverts that order: the terminal experience is the product.</li>
<li><strong>IRC is still good and still dated.</strong> The interaction model survives because it is simple. The surrounding protocol carries decades of accreted extensions, encoding problems and inconsistent authentication.</li>
<li><strong>Modern protocols are expensive to reimplement.</strong> A protocol that needs a team to implement ends up with one implementation. NYX targets a minimal conformance level that a single developer can reach.</li>
<li><strong>Modest hardware and bad links.</strong> NYX should be comfortable over SSH, on a small VPS, on an old laptop, and on a connection with high latency or low bandwidth.</li>
<li><strong>Hackability.</strong> A protocol small enough to read in one sitting is a protocol people will write bots, bridges and tools for without asking permission.</li>
</ul>
<h3>What NYX does not promise</h3>
<p>NYX will not out-feature Matrix, Signal, Telegram or IRC. There is no hosted network, no mobile application, no user base and no adoption to point at. The project is early and small on purpose.</p>
<p>The value proposition is narrow and honest: a readable protocol, a fast terminal client, and the ability to run a compatible server in whatever language a project already uses.</p>`},
      fa:{title:"چرا NYX؟",body:
`<p class="lede">NYX به خاطر یک شکاف به وجود آمده، نه چون جهان به پیام‌رسان دیگری نیاز دارد.</p>
<h3>چه چیزی واقعاً کم است</h3>
<ul class="tick">
<li><strong>کارخواه پایانه‌ای یک فکرِ بعدی است.</strong> بیشتر پروتکل‌های امروزی اول کارخواه گرافیکی می‌دهند و کارخواه پایانه‌ای را — اگر اصلاً بدهند — خیلی دیرتر. NYX این ترتیب را وارونه می‌کند: تجربهٔ پایانه خودِ محصول است.</li>
<li><strong>IRC هنوز خوب و هنوز کهنه است.</strong> مدل تعاملی آن به دلیل سادگی‌اش زنده مانده، اما پروتکل پیرامونش دهه‌ها افزونهٔ تلنبارشده، مشکل کدگذاری و احراز هویت ناهمگون را حمل می‌کند.</li>
<li><strong>پیاده‌سازی دوبارهٔ پروتکل‌های مدرن پرهزینه است.</strong> پروتکلی که به یک تیم نیاز داشته باشد، در عمل یک پیاده‌سازی بیشتر نخواهد داشت. NYX حداقلِ سطح انطباق را هدف می‌گیرد که یک توسعه‌دهندهٔ تنها بتواند به آن برسد.</li>
<li><strong>سخت‌افزار محدود و اتصال ضعیف.</strong> NYX باید روی SSH، روی یک VPS کوچک، روی لپ‌تاپ قدیمی و روی اتصال با تأخیر یا پهنای باند کم راحت باشد.</li>
<li><strong>قابلیت دست‌کاری.</strong> پروتکلی که آن‌قدر کوچک باشد که در یک نشست خوانده شود، پروتکلی است که مردم بدون اجازه گرفتن برایش ربات، پل و ابزار می‌نویسند.</li>
</ul>
<h3>NYX چه قولی نمی‌دهد</h3>
<p>NYX از Matrix، Signal، Telegram یا IRC پرامکانات‌تر نخواهد شد. شبکهٔ میزبانی‌شده، اپلیکیشن موبایل، پایگاه کاربر یا آمار پذیرشی برای اشاره کردن وجود ندارد. پروژه عمداً زودهنگام و کوچک است.</p>
<p>ارزش پیشنهادی، باریک و صادقانه است: پروتکلی خوانا، کارخواه پایانه‌ای سریع، و امکان اجرای یک سرورِ سازگار با زبانی که پروژه همین حالا هم استفاده می‌کند.</p>`}
    },
    {
      id:"philosophy",slug:"philosophy",num:4,
      en:{title:"Project Philosophy",body:
`<p class="lede">Ten principles. They are ordered by how often they settle an argument.</p>
<div class="cards cards-2">
<article class="card"><span class="card-tag">01</span><h3>Simplicity over feature count</h3><p>A feature that must be explained twice is a feature that should live in an extension.</p></article>
<article class="card"><span class="card-tag">02</span><h3>Protocol over implementation</h3><p>The specification is the project. Implementations are replaceable; the contract is not.</p></article>
<article class="card"><span class="card-tag">03</span><h3>Interoperability by design</h3><p>If a second implementation is hard, the protocol is wrong, not the implementer.</p></article>
<article class="card"><span class="card-tag">04</span><h3>Terminal first</h3><p>The terminal is not a fallback interface. It is the primary design target and the quality bar.</p></article>
<article class="card"><span class="card-tag">05</span><h3>Low resource usage</h3><p>Idle cost, memory footprint and bandwidth matter as much as correctness on slow hardware.</p></article>
<article class="card"><span class="card-tag">06</span><h3>Privacy without exaggeration</h3><p>State what a mechanism does and does not protect against. No claim without a defined mechanism.</p></article>
<article class="card"><span class="card-tag">07</span><h3>Explicit over magical</h3><p>Readable frames, visible state, predictable errors. Nothing implicit that a debugger cannot show.</p></article>
<article class="card"><span class="card-tag">08</span><h3>Small core, extensible edges</h3><p>The core stays tiny. Bots, bridges, services and tooling attach from outside through tags and capabilities.</p></article>
<article class="card"><span class="card-tag">09</span><h3>Documentation is part of the protocol</h3><p>An undocumented behaviour is undefined behaviour. Examples and test vectors count as specification.</p></article>
<article class="card"><span class="card-tag">10</span><h3>Practical implementation over speculation</h3><p>Nothing is added to the core because it might be useful someday. It is added when it is needed now.</p></article>
</div>`},
      fa:{title:"فلسفهٔ پروژه",body:
`<p class="lede">ده اصل. به ترتیبِ میزان تأثیرگذاری در فیصلهٔ بحث‌ها مرتب شده‌اند.</p>
<div class="cards cards-2">
<article class="card"><span class="card-tag">۰۱</span><h3>سادگی پیش از تعداد ویژگی</h3><p>ویژگی‌ای که باید دو بار توضیح داده شود، باید در یک افزونه زندگی کند.</p></article>
<article class="card"><span class="card-tag">۰۲</span><h3>پروتکل پیش از پیاده‌سازی</h3><p>مشخصات، خودِ پروژه است. پیاده‌سازی‌ها قابل جایگزینی‌اند؛ قرارداد نه.</p></article>
<article class="card"><span class="card-tag">۰۳</span><h3>تعامل‌پذیری از همان طراحی</h3><p>اگر پیاده‌سازی دوم سخت باشد، پروتکل اشتباه است، نه پیاده‌ساز.</p></article>
<article class="card"><span class="card-tag">۰۴</span><h3>اولویت با پایانه</h3><p>پایانه رابطِ یدکی نیست؛ هدف اصلی طراحی و معیار سنجش کیفیت است.</p></article>
<article class="card"><span class="card-tag">۰۵</span><h3>مصرف کم منابع</h3><p>هزینهٔ حالت بیکار، مصرف حافظه و پهنای باند به اندازهٔ درستی روی سخت‌افزار کند مهم است.</p></article>
<article class="card"><span class="card-tag">۰۶</span><h3>حریم خصوصی بدون اغراق</h3><p>بگویید یک سازوکار در برابر چه چیزی محافظت می‌کند و در برابر چه چیزی نه. هیچ ادعایی بدون سازوکارِ تعریف‌شده.</p></article>
<article class="card"><span class="card-tag">۰۷</span><h3>صریح به‌جای جادویی</h3><p>فریم‌های خوانا، وضعیت آشکار، خطاهای قابل پیش‌بینی. هیچ چیز پنهانی که اشکال‌زدا نتواند نشان دهد.</p></article>
<article class="card"><span class="card-tag">۰۸</span><h3>هستهٔ کوچک، لبه‌های گسترش‌پذیر</h3><p>هسته ریز می‌ماند. ربات‌ها، پل‌ها، سرویس‌ها و ابزارها از بیرون و از راه برچسب‌ها و قابلیت‌ها متصل می‌شوند.</p></article>
<article class="card"><span class="card-tag">۰۹</span><h3>مستندات بخشی از پروتکل است</h3><p>رفتارِ مستندنشده، رفتاری تعریف‌نشده است. نمونه‌ها و بردارهای آزمون حکم مشخصات را دارند.</p></article>
<article class="card"><span class="card-tag">۱۰</span><h3>پیاده‌سازی عملی به‌جای گمانه‌زنی</h3><p>چیزی به این دلیل که روزی شاید مفید باشد به هسته اضافه نمی‌شود؛ وقتی اضافه می‌شود که اکنون لازم باشد.</p></article>
</div>`}
    },
    {
      id:"architecture",slug:"architecture",num:5,
      en:{title:"Architecture",body:
`<p class="lede">The architecture is four layers deep and nothing else. Each layer only knows about the one below it.</p>
<div class="diagram" role="img" aria-label="Overall architecture: Rust TUI client speaks the NYX protocol to a server implementation, which handles storage, transport and authentication.">
<p class="diagram-title">Figure 1 · Overall architecture</p>
<div class="flow">
<div class="node node-info"><span class="node-k">Layer 1 · Client</span><span class="node-t">Rust TUI Client</span><span class="node-s">terminal rendering · input · local state · message cache</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node node-accent"><span class="node-k">Layer 2 · Contract</span><span class="node-t">NYX Protocol</span><span class="node-s">versioned · language independent · documented · testable</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node"><span class="node-k">Layer 3 · Server</span><span class="node-t">Server Implementation</span><span class="node-s">connection handling · routing · channels · sessions</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node"><span class="node-k">Layer 4 · Backend</span><span class="node-t">Storage / Transport / Authentication</span><span class="node-s">implementation choice of the server operator</span></div>
</div>
</div>
<h3>What each layer owns</h3>
<div class="tablewrap">
<table>
<caption>Layer responsibilities</caption>
<thead><tr><th>Layer</th><th>Responsible for</th><th>Must not decide</th></tr></thead>
<tbody>
<tr><td>Client</td><td>Interface, input handling, local configuration, session cache, presenting history</td><td>Routing rules, other clients' state, retention policy</td></tr>
<tr><td>Protocol</td><td>Frame semantics, connection lifecycle, capability and tag negotiation, error meanings, versioning</td><td>Storage format, database choice, interface layout</td></tr>
<tr><td>Server</td><td>Accepting connections, authenticating identities, routing messages, holding channel state, persistence</td><td>How clients render anything</td></tr>
<tr><td>Backend</td><td>Durability, transport security, credentials storage, backups</td><td>Protocol semantics</td></tr>
</tbody>
</table>
</div>
<h3>Deliberate limits</h3>
<ul class="tick">
<li><strong>One server per connection.</strong> A client connects to one server. There is no built-in routing between servers.</li>
<li><strong>No distributed infrastructure.</strong> No consensus, no peer discovery, no replication layer in the core.</li>
<li><strong>No mandatory services.</strong> Nothing outside the client–server pair is required for NYX to work.</li>
</ul>
<div class="note"><p>Federation and multi-server routing are recorded as <span class="badge b-fut">Future</span>. They are excluded now because they multiply every hard problem in the protocol. Keeping them out is what keeps NYX implementable.</p></div>`},
      fa:{title:"معماری",body:
`<p class="lede">معماری چهار لایه عمق دارد و نه بیشتر. هر لایه فقط لایهٔ زیر خودش را می‌شناسد.</p>
<div class="diagram" role="img" aria-label="معماری کلی: کارخواه پایانه‌ای Rust از راه پروتکل NYX با یک پیاده‌سازی سرور حرف می‌زند و سرور ذخیره‌سازی، انتقال و احراز هویت را اداره می‌کند.">
<p class="diagram-title">شکل ۱ · معماری کلی</p>
<div class="flow">
<div class="node node-info"><span class="node-k">لایهٔ ۱ · کارخواه</span><span class="node-t">کارخواه پایانه‌ای Rust</span><span class="node-s">ترسیم پایانه · ورودی · وضعیت محلی · حافظهٔ نهان پیام</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node node-accent"><span class="node-k">لایهٔ ۲ · قرارداد</span><span class="node-t">پروتکل NYX</span><span class="node-s">نسخه‌پذیر · مستقل از زبان · مستند · آزمودنی</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node"><span class="node-k">لایهٔ ۳ · سرور</span><span class="node-t">پیاده‌سازی سرور</span><span class="node-s">مدیریت اتصال · مسیریابی · کانال‌ها · نشست‌ها</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node"><span class="node-k">لایهٔ ۴ · بک‌اند</span><span class="node-t">ذخیره‌سازی / انتقال / احراز هویت</span><span class="node-s">انتخابِ پیاده‌سازی توسط راهبر سرور</span></div>
</div>
</div>
<h3>هر لایه مالک چیست</h3>
<div class="tablewrap">
<table>
<caption>مسئولیت لایه‌ها</caption>
<thead><tr><th>لایه</th><th>مسئول</th><th>نباید تصمیم بگیرد</th></tr></thead>
<tbody>
<tr><td>کارخواه</td><td>رابط، مدیریت ورودی، پیکربندی محلی، حافظهٔ نهان نشست، نمایش تاریخچه</td><td>قواعد مسیریابی، وضعیت سایر کارخواه‌ها، سیاست نگهداری داده</td></tr>
<tr><td>پروتکل</td><td>معنای فریم، چرخهٔ عمر اتصال، مذاکرهٔ قابلیت و برچسب، معنای خطاها، نسخه‌گذاری</td><td>قالب ذخیره‌سازی، انتخاب پایگاه داده، چیدمان رابط</td></tr>
<tr><td>سرور</td><td>پذیرش اتصال، احراز هویت هویت‌ها، مسیریابی پیام، نگهداری وضعیت کانال، ماندگاری</td><td>اینکه کارخواه‌ها چگونه چیزی را ترسیم کنند</td></tr>
<tr><td>بک‌اند</td><td>ماندگاری، امنیت لایهٔ انتقال، ذخیرهٔ اعتبارنامه‌ها، پشتیبان‌گیری</td><td>معنای پروتکل</td></tr>
</tbody>
</table>
</div>
<h3>محدودیت‌های عمدی</h3>
<ul class="tick">
<li><strong>هر اتصال، یک سرور.</strong> کارخواه به یک سرور وصل می‌شود و مسیریابی داخلی میان سرورها وجود ندارد.</li>
<li><strong>بدون زیرساخت توزیع‌شده.</strong> در هسته نه اجماع هست، نه کشف همتا، نه لایهٔ همانندسازی.</li>
<li><strong>بدون سرویس اجباری.</strong> بیرون از جفت کارخواه–سرور، هیچ چیز برای کار کردن NYX لازم نیست.</li>
</ul>
<div class="note"><p>فدراسیون و مسیریابی چندسروری به‌عنوان <span class="badge b-fut">آینده</span> ثبت شده‌اند. اکنون کنار گذاشته شده‌اند چون هر مسئلهٔ دشوار پروتکل را چند برابر می‌کنند. بیرون نگه داشتن آن‌ها همان چیزی است که NYX را قابل پیاده‌سازی نگه می‌دارد.</p></div>`}
    },
    {
      id:"client",slug:"client",num:6,
      en:{title:"Client",body:
`<p class="lede">The official client is a Rust program with a terminal interface. It is the reference for the protocol, and it is also the reason NYX exists as a user-facing thing at all.</p>
<h3>Why Rust</h3>
<ul class="tick">
<li>Produces a single static binary that is easy to distribute and easy to run over SSH.</li>
<li>Memory safety matters in a long-running interactive process that parses untrusted network input.</li>
<li>The terminal ecosystem is mature and actively maintained.</li>
<li>Async I/O fits a chat client naturally: one connection, many timers, lots of waiting.</li>
</ul>
<p>Specific libraries are a <span class="badge b-plan">Planned</span> decision, not a <span class="badge b-def">Defined</span> one. Terminal rendering, terminal input and async runtime will be chosen during implementation; candidates exist in the Rust ecosystem for each, and none of them affects the protocol.</p>
<h3>Responsibilities</h3>
<div class="cards cards-2">
<article class="card"><h3>Interface</h3><p>Render the conversation list, message history, status line and input. Keyboard-first, readable at small sizes, usable in an 80-column terminal.</p></article>
<article class="card"><h3>Protocol</h3><p>Implement the connection lifecycle, frame encoding and decoding, capability negotiation, reconnection and error reporting.</p></article>
<article class="card"><h3>Local state</h3><p>Read configuration, store credentials outside the config file, keep a local message cache and unread counters.</p></article>
<article class="card"><h3>Sessions</h3><p>Handle disconnects gracefully, resume where the protocol allows it, and never silently drop messages the server has acknowledged.</p></article>
</div>
<h3>Local configuration (sketch)</h3>
<div class="codewrap" data-label="conf">
<pre><code>[server]
host = "nyx.example.org"
port = 6697
transport_security = true

[identity]
nick = "alice"
credential_store = "keyring"

[ui]
theme = "dark"
scrollback = 2000
timestamps = "24h"</code></pre>
</div>
<p>The format is not settled. The point of the sketch is that configuration stays small: one server, one identity, a handful of display preferences.</p>
<div class="note note-plain"><p>The official client is not mandatory. A conforming client in Python, Go or TypeScript is exactly as valid. The Rust client is the reference, not the gatekeeper.</p></div>`},

`<p class="lede">کارخواه رسمی برنامه‌ای با Rust و رابط پایانه‌ای است. هم مرجعِ پروتکل است و هم دلیل اینکه NYX اساساً به‌عنوان یک چیزِ روبهٔ کاربر وجود دارد.</p>
<h3>چرا Rust</h3>
<ul class="tick">
<li>یک باینری ایستای واحد تولید می‌کند که توزیع و اجرای آن روی SSH آسان است.</li>
<li>ایمنی حافظه در فرایندِ تعاملیِ بلندمدتی که ورودی شبکهٔ غیرقابل اعتماد را تجزیه می‌کند اهمیت دارد.</li>
<li>اکوسیستم پایانه در آن بالغ و فعالانه نگهداری می‌شود.</li>
<li>ورودی/خروجی ناهم‌زمان با یک کارخواه گفتگو طبیعی است: یک اتصال، زمان‌سنج‌های زیاد، انتظارِ فراوان.</li>
</ul>
<p>انتخاب کتابخانه‌های مشخص یک تصمیم <span class="badge b-plan">برنامه‌ریزی‌شده</span> است، نه <span class="badge b-def">تعریف‌شده</span>. کتابخانهٔ ترسیم پایانه، ورودی پایانه و زمان‌اجرای ناهم‌زمان در جریان پیاده‌سازی انتخاب می‌شوند؛ برای هرکدام در اکوسیستم Rust گزینه‌هایی هست و هیچ‌کدام بر پروتکل اثر نمی‌گذارد.</p>
<h3>مسئولیت‌ها</h3>
<div class="cards cards-2">
<article class="card"><h3>رابط</h3><p>ترسیم فهرست گفتگوها، تاریخچهٔ پیام‌ها، نوار وضعیت و ورودی. مبتنی بر صفحه‌کلید، خوانا در اندازه‌های کوچک، قابل استفاده در پایانهٔ ۸۰ ستونی.</p></article>
<article class="card"><h3>پروتکل</h3><p>پیاده‌سازی چرخهٔ عمر اتصال، کدگذاری و رمزگشایی فریم، مذاکرهٔ قابلیت‌ها، اتصال مجدد و گزارش خطا.</p></article>
<article class="card"><h3>وضعیت محلی</h3><p>خواندن پیکربندی، نگهداری اعتبارنامه بیرون از فایل پیکربندی، نگهداری حافظهٔ نهان پیام و شمارندهٔ نخوانده‌ها.</p></article>
<article class="card"><h3>نشست‌ها</h3><p>مدیریت مؤدبانهٔ قطع اتصال، از سرگیری تا آنجا که پروتکل اجازه می‌دهد، و هرگز بی‌صدا رها نکردن پیام‌هایی که سرور تأیید کرده است.</p></article>
</div>
<h3>پیکربندی محلی (طرح)</h3>
<div class="codewrap" data-label="conf">
<pre><code>[server]
host = "nyx.example.org"
port = 6697
transport_security = true

[identity]
nick = "alice"
credential_store = "keyring"

[ui]
theme = "dark"
scrollback = 2000
timestamps = "24h"</code></pre>
</div>
<p>قالب هنوز قطعی نیست. هدف این طرح این است که پیکربندی کوچک بماند: یک سرور، یک هویت، چند ترجیح نمایشی.</p>
<div class="note note-plain"><p>کارخواه رسمی اجباری نیست. کارخواهِ منطبق با پروتکل در Python، Go یا TypeScript دقیقاً به همان اندازه معتبر است. کارخواه Rust مرجع است، نه دروازه‌بان.</p></div>`}

      en:{title:"Server",body:
`<p class="lede">A NYX server is any program that accepts client connections and speaks the protocol. The project does not require one language, one database or one deployment shape.</p>
<div class="diagram" role="img" aria-label="Multi-language server model: one Rust client speaks the NYX protocol, and Python, PHP, JavaScript, Rust and Go server implementations all sit behind the same protocol.">
<p class="diagram-title">Figure 2 · Multi-language server model</p>
<div class="flow">
<div class="node node-info"><span class="node-k">Client</span><span class="node-t">NYX Client (Rust TUI)</span><span class="node-s">one implementation, any compatible server</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node node-accent"><span class="node-k">Contract</span><span class="node-t">NYX Protocol</span><span class="node-s">the only thing every server must agree on</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="fanout">
<div class="rail" aria-hidden="true"></div>
<div class="branches">
<div class="branch"><span class="branch-name">Python</span><span class="branch-sub">server</span></div>
<div class="branch"><span class="branch-name">PHP</span><span class="branch-sub">server</span></div>
<div class="branch"><span class="branch-name">JS / TS</span><span class="branch-sub">server</span></div>
<div class="branch"><span class="branch-name">Rust</span><span class="branch-sub">server</span></div>
<div class="branch"><span class="branch-name">Go</span><span class="branch-sub">server</span></div>
</div>
</div>
</div>
</div>
<h3>Minimum duties</h3>
<ul class="tick">
<li>Accept a connection and complete the handshake, including protocol version agreement.</li>
<li>Authenticate the identity the client claims, using whatever mechanism the operator configures.</li>
<li>Maintain channel membership and conversation state for the duration of sessions.</li>
<li>Route messages to the right recipients and acknowledge the ones it accepted.</li>
<li>Advertise the capabilities it supports and reject what it does not.</li>
<li>Report errors with a stable, documented meaning.</li>
</ul>
<h3>Everything else is a choice</h3>
<p>Persistence, retention, rate limiting, spam handling, transport security, administration tooling and deployment topology are server implementation concerns. The protocol may require that a behaviour exists — for example, that a server must acknowledge a message — but it does not require how that behaviour is achieved.</p>
<div class="note"><p><strong>Official implementation ≠ protocol specification.</strong> A developer should be able to read the specification alone and produce a compatible server without opening the reference source. Where the reference server and the specification disagree, the specification wins and the server has a bug.</p></div>
<p>A reference server is <span class="badge b-plan">Planned</span>. Its purpose is to exercise the protocol and to serve as a target for compatibility tests, not to be the only way to run NYX.</p>`},
      fa:{title:"سرور",body:
`<p class="lede">سرور NYX هر برنامه‌ای است که اتصال کارخواه‌ها را بپذیرد و پروتکل را حرف بزند. پروژه نه یک زبان، نه یک پایگاه داده و نه یک شکل استقرار را الزام نمی‌کند.</p>
<div class="diagram" role="img" aria-label="مدل سرور چندزبانه: یک کارخواه Rust پروتکل NYX را حرف می‌زند و پیاده‌سازی‌های سرور با Python، PHP، جاوااسکریپت، Rust و Go همگی پشت همان پروتکل قرار دارند.">
<p class="diagram-title">شکل ۲ · مدل سرور چندزبانه</p>
<div class="flow">
<div class="node node-info"><span class="node-k">کارخواه</span><span class="node-t">کارخواه NYX (پایانهٔ Rust)</span><span class="node-s">یک پیاده‌سازی، هر سرور سازگار</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="node node-accent"><span class="node-k">قرارداد</span><span class="node-t">پروتکل NYX</span><span class="node-s">تنها چیزی که همهٔ سرورها باید روی آن توافق کنند</span></div>
<div class="connector" aria-hidden="true"></div>
<div class="fanout">
<div class="rail" aria-hidden="true"></div>
<div class="branches">
<div class="branch"><span class="branch-name">Python</span><span class="branch-sub">سرور</span></div>
<div class="branch"><span class="branch-name">PHP</span><span class="branch-sub">سرور</span></div>
<div class="branch"><span class="branch-name">JS / TS</span><span class="branch-sub">سرور</span></div>
<div class="branch"><span class="branch-name">Rust</span><span class="branch-sub">سرور</span></div>
<div class="branch"><span class="branch-name">Go</span><span class="branch-sub">سرور</span></div>
</div>
</div>
</div>
</div>
<h3>حداقل وظایف</h3>
<ul class="tick">
<li>پذیرش اتصال و تکمیل دست‌دادن اولیه، از جمله توافق روی نسخهٔ پروتکل.</li>
<li>احراز هویتِ هویتی که کارخواه ادعا می‌کند، با هر سازوکاری که راهبر پیکربندی کرده است.</li>
<li>نگهداری عضویت کانال‌ها و وضعیت گفتگوها در طول نشست‌ها.</li>
<li>مسیریابی پیام‌ها به گیرندگان درست و تأیید آن‌هایی که پذیرفته شده‌اند.</li>
<li>اعلام قابلیت‌هایی که پشتیبانی می‌کند و رد کردن آنچه پشتیبانی نمی‌کند.</li>
<li>گزارش خطاها با معنایی پایدار و مستند.</li>
</ul>
<h3>هر چیز دیگر یک انتخاب است</h3>
<p>ماندگاری، مدت نگهداری داده، محدودسازی نرخ، مقابله با هرزپیام، امنیت لایهٔ انتقال، ابزار مدیریت و شکل استقرار، همگی دغدغهٔ پیاده‌سازی سرور هستند. پروتکل ممکن است وجودِ یک رفتار را الزام کند — مثلاً اینکه سرور باید یک پیام را تأیید کند — اما چگونگی دستیابی به آن را الزام نمی‌کند.</p>
<div class="note"><p><strong>پیاده‌سازی رسمی ≠ مشخصات پروتکل.</strong> یک توسعه‌دهنده باید بتواند تنها با خواندن مشخصات، سروری سازگار بنویسد بدون آنکه کد مرجع را باز کند. هر جا سرور مرجع و مشخصات اختلاف داشتند، مشخصات برنده است و سرور اشکال دارد.</p></div>
<p>سرور مرجع <span class="badge b-plan">برنامه‌ریزی‌شده</span> است. هدفش این است که پروتکل را به کار بیندازد و هدفی برای آزمون‌های سازگاری باشد، نه اینکه تنها راه اجرای NYX باشد.</p>`}

      en:{title:"Protocol",body:
`<p class="lede">The protocol is the most important deliverable of NYX. It should be small enough to read in one sitting, explicit enough to debug with a socket, and stable enough that a third party can build against it.</p>
<h3>Design rules</h3>
<ul class="tick">
<li><strong>Small.</strong> A minimal conforming implementation needs a handful of frame kinds, not dozens.</li>
<li><strong>Explicit.</strong> Every state change is visible on the wire. No hidden negotiation and no out-of-band magic.</li>
<li><strong>Predictable.</strong> The same input produces the same response, and every error has a documented meaning.</li>
<li><strong>Versionable.</strong> Client and server agree on a protocol version during the handshake and disagree loudly if they cannot.</li>
<li><strong>Language independent.</strong> Nothing in the protocol assumes a particular runtime, threading model or standard library.</li>
<li><strong>Debuggable.</strong> A human should be able to follow a connection with a plain socket tool.</li>
<li><strong>Extensible without growth.</strong> New behaviour arrives as declared capabilities and tags; unknown ones are ignored, not fatal.</li>
</ul>
<h3>Conceptual model</h3>
<p>Conceptually the protocol exchanges two kinds of units: <em>requests and events</em> initiated by either side, and <em>acknowledgements</em> that tie a response back to what caused it. Connection setup, authentication, joining and messaging are all expressed with the same shape, which keeps the surface small.</p>
<div class="codewrap" data-label="wire">
<pre><code>C -&gt; S   HELLO    { client: "nyx-rust", version: "0.1.0", protocols: ["0.1"] }
S -&gt; C   WELCOME  { server: "nyxd", protocol: "0.1", session: "s_8f2a",
                    capabilities: ["channels", "tags", "history"] }
C -&gt; S   AUTH     { method: "token", credential: "..." }
S -&gt; C   ACK      { ref: "AUTH", identity: "u_alice" }
C -&gt; S   JOIN     { target: "#general" }
S -&gt; C   EVENT    { type: "membership", target: "#general", identity: "u_alice" }
C -&gt; S   MSG      { id: "m_01", to: "#general", body: "hello", tags: [] }
S -&gt; C   ACK      { ref: "m_01", ts: 1730000000 }
S -&gt; C   MSG      { id: "m_02", from: "u_bob", to: "#general",
                    body: "hi", ts: 1730000004, tags: [] }
C -&gt; S   PING     { n: 7 }
S -&gt; C   PONG     { n: 7 }</code></pre>
</div>
<div class="note note-warn"><p>The trace above is <strong>illustrative pseudo-syntax</strong>. It communicates the intended shape of the exchange. It is not a wire format, and it must not be implemented against.</p></div>
<h3>A single message, expressed structurally</h3>
<div class="codewrap" data-label="json">
<pre><code>{
  "kind": "msg",
  "id": "m_9f2c1a",
  "from": "u_alice",
  "to": "#general",
  "ts": 1730000000,
  "body": "hello",
  "tags": [],
  "meta": {}
}</code></pre>
</div>
<p>JSON appears here because it is readable. It is a presentation choice for this document, not a decision about the protocol.</p>
<details class="tech">
<summary>Serialization options under consideration</summary>
<div class="tech-body">
<p>Three broad options have been discussed, none selected:</p>
<ul>
<li><strong>Line-delimited JSON over a secure transport.</strong> Easiest to implement and to debug in every language, including PHP. Verbose on the wire.</li>
<li><strong>Compact binary framing.</strong> Cheaper for constrained links and easier to bound, but raises the cost of a first implementation and makes casual debugging harder.</li>
<li><strong>Text protocol in the IRC tradition.</strong> Human-readable with a plain socket, but historically weak at structured metadata and at carrying optional fields cleanly.</li>
</ul>
<p>The decision should be made against a written set of test vectors rather than by preference, and it belongs to <span class="badge b-plan">Phase 1</span>. Until then, everything in this section describes semantics only.</p>
</div>
</details>
<h3>Protocol status</h3>
<div class="tablewrap">
<table>
<caption>What is settled and what is not</caption>
<thead><tr><th>Aspect</th><th>State</th><th>Note</th></tr></thead>
<tbody>
<tr><td>Conceptual entity model</td><td><span class="badge b-def">Defined</span></td><td>Identities, sessions, channels, conversations, messages, capabilities, tags</td></tr>
<tr><td>Connection lifecycle shape</td><td><span class="badge b-plan">Planned</span></td><td>Handshake, authentication, activity, disconnect, resume</td></tr>
<tr><td>Capability negotiation</td><td><span class="badge b-plan">Planned</span></td><td>Declared at handshake; unknown capabilities ignored</td></tr>
<tr><td>Tag model</td><td><span class="badge b-exp">Experimental</span></td><td>Descriptive labels; semantics still being shaped</td></tr>
<tr><td>Wire format</td><td><span class="badge b-exp">Experimental</span></td><td>Not selected; see options above</td></tr>
<tr><td>Message ordering guarantees</td><td><span class="badge b-exp">Experimental</span></td><td>Open question, see section 19</td></tr>
<tr><td>Version negotiation details</td><td><span class="badge b-plan">Planned</span></td><td>Intent is a simple major.minor string</td></tr>
<tr><td>End-to-end encryption</td><td><span class="badge b-fut">Future</span></td><td>No mechanism designed</td></tr>
<tr><td>Server-to-server federation</td><td><span class="badge b-fut">Future</span></td><td>Explicitly out of the core</td></tr>
</tbody>
</table>
</div>`},
      fa:{title:"پروتکل",body:
`<p class="lede">پروتکل مهم‌ترین خروجی NYX است. باید آن‌قدر کوچک باشد که در یک نشست خوانده شود، آن‌قدر صریح باشد که با یک سوکت خام اشکال‌زدایی شود، و آن‌قدر پایدار باشد که شخص ثالث بتواند بر پایهٔ آن چیزی بسازد.</p>
<h3>قواعد طراحی</h3>
<ul class="tick">
<li><strong>کوچک.</strong> یک پیاده‌سازیِ حداقلیِ منطبق به چند نوع فریم نیاز دارد، نه ده‌ها نوع.</li>
<li><strong>صریح.</strong> هر تغییر وضعیت روی سیم دیده می‌شود. نه مذاکرهٔ پنهان، نه جادوی بیرون از باند.</li>
<li><strong>قابل پیش‌بینی.</strong> ورودی یکسان پاسخ یکسان تولید می‌کند و هر خطا معنایی مستند دارد.</li>
<li><strong>نسخه‌پذیر.</strong> کارخواه و سرور در دست‌دادن اولیه روی نسخهٔ پروتکل توافق می‌کنند و اگر نتوانند، با صدای بلند اعلام اختلاف می‌کنند.</li>
<li><strong>مستقل از زبان.</strong> هیچ چیز در پروتکل یک زمان‌اجرا، مدل نَخ یا کتابخانهٔ استاندارد خاص را فرض نمی‌کند.</li>
<li><strong>اشکال‌زدایی‌پذیر.</strong> یک انسان باید بتواند یک اتصال را با ابزار سادهٔ سوکت دنبال کند.</li>
<li><strong>گسترش‌پذیر بدون رشد.</strong> رفتار جدید به شکل قابلیت‌ها و برچسب‌های اعلام‌شده می‌آید؛ ناشناخته‌ها نادیده گرفته می‌شوند، نه اینکه کشنده باشند.</li>
</ul>
<h3>مدل مفهومی</h3>
<p>از نظر مفهومی، پروتکل دو نوع واحد رد و بدل می‌کند: <em>درخواست‌ها و رویدادها</em> که هر دو طرف می‌توانند آغاز کنند، و <em>تأییدها</em> که پاسخ را به آنچه باعثش شده گره می‌زنند. برقراری اتصال، احراز هویت، پیوستن و پیام‌دادن همه با همان شکل بیان می‌شوند و این، سطح پروتکل را کوچک نگه می‌دارد.</p>
<div class="codewrap" data-label="wire">
<pre><code>C -&gt; S   HELLO    { client: "nyx-rust", version: "0.1.0", protocols: ["0.1"] }
S -&gt; C   WELCOME  { server: "nyxd", protocol: "0.1", session: "s_8f2a",
                    capabilities: ["channels", "tags", "history"] }
C -&gt; S   AUTH     { method: "token", credential: "..." }
S -&gt; C   ACK      { ref: "AUTH", identity: "u_alice" }
C -&gt; S   JOIN     { target: "#general" }
S -&gt; C   EVENT    { type: "membership", target: "#general", identity: "u_alice" }
C -&gt; S   MSG      { id: "m_01", to: "#general", body: "hello", tags: [] }
S -&gt; C   ACK      { ref: "m_01", ts: 1730000000 }
S -&gt; C   MSG      { id: "m_02", from: "u_bob", to: "#general",
                    body: "hi", ts: 1730000004, tags: [] }
C -&gt; S   PING     { n: 7 }
S -&gt; C   PONG     { n: 7 }</code></pre>
</div>
<div class="note note-warn"><p>ردِ بالا <strong>شبه‌نحوِ نمونه</strong> است. تنها شکلِ مورد نظرِ تبادل را منتقل می‌کند. قالب سیمی نیست و نباید بر پایهٔ آن پیاده‌سازی انجام شود.</p></div>
<h3>یک پیام، به شکل ساختاری</h3>
<div class="codewrap" data-label="json">
<pre><code>{
  "kind": "msg",
  "id": "m_9f2c1a",
  "from": "u_alice",
  "to": "#general",
  "ts": 1730000000,
  "body": "hello",
  "tags": [],
  "meta": {}
}</code></pre>
</div>
<p>JSON اینجا آمده چون خواناست. این یک انتخابِ ارائه‌ای برای همین سند است، نه تصمیمی دربارهٔ پروتکل.</p>
<details class="tech">
<summary>گزینه‌های قالب‌بندی داده که در بررسی‌اند</summary>
<div class="tech-body">
<p>سه دسته گزینه مطرح شده و هیچ‌کدام انتخاب نشده است:</p>
<ul>
<li><strong>JSON خط‌جداشده روی انتقال امن.</strong> ساده‌ترین گزینه برای پیاده‌سازی و اشکال‌زدایی در هر زبانی، از جمله PHP. روی سیم پرحجم است.</li>
<li><strong>فریم‌بندی باینری فشرده.</strong> برای اتصالات محدود به‌صرفه‌تر و کران‌گذاری آن آسان‌تر است، اما هزینهٔ نخستین پیاده‌سازی را بالا می‌برد و اشکالزدایی روزمره را سخت‌تر می‌کند.</li>
<li><strong>پروتکل متنی در سنت IRC.</strong> با سوکت خام خواناست، اما از نظر تاریخی در حمل فرادادهٔ ساختاریافته و فیلدهای اختیاری ضعیف عمل کرده است.</li>
</ul>
<p>این تصمیم باید بر پایهٔ مجموعه‌ای مکتوب از بردارهای آزمون گرفته شود نه بر پایهٔ سلیقه، و به <span class="badge b-plan">فاز ۱</span> تعلق دارد. تا آن زمان، هرچه در این بخش آمده فقط معنا را توصیف می‌کند.</p>
</div>
</details>
<h3>وضعیت پروتکل</h3>
<div class="tablewrap">
<table>
<caption>چه چیز قطعی است و چه چیز نه</caption>
<thead><tr><th>جنبه</th><th>وضعیت</th><th>یادداشت</th></tr></thead>
<tbody>
<tr><td>مدل مفهومی موجودیت‌ها</td><td><span class="badge b-def">تعریف‌شده</span></td><td>هویت‌ها، نشست‌ها، کانال‌ها، گفتگوها، پیام‌ها، قابلیت‌ها، برچسب‌ها</td></tr>
<tr><td>شکل چرخهٔ عمر اتصال</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td><td>دست‌دادن، احراز هویت، فعالیت، قطع، ازسرگیری</td></tr>
<tr><td>مذاکرهٔ قابلیت‌ها</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td><td>در دست‌دادن اعلام می‌شود؛ قابلیت ناشناخته نادیده گرفته می‌شود</td></tr>
<tr><td>مدل برچسب</td><td><span class="badge b-exp">آزمایشی</span></td><td>نشان‌های توصیفی؛ معنا هنوز در حال شکل‌گیری</td></tr>
<tr><td>قالب سیمی</td><td><span class="badge b-exp">آزمایشی</span></td><td>انتخاب نشده؛ گزینه‌ها را ببینید</td></tr>
<tr><td>تضمین ترتیب پیام‌ها</td><td><span class="badge b-exp">آزمایشی</span></td><td>پرسش باز، بخش ۱۹</td></tr>
<tr><td>جزئیات مذاکرهٔ نسخه</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td><td>قصد، یک رشتهٔ سادهٔ major.minor است</td></tr>
<tr><td>رمزنگاری سرتاسری</td><td><span class="badge b-fut">آینده</span></td><td>هیچ سازوکاری طراحی نشده</td></tr>
<tr><td>فدراسیون سرور به سرور</td><td><span class="badge b-fut">آینده</span></td><td>صریحاً بیرون از هسته</td></tr>
</tbody>
</table>
</div>`}

    {
      id:"data-model",slug:"data-model",num:9,
      en:{title:"Core Data Model",body:
`<p class="lede">Nine entities cover the whole core. Each one exists because a client or a server cannot function without it.</p>
<div class="tablewrap">
<table>
<caption>Core entities</caption>
<thead><tr><th>Entity</th><th>Role</th><th>State</th></tr></thead>
<tbody>
<tr><td><code>Identity</code></td><td>A persistent handle a client authenticates as. Survives reconnects and nickname changes.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Account</code></td><td>Server-side record holding credentials and preferences for one or more identities. Shape is a server concern.</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td><code>Server</code></td><td>The endpoint a client connects to. Owns routing for its own identities and channels.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Channel</code></td><td>A named conversation with multiple participants and shared membership state.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Conversation</code></td><td>A direct exchange between two identities. Shares the message model with channels.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Message</code></td><td>The unit of content: sender, target, identifier, timestamp, body, optional metadata, optional tags.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Session</code></td><td>One live connection, with its negotiated protocol version and capability set.</td><td><span class="badge b-def">Defined</span></td></tr>
<tr><td><code>Capability</code></td><td>A named optional feature declared at handshake. Unknown capabilities are ignored.</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td><code>Tag</code></td><td>A descriptive label on a participant or message. Carries no authority by itself.</td><td><span class="badge b-exp">Experimental</span></td></tr>
</tbody>
</table>
</div>
<h3>Message fields</h3>
<p>A message conceptually carries the following. Which of these are required, optional, server-assigned or client-assigned is still being decided:</p>
<div class="tablewrap">
<table>
<thead><tr><th>Field</th><th>Meaning</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><code>id</code></td><td>Identifier used for acknowledgement, deduplication and referencing</td><td>Client-generated or server-assigned: open question</td></tr>
<tr><td><code>from</code></td><td>Identity that sent it</td><td>Set by the server after authentication, not trusted from the client</td></tr>
<tr><td><code>to</code></td><td>Channel or conversation target</td><td>Single target; multi-target sends are repeated sends</td></tr>
<tr><td><code>ts</code></td><td>Timestamp</td><td>Server time is authoritative for ordering; clock representation undecided</td></tr>
<tr><td><code>body</code></td><td>The content itself</td><td>Plain text first; richer formatting is an open question</td></tr>
<tr><td><code>tags</code></td><td>Optional descriptive labels</td><td>Experimental</td></tr>
<tr><td><code>meta</code></td><td>Optional structured metadata</td><td>Must be safely ignorable by older implementations</td></tr>
</tbody>
</table>
</div>
<div class="note"><p>The model deliberately has no notion of threads, reactions, attachments, read receipts or presence levels. Those may exist someday as extensions. Adding them to the core now would double the work of every server implementer.</p></div>`},
      fa:{title:"مدل دادهٔ هسته",body:
`<p class="lede">نه موجودیت کل هسته را می‌پوشاند. هر کدام به این دلیل هست که کارخواه یا سرور بدون آن کار نمی‌کند.</p>
<div class="tablewrap">
<table>
<caption>موجودیت‌های هسته</caption>
<thead><tr><th>موجودیت</th><th>نقش</th><th>وضعیت</th></tr></thead>
<tbody>
<tr><td><code>Identity</code></td><td>نام ماندگاری که کارخواه با آن احراز هویت می‌کند و پس از اتصال مجدد و تغییر نام باقی می‌ماند.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Account</code></td><td>رکورد سمت سرور که اعتبارنامه و ترجیحات یک یا چند هویت را نگه می‌دارد. شکل آن دغدغهٔ سرور است.</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td><code>Server</code></td><td>نقطهٔ پایانی که کارخواه به آن وصل می‌شود و مسیریابی هویت‌ها و کانال‌های خودش را بر عهده دارد.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Channel</code></td><td>گفتگوی نام‌گذاری‌شده با چند شرکت‌کننده و وضعیت عضویت مشترک.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Conversation</code></td><td>تبادل مستقیم میان دو هویت. مدل پیام را با کانال‌ها مشترک دارد.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Message</code></td><td>واحد محتوا: فرستنده، مقصد، شناسه، زمان، بدنه، فرادادهٔ اختیاری، برچسب اختیاری.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Session</code></td><td>یک اتصال زنده، همراه با نسخهٔ پروتکل و مجموعهٔ قابلیت‌های مذاکره‌شده.</td><td><span class="badge b-def">تعریف‌شده</span></td></tr>
<tr><td><code>Capability</code></td><td>ویژگی اختیاریِ نام‌دار که در دست‌دادن اعلام می‌شود. قابلیت ناشناخته نادیده گرفته می‌شود.</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td><code>Tag</code></td><td>نشان توصیفی روی شرکت‌کننده یا پیام. به خودی خود هیچ اختیاری ایجاد نمی‌کند.</td><td><span class="badge b-exp">آزمایشی</span></td></tr>
</tbody>
</table>
</div>
<h3>فیلدهای پیام</h3>
<p>یک پیام از نظر مفهومی موارد زیر را حمل می‌کند. اینکه کدام الزامی، اختیاری، تعیین‌شده توسط سرور یا توسط کارخواه باشد هنوز در حال تصمیم‌گیری است:</p>
<div class="tablewrap">
<table>
<thead><tr><th>فیلد</th><th>معنا</th><th>یادداشت</th></tr></thead>
<tbody>
<tr><td><code>id</code></td><td>شناسه‌ای برای تأیید، رفع تکرار و ارجاع</td><td>تولید توسط کارخواه یا تخصیص توسط سرور: پرسش باز</td></tr>
<tr><td><code>from</code></td><td>هویتِ فرستنده</td><td>پس از احراز هویت توسط سرور تعیین می‌شود؛ از کارخواه پذیرفته نمی‌شود</td></tr>
<tr><td><code>to</code></td><td>مقصد: کانال یا گفتگو</td><td>یک مقصد؛ ارسال به چند مقصد یعنی چند ارسال</td></tr>
<tr><td><code>ts</code></td><td>زمان</td><td>زمان سرور برای ترتیب معتبر است؛ نمایش زمان هنوز تصمیم‌گرفته نشده</td></tr>
<tr><td><code>body</code></td><td>خودِ محتوا</td><td>ابتدا متن ساده؛ قالب‌بندی غنی‌تر پرسش باز است</td></tr>
<tr><td><code>tags</code></td><td>نشان‌های توصیفی اختیاری</td><td>آزمایشی</td></tr>
<tr><td><code>meta</code></td><td>فرادادهٔ ساختاریافتهٔ اختیاری</td><td>باید برای پیاده‌سازی‌های قدیمی‌تر با امنیت قابل چشم‌پوشی باشد</td></tr>
</tbody>
</table>
</div>
<div class="note"><p>در این مدل آگاهانه هیچ مفهومی از رشته‌های پیام، واکنش، پیوست، رسید خوانده‌شدن یا سطح حضور وجود ندارد. ممکن است روزی به شکل افزونه وجود داشته باشند. افزودنشان به هسته در حال حاضر، کار هر پیاده‌ساز سرور را دو برابر می‌کند.</p></div>`}
