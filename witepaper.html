    {
      id:"tui",slug:"tui",num:10,
      en:{title:"Terminal UI",body:
`<p class="lede">The TUI is the centre of NYX. Everything else in the project exists so that this screen can be fast, quiet and easy to live in for hours.</p>
<div class="codewrap" data-label="mock">
<pre class="ascii">┌──────────────────────────────────────────────────────────────────────────┐
│ nyx  ·  alice      │#general            connected                        │
├────────────────────┬─────────────────────────────────────────────────────┤
│ conversations      │ #general                                            │
│                    │                                                     │
│ #general     (3)   │ 10:02 bob    pushed the reference server branch     │
│ #dev         (1)   │ 10:03 alice  does it speak 0.1 yet?                 │
│ @bob           *   │ 10:03 bob    hello frame only, for now              │
│ @carol             │ 10:05 carol  enough for the first conformance test  │
│ @bridge  [tag]     │ 10:06 @bridge relay: irc -&gt; nyx  ok                 │
│                    │                                                     │
│ 3 unread           │ 14 members · tags: @bot @bridge                     │
├────────────────────┴─────────────────────────────────────────────────────┤
│ &gt; /msg #general    │ nyx 0.1.0 · protocol 0.1                            │
└──────────────────────────────────────────────────────────────────────────┘</pre>
</div>
<p>The mock is conceptual. The layout is inherited from earlier NYX experiments where it proved comfortable, but the final implementation is free to evolve.</p>
<h3>Regions</h3>
<div class="tablewrap">
<table>
<thead><tr><th>Region</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td>Status line</td><td>Identity, current target, connection state and the negotiated protocol version</td></tr>
<tr><td>Sidebar</td><td>Channels and conversations with unread indicators, ordered predictably rather than by activity churn</td></tr>
<tr><td>Message pane</td><td>Scrollable history with aligned timestamps, sender and body; tags shown inline where present</td></tr>
<tr><td>Input line</td><td>Composition, command entry, and enough room to see what is being typed</td></tr>
</tbody>
</table>
</div>
<h3>Requirements</h3>
<ul class="tick">
<li><strong>Keyboard first.</strong> Every action reachable without a pointer. Modal-free wherever possible.</li>
<li><strong>Low resource usage.</strong>Idle CPU close to zero, bounded scrollback, no per-frame reallocation storms.</li>
<li><strong>Readable history.</strong> Aligned columns, consistent colour roles, no decoration that competes with the text.</li>
<li><strong>SSH friendly.</strong> Correct behaviour under latency, window resize and terminal type variation.</li>
<li><strong>Long-session comfort.</strong> Predictable navigation, visible state, no surprise mode changes.</li>
<li><strong>Accessible.</strong> Sufficient contrast, meaning never carried by colour alone, respect for terminal capabilities.</li>
<li><strong>Extensible.</strong> A command system that third-party tooling can hook into without modifying the client.</li>
</ul>
<div class="note note-plain"><p>No animations, transparency effects or decorative graphics are planned for the TUI. Anything that costs render time without carrying information is out of scope.</p></div>`},
      fa:{title:"رابط پایانه (TUI)",body:
`<p class="lede">رابط پایانه مرکز NYX است. هر چیز دیگری در پروژه وجود دارد تا این صفحه سریع، آرام و برای ساعت‌ها زندگی کردن راحت باشد.</p>
<div class="codewrap" data-label="mock">
<pre class="ascii">┌──────────────────────────────────────────────────────────────────────────┐
│ nyx  ·  alice      │#general            connected                        │
├────────────────────┬─────────────────────────────────────────────────────┤
│ conversations      │ #general                                            │
│                    │                                                     │
│ #general     (3)   │ 10:02 bob    pushed the reference server branch     │
│ #dev         (1)   │ 10:03 alice  does it speak 0.1 yet?                 │
│ @bob           *   │ 10:03 bob    hello frame only, for now              │
│ @carol             │ 10:05 carol  enough for the first conformance test  │
│ @bridge  [tag]     │ 10:06 @bridge relay: irc -&gt; nyx  ok                 │
│                    │                                                     │
│ 3 unread           │ 14 members · tags: @bot @bridge                     │
├────────────────────┴─────────────────────────────────────────────────────┤
│ &gt; /msg #general    │ nyx 0.1.0 · protocol 0.1                            │
└──────────────────────────────────────────────────────────────────────────┘</pre>
</div>
<p>این ماکت مفهومی است. چیدمان از آزمایش‌های پیشین NYX به ارث رسیده، جایی که راحت از آب درآمد؛ اما پیاده‌سازی نهایی آزاد است که تکامل یابد.</p>
<h3>ناحیه‌ها</h3>
<div class="tablewrap">
<table>
<thead><tr><th>ناحیه</th><th>کارکرد</th></tr></thead>
<tbody>
<tr><td>نوار وضعیت</td><td>هویت، مقصد کنونی، وضعیت اتصال و نسخهٔ مذاکره‌شدهٔ پروتکل</td></tr>
<tr><td>نوار کناری</td><td>کانال‌ها و گفتگوها با نشانگر نخوانده‌ها، با ترتیبی قابل پیش‌بینی نه بر پایهٔ آشفتگی فعالیت</td></tr>
<tr><td>قاب پیام</td><td>تاریخچهٔ پیمایش‌پذیر با زمان، فرستنده و بدنهٔ تراز‌شده؛ برچسب‌ها در صورت وجود درون‌خطی نمایش داده می‌شوند</td></tr>
<tr><td>خط ورودی</td><td>نگارش، ورود فرمان، و فضای کافی برای دیدنِ آنچه تایپ می‌شود</td></tr>
</tbody>
</table>
</div>
<h3>الزامات</h3>
<ul class="tick">
<li><strong>اولویت با صفحه‌کلید.</strong> هر عملی بدون اشاره‌گر قابل دسترسی باشد و تا حد امکان بدون حالتِ مودال.</li>
<li><strong>مصرف کم منابع.</strong>پردازندهٔ نزدیک به صفر در حالت بیکار، حافظهٔ پیمایش کران‌دار، بدون طوفان تخصیص حافظه در هر فریم.</li>
<li><strong>تاریخچهٔ خوانا.</strong>ستون‌های تراز، نقش رنگی ثابت، بدون آرایشی که با متن رقابت کند.</li>
<li><strong>سازگار با SSH.</strong>رفتار درست در تأخیر شبکه، تغییر اندازهٔ پنجره و تفاوت نوع پایانه.</li>
<li><strong>راحتی در نشست‌های طولانی.</strong>پیمایش قابل پیش‌بینی، وضعیت آشکار، بدون تغییر حالت غافلگیرکننده.</li>
<li><strong>دسترس‌پذیر.</strong>کنتراست کافی، معنا هیچ‌گاه فقط با رنگ منتقل نشود، و رعایت توانایی‌های پایانه.</li>
<li><strong>گسترش‌پذیر.</strong>سامانهٔ فرمانی که ابزارهای شخص ثالث بتوانند بدون تغییر در کارخواه به آن قلاب شوند.</li>
</ul>
<div class="note note-plain"><p>هیچ پویانمایی، اثر شفافیت یا گرافیک تزئینی برای رابط پایانه برنامه‌ریزی نشده است. هرچه زمان ترسیم بگیرد و اطلاعاتی منتقل نکند، خارج از دامنه است.</p></div>`}
    },
    {
      id:"commands",slug:"commands",num:11,
      en:{title:"Commands",body:
`<p class="lede">Commands follow the IRC convention: a line starting with a slash is an instruction to the client or the server, anything else is a message. Every command listed here is <span class="badge b-plan">Proposed</span>.</p>
<div class="tablewrap">
<table>
<caption>Proposed command set</caption>
<thead><tr><th>Command</th><th>Purpose</th><th>Executed by</th></tr></thead>
<tbody>
<tr><td><code>/connect &lt;host&gt;</code></td><td>Open a session to a server</td><td>Client</td></tr>
<tr><td><code>/nick &lt;name&gt;</code></td><td>Change the displayed nickname for the current identity</td><td>Client → Server</td></tr>
<tr><td><code>/join &lt;#channel&gt;</code></td><td>Join a channel</td><td>Server</td></tr>
<tr><td><code>/leave &lt;#channel&gt;</code></td><td>Leave a channel</td><td>Server</td></tr>
<tr><td><code>/msg &lt;target&gt; &lt;text&gt;</code></td><td>Send to a channel or an identity without switching context</td><td>Client → Server</td></tr>
<tr><td><code>/who &lt;target&gt;</code></td><td>List participants or inspect one identity</td><td>Server</td></tr>
<tr><td><code>/status</code></td><td>Show connection, protocol version, capabilities and identity</td><td>Client</td></tr>
<tr><td><code>/help [topic]</code></td><td>Show command help inside the terminal</td><td>Client</td></tr>
<tr><td><code>/quit [reason]</code></td><td>Close the session cleanly</td><td>Client → Server</td></tr>
</tbody>
</table>
</div>
<h3>Conventions</h3>
<ul class="tick">
<li>Commands are parsed by the client before anything reaches the wire; some translate to protocol frames, some are purely local.</li>
<li>Unknown commands produce a readable local error, never a silent failure.</li>
<li>Client-local commands must not require server support, so that any conforming server works with the full client command set.</li>
<li>Third-party extensions may register additional commands through the client's extension points where the design allows it.</li>
</ul>
<div class="note note-plain"><p>Command names are not frozen. The set above is the smallest list that covers connecting, joining, talking, inspecting and leaving; anything added later has to justify itself against that bar.</p></div>`},
      fa:{title:"فرمان‌ها",body:
`<p class="lede">فرمان‌ها از قرارداد IRC پیروی می‌کنند: خطی که با اسلش شروع شود دستور به کارخواه یا سرور است و هر چیز دیگر یک پیام. همهٔ فرمان‌های اینجا <span class="badge b-plan">پیشنهادی</span> هستند.</p>
<div class="tablewrap">
<table>
<caption>مجموعهٔ فرمان‌های پیشنهادی</caption>
<thead><tr><th>فرمان</th><th>کارکرد</th><th>اجرا توسط</th></tr></thead>
<tbody>
<tr><td><code>/connect &lt;host&gt;</code></td><td>برقراری نشست با یک سرور</td><td>کارخواه</td></tr>
<tr><td><code>/nick &lt;name&gt;</code></td><td>تغییر نام نمایشی برای هویت کنونی</td><td>کارخواه ← سرور</td></tr>
<tr><td><code>/join &lt;#channel&gt;</code></td><td>پیوستن به کانال</td><td>سرور</td></tr>
<tr><td><code>/leave &lt;#channel&gt;</code></td><td>ترک کانال</td><td>سرور</td></tr>
<tr><td><code>/msg &lt;target&gt; &lt;text&gt;</code></td><td>ارسال به کانال یا هویت بدون تغییر زمینه</td><td>کارخواه ← سرور</td></tr>
<tr><td><code>/who &lt;target&gt;</code></td><td>فهرست شرکت‌کنندگان یا بررسی یک هویت</td><td>سرور</td></tr>
<tr><td><code>/status</code></td><td>نمایش اتصال، نسخهٔ پروتکل، قابلیت‌ها و هویت</td><td>کارخواه</td></tr>
<tr><td><code>/help [topic]</code></td><td>نمایش راهنمای فرمان‌ها داخل پایانه</td><td>کارخواه</td></tr>
<tr><td><code>/quit [reason]</code></td><td>بستن تمیز نشست</td><td>کارخواه ← سرور</td></tr>
</tbody>
</table>
</div>
<h3>قراردادها</h3>
<ul class="tick">
<li>فرمان‌ها پیش از رسیدن به سیم توسط کارخواه تجزیه می‌شوند؛ برخی به فریم پروتکل ترجمه می‌شوند و برخی کاملاً محلی‌اند.</li>
<li>فرمان ناشناخته خطای محلیِ خوانا تولید می‌کند، هرگز شکست بی‌صدا.</li>
<li>فرمان‌های محلیِ کارخواه نباید به پشتیبانی سرور نیاز داشته باشند تا هر سرور منطبقی با مجموعهٔ کامل فرمان‌های کارخواه کار کند.</li>
<li>افزونه‌های شخص ثالث می‌توانند در صورت اجازهٔ طراحی، فرمان‌های بیشتری را در نقاط گسترش کارخواه ثبت کنند.</li>
</ul>
<div class="note note-plain"><p>نام فرمان‌ها قطعی نشده است. مجموعهٔ بالا کوچک‌ترین فهرستی است که اتصال، پیوستن، گفتگو، بررسی و خروج را پوشش می‌دهد؛ هر افزودنیِ بعدی باید خود را در برابر همین معیار توجیه کند.</p></div>`}

    {
      id:"tags",slug:"tags",num:12,
      en:{title:"Tags &amp; Extensions",body:
`<p class="lede">Tags are the mechanism that lets the NYX ecosystem grow without the protocol growing. A tag is a short label attached to a participant or a message, describing what it appears to be.</p>
<div class="diagram" role="img" aria-label="Extension model: a small NYX core with optional participants and services attached at the edges, labelled bot, ai, bridge, service and system.">
<p class="diagram-title">Figure 3 · Extension model</p>
<div class="split" style="margin:0">
<div class="split-panel split-core">
<h4>NYX Core</h4>
<ul class="tree">
<li><span class="tag-name">messages</span></li>
<li><span class="tag-name">identities</span></li>
<li><span class="tag-name">sessions</span></li>
<li><span class="tag-name">channels</span></li>
<li><span class="tag-name">capabilities</span></li>
</ul>
</div>
<div class="split-panel split-edge">
<h4>Optional edges</h4>
<ul class="tree">
<li><span class="tag-name">@bot</span> <span class="tag-desc">— automated participant</span></li>
<li><span class="tag-name">@ai</span> <span class="tag-desc">— model-backed participant</span></li>
<li><span class="tag-name">@bridge</span> <span class="tag-desc">— relays to another network</span></li>
<li><span class="tag-name">@service</span> <span class="tag-desc">— server-side utility</span></li>
<li><span class="tag-name">@system</span> <span class="tag-desc">— server notices</span></li>
</ul>
</div>
</div>
</div>
<h3>What a tag is</h3>
<p>A tag is a declaration, not a permission. It lets a client render a bridge differently from a human, or filter automated participants out of a busy channel. It does not grant access, does not imply trust, and does not change how the server routes messages.</p>
<h3>Rules</h3>
<ul class="tick">
<li>Tags are optional. An implementation that ignores every tag is still conforming.</li>
<li>Unknown tags must be preserved where possible and never cause an error.</li>
<li>Tags are namespaced strings. The set above is illustrative, not reserved by the protocol.</li>
<li>Who may set a tag — the participant, the server or an administrator — is an open question.</li>
<li>A tag is a claim about nature, not proof of it. Clients must not make security decisions from tags alone.</li>
</ul>
<div class="note"><p><strong>Keep the protocol small. Put complexity at the edges.</strong> Bots, AI assistants, bridges to other networks, automation and specialised servers are all legitimate parts of a NYX ecosystem — as external programs that happen to speak the protocol, never as subsystems inside it.</p></div>`},
      fa:{title:"برچسب‌ها و افزونه‌ها",body:
`<p class="lede">برچسب‌ها سازوکاری هستند که به اکوسیستم NYX اجازه می‌دهند رشد کند بدون آنکه پروتکل رشد کند. برچسب یک نشان کوتاه است که به یک شرکت‌کننده یا پیام الصاق می‌شود و توصیف می‌کند آن چیز به نظر چیست.</p>
<div class="diagram" role="img" aria-label="مدل گسترش: یک هستهٔ کوچک NYX با شرکت‌کنندگان و سرویس‌های اختیاری که در لبه‌ها متصل شده‌اند و با bot، ai، bridge، service و system برچسب خورده‌اند.">
<p class="diagram-title">شکل ۳ · مدل گسترش</p>
<div class="split" style="margin:0">
<div class="split-panel split-core">
<h4>هستهٔ NYX</h4>
<ul class="tree">
<li><span class="tag-name">پیام‌ها</span></li>
<li><span class="tag-name">هویت‌ها</span></li>
<li><span class="tag-name">نشست‌ها</span></li>
<li><span class="tag-name">کانال‌ها</span></li>
<li><span class="tag-name">قابلیت‌ها</span></li>
</ul>
</div>
<div class="split-panel split-edge">
<h4>لبه‌های اختیاری</h4>
<ul class="tree">
<li><span class="tag-name">@bot</span> <span class="tag-desc">— شرکت‌کنندهٔ خودکار</span></li>
<li><span class="tag-name">@ai</span> <span class="tag-desc">— شرکت‌کنندهٔ مبتنی بر مدل</span></li>
<li><span class="tag-name">@bridge</span> <span class="tag-desc">— بازارسال به شبکه‌ای دیگر</span></li>
<li><span class="tag-name">@service</span> <span class="tag-desc">— ابزار سمت سرور</span></li>
<li><span class="tag-name">@system</span> <span class="tag-desc">— اطلاعیه‌های سرور</span></li>
</ul>
</div>
</div>
</div>
<h3>برچسب چیست</h3>
<p>برچسب یک اظهار است، نه یک مجوز. به کارخواه اجازه می‌دهد یک پل را متفاوت از یک انسان ترسیم کند یا شرکت‌کنندگان خودکار را از یک کانال شلوغ فیلتر کند. دسترسی نمی‌دهد، اعتماد ایجاد نمی‌کند و مسیر پیام‌ها را در سرور تغییر نمی‌دهد.</p>
<h3>قواعد</h3>
<ul class="tick">
<li>برچسب‌ها اختیاری‌اند. پیاده‌سازی‌ای که همهٔ برچسب‌ها را نادیده بگیرد همچنان منطبق است.</li>
<li>برچسب ناشناخته باید تا حد ممکن حفظ شود و هرگز موجب خطا نشود.</li>
<li>برچسب‌ها رشته‌های دارای فضای نام‌اند. مجموعهٔ بالا نمونه است، نه توسط پروتکل رزروشده.</li>
<li>اینکه چه کسی می‌تواند برچسب بگذارد — شرکت‌کننده، سرور یا مدیر — پرسشی باز است.</li>
<li>برچسب ادعایی دربارهٔ ماهیت است، نه اثبات آن. کارخواه‌ها نباید بر پایهٔ برچسب تنها تصمیم امنیتی بگیرند.</li>
</ul>
<div class="note"><p><strong>پروتکل را کوچک نگه دارید. پیچیدگی را در لبه‌ها بگذارید.</strong> ربات‌ها، دستیارهای هوش مصنوعی، پل‌ها به شبکه‌های دیگر، خودکارسازی و سرورهای تخصصی همه بخش‌های مشروعِ یک اکوسیستم NYX هستند — به شکل برنامه‌های بیرونی که اتفاقاً پروتکل را حرف می‌زنند، هرگز به شکل زیرسامانه‌هایی درون آن.</p></div>`}

    {
      id:"security",slug:"security",num:13,
      en:{title:"Security &amp; Privacy",body:
`<p class="lede">NYX is not secure today, because most of the mechanisms that would make it secure do not exist yet. This section states goals and status; it makes no guarantees.</p>
<div class="note note-warn"><p>Nothing in this document should be read as a claim that NYX provides confidentiality, anonymity, integrity or censorship resistance. Those properties require designed, implemented and reviewed mechanisms. NYX currently has none of them in finished form.</p></div>
<h3>Current status</h3>
<div class="tablewrap">
<table>
<caption>Security concerns and their state</caption>
<thead><tr><th>Concern</th><th>Intended approach</th><th>State</th></tr></thead>
<tbody>
<tr><td>Transport security</td><td>Encrypted transport between client and server, terminated at the server or at a reverse proxy in front of it</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td>Authentication</td><td>Credential-based, with the credential type configurable by the operator</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td>Identity persistence</td><td>Stable identity handle that survives reconnects; binding to cryptographic keys is undecided</td><td><span class="badge b-exp">Experimental</span></td></tr>
<tr><td>Message integrity</td><td>Per-message integrity value; scheme not selected</td><td><span class="badge b-fut">Future</span></td></tr>
<tr><td>Replay protection</td><td>Combination of session-scoped counters and timestamps; details undefined</td><td><span class="badge b-fut">Future</span></td></tr>
<tr><td>Session management</td><td>Explicit session identifiers, clean invalidation on disconnect, bounded session lifetime</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td>End-to-end encryption</td><td>None designed. Would be an optional capability so that it never becomes a barrier to a minimal server</td><td><span class="badge b-fut">Future</span></td></tr>
<tr><td>Key management</td><td>Unanswered. Storage, rotation, recovery and multi-device are all open</td><td><span class="badge b-fut">Future</span></td></tr>
<tr><td>Threat model</td><td>Not written. It must precede any cryptographic design work</td><td><span class="badge b-plan">Planned</span></td></tr>
</tbody>
</table>
</div>
<h3>Metadata, honestly</h3>
<p>In a client–server design the server necessarily observes who talks to whom, when, in which channels, and how much. That is true of NYX and of every comparable system. Transport encryption hides this from the network path; it does not hide it from the server operator. Any stronger claim would require end-to-end mechanisms that NYX does not have.</p>
<h3>Guidance, not guarantees</h3>
<ul class="tick">
<li>Operators should assume that everything sent to a server is readable by that server.</li>
<li>Servers should store the minimum needed and should document their retention policy to users.</li>
<li>Credentials should never live in a plain configuration file where an alternative exists.</li>
<li>Clients should surface connection security state visibly rather than assuming it.</li>
</ul>
<details class="tech">
<summary>Sketch of an intended threat model (unfinished)</summary>
<div class="tech-body">
<p>A first draft would separate at least these adversaries and these assets:</p>
<ul>
<li><strong>Network observer</strong> — addressed by transport security. <span class="badge b-plan">Planned</span></li>
<li><strong>Impersonating peer</strong> — addressed by authentication, and only partially without cryptographic identity binding. <span class="badge b-plan">Planned</span></li>
<li><strong>Compromised or malicious server</strong> — not addressed without end-to-end encryption. <span class="badge b-fut">Future</span></li>
<li><strong>Compromised client host</strong> — largely out of scope for a protocol; a local attacker with access to the running process has the plaintext.</li>
</ul>
<p>Assets: message content, credentials, the social graph of who is in which channel, and availability of the service. This list is a starting point for discussion, not a threat model.</p>
</div>
</details>`},
      fa:{title:"امنیت و حریم خصوصی",body:
`<p class="lede">NYX امروز امن نیست، چون بیشتر سازوکارهایی که آن را امن می‌کردند هنوز وجود ندارند. این بخش اهداف و وضعیت را می‌گوید؛ هیچ تضمینی نمی‌دهد.</p>
<div class="note note-warn"><p>هیچ بخش این سند نباید این‌گونه خوانده شود که NYX محرمانگی، گمنامی، تمامیت یا مقاومت در برابر سانسور فراهم می‌کند. این ویژگی‌ها به سازوکارهای طراحی‌شده، پیاده‌سازی‌شده و بازبینی‌شده نیاز دارند و NYX در حال حاضر هیچ‌کدام را به شکل کامل ندارد.</p></div>
<h3>وضعیت کنونی</h3>
<div class="tablewrap">
<table>
<caption>دغدغه‌های امنیتی و وضعیتشان</caption>
<thead><tr><th>دغدغه</th><th>رویکرد مورد نظر</th><th>وضعیت</th></tr></thead>
<tbody>
<tr><td>امنیت لایهٔ انتقال</td><td>انتقال رمزنگاری‌شده میان کارخواه و سرور، با پایان‌یافتن در سرور یا در یک پیشکارِ معکوس مقابل آن</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td>احراز هویت</td><td>مبتنی بر اعتبارنامه، با نوع اعتبارنامه که راهبر پیکربندی می‌کند</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td>ماندگاری هویت</td><td>نام هویتِ پایداری که پس از اتصال مجدد باقی بماند؛ گره خوردنش به کلیدهای رمزنگارانه تصمیم‌گرفته نشده</td><td><span class="badge b-exp">آزمایشی</span></td></tr>
<tr><td>تمامیت پیام</td><td>مقدارِ تمامیت برای هر پیام؛ طرح انتخاب نشده</td><td><span class="badge b-fut">آینده</span></td></tr>
<tr><td>محافظت در برابر بازپخش</td><td>ترکیبی از شمارنده‌های مقید به نشست و زمان‌نما؛ جزئیات تعریف‌نشده</td><td><span class="badge b-fut">آینده</span></td></tr>
<tr><td>مدیریت نشست</td><td>شناسهٔ نشستِ صریح، باطل‌سازی تمیز هنگام قطع، عمر کران‌دار نشست</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td>رمزنگاری سرتاسری</td><td>طراحی نشده. در صورت طراحی یک قابلیت اختیاری خواهد بود تا هرگز مانعِ داشتن یک سرور حداقلی نشود</td><td><span class="badge b-fut">آینده</span></td></tr>
<tr><td>مدیریت کلید</td><td>بی‌پاسخ. ذخیره‌سازی، چرخش، بازیابی و چنددستگاهی همه باز هستند</td><td><span class="badge b-fut">آینده</span></td></tr>
<tr><td>مدل تهدید</td><td>نوشته نشده. باید پیش از هر کار طراحی رمزنگارانه نوشته شود</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
</tbody>
</table>
</div>
<h3>فراداده، صادقانه</h3>
<p>در یک طراحی کارخواه–سرور، سرور ناگزیر می‌بیند که چه کسی با چه کسی، چه زمانی، در کدام کانال و چقدر حرف می‌زند. این دربارهٔ NYX و هر سامانهٔ مشابهی صادق است. رمزنگاری لایهٔ انتقال این اطلاعات را از مسیر شبکه پنهان می‌کند، اما از راهبر سرور پنهان نمی‌کند. هر ادعای قوی‌تر به سازوکارهای سرتاسری نیاز دارد که NYX ندارد.</p>
<h3>راهنمایی، نه تضمین</h3>
<ul class="tick">
<li>راهبران باید فرض کنند هرچه به سرور فرستاده می‌شود برای همان سرور خواناست.</li>
<li>سرورها باید کمینهٔ لازم را ذخیره کنند و سیاست نگهداری داده را به کاربران اعلام کنند.</li>
<li>اعتبارنامه‌ها هرگز نباید در فایل پیکربندی ساده باشند، وقتی جایگزینی وجود دارد.</li>
<li>کارخواه‌ها باید وضعیت امنیت اتصال را آشکار نشان دهند نه اینکه آن را فرض کنند.</li>
</ul>
<details class="tech">
<summary>طرحی از مدل تهدیدِ مورد نظر (نا‌تمام)</summary>
<div class="tech-body">
<p>یک پیش‌نویس نخست دست‌کم این خصم‌ها و این دارایی‌ها را جدا می‌کند:</p>
<ul>
<li><strong>ناظر شبکه</strong> — با امنیت لایهٔ انتقال پوشش داده می‌شود. <span class="badge b-plan">برنامه‌ریزی‌شده</span></li>
<li><strong>همتای جعلی</strong> — با احراز هویت پوشش داده می‌شود و بدون گره خوردن هویت به رمزنگاری تنها تا حدی. <span class="badge b-plan">برنامه‌ریزی‌شده</span></li>
<li><strong>سرورِ به‌خطر افتاده یا بدخواه</strong> — بدون رمزنگاری سرتاسری پوشش داده نمی‌شود. <span class="badge b-fut">آینده</span></li>
<li><strong>میزبانِ کارخواهِ به‌خطر افتاده</strong> — تا حد زیادی بیرون از دامنهٔ یک پروتکل است؛ خصم محلی با دسترسی به فرایندِ در حال اجرا، متن ساده را در اختیار دارد.</li>
</ul>
<p>دارایی‌ها: محتوای پیام، اعتبارنامه‌ها، گراف اجتماعیِ اینکه چه کسی در کدام کانال است، و دسترس‌پذیری سرویس. این فهرست نقطهٔ شروع بحث است، نه یک مدل تهدید.</p>
</div>
</details>`}

    {
      id:"storage",slug:"storage",num:14,
      en:{title:"Storage",body:
`<p class="lede">The protocol does not require a database. Storage is a server implementation concern, chosen by whoever operates the server.</p>
<h3>Protocol requirements versus implementation choices</h3>
<div class="tablewrap">
<table>
<thead><tr><th>Requirement</th><th>Kind</th><th>Explanation</th></tr></thead>
<tbody>
<tr><td>Acknowledgement of accepted messages</td><td>Protocol</td><td>A client must be able to tell whether the server took responsibility for a message</td></tr>
<tr><td>Stable identifiers</td><td>Protocol</td><td>Whatever identifies a message must remain valid for the period the server promises</td></tr>
<tr><td>History retrieval</td><td>Capability</td><td>Declared at handshake. A server without it is still conforming</td></tr>
<tr><td>Backend engine</td><td>Implementation</td><td>SQLite, PostgreSQL, MySQL/MariaDB, flat files, or something else entirely</td></tr>
<tr><td>Retention period</td><td>Operator policy</td><td>Not a protocol matter; should be documented for users</td></tr>
<tr><td>Schema and indexing</td><td>Implementation</td><td>Invisible to clients by design</td></tr>
</tbody>
</table>
</div>
<h3>Client-side storage</h3>
<p>The Rust client keeps a local cache of message history and unread state so that restarting does not require re-downloading everything the server holds. The cache is local, per-user, and is not part of the protocol. Its format is a client implementation detail.</p>
<div class="note note-plain"><p>A minimal server can be conforming with no persistence at all: route what arrives, keep membership in memory, keep nothing after disconnect. That is a legitimate deployment, and the protocol must not quietly assume otherwise.</p></div>`},
      fa:{title:"ذخیره‌سازی",body:
`<p class="lede">پروتکل پایگاه داده الزام نمی‌کند. ذخیره‌سازی دغدغهٔ پیاده‌سازی سرور است و به انتخاب کسی است که سرور را راه‌اندازی می‌کند.</p>
<h3>الزامات پروتکل در برابر انتخاب‌های پیاده‌سازی</h3>
<div class="tablewrap">
<table>
<thead><tr><th>الزام</th><th>نوع</th><th>توضیح</th></tr></thead>
<tbody>
<tr><td>تأیید پیام‌های پذیرفته‌شده</td><td>پروتکل</td><td>کارخواه باید بتواند بفهمد سرور مسئولیت پیام را پذیرفته است یا نه</td></tr>
<tr><td>شناسه‌های پایدار</td><td>پروتکل</td><td>هرچه پیام را شناسایی می‌کند باید در مدت زمانی که سرور وعده داده معتبر بماند</td></tr>
<tr><td>بازیابی تاریخچه</td><td>قابلیت</td><td>در دست‌دادن اعلام می‌شود. سرورِ بدون آن هم منطبق است</td></tr>
<tr><td>موتور بک‌اند</td><td>پیاده‌سازی</td><td>SQLite، PostgreSQL، MySQL/MariaDB، فایل ساده، یا چیزی کاملاً متفاوت</td></tr>
<tr><td>مدت نگهداری داده</td><td>سیاست راهبر</td><td>مسئلهٔ پروتکل نیست؛ باید برای کاربران مستند شود</td></tr>
<tr><td>طرحواره و نمایه‌گذاری</td><td>پیاده‌سازی</td><td>به‌طور عمدی برای کارخواه‌ها نامرئی است</td></tr>
</tbody>
</table>
</div>
<h3>ذخیره‌سازی سمت کارخواه</h3>
<p>کارخواه Rust حافظهٔ نهان محلی از تاریخچهٔ پیام‌ها و وضعیت نخوانده‌ها نگه می‌دارد تا راه‌اندازی مجدد نیازمند دریافت دوبارهٔ همهٔ داده‌های سرور نباشد. این حافظهٔ نهان محلی و کاربرمحور است و بخشی از پروتکل نیست؛ قالب آن جزئیات پیاده‌سازی کارخواه است.</p>
<div class="note note-plain"><p>یک سرور حداقلی می‌تواند بدون هیچ ماندگاری منطبق باشد: آنچه می‌رسد را مسیریابی کن، عضویت را در حافظه نگه دار، پس از قطع اتصال هیچ نگه ندار. این یک استقرار مشروع است و پروتکل نباید بی‌صدا خلاف آن را فرض کند.</p></div>`}
    },
    {
      id:"interop",slug:"interoperability",num:15,
      en:{title:"Interoperability",body:
`<p class="lede">Interoperability is the reason NYX exists as a protocol rather than as an application. If a second implementation is impractical, the project has failed its own premise.</p>
<h3>Conformance levels (proposed)</h3>
<div class="tablewrap">
<table>
<thead><tr><th>Level</th><th>Requires</th><th>State</th></tr></thead>
<tbody>
<tr><td>Minimal</td><td>Handshake, version agreement, authentication, join and leave one channel, send and receive messages, acknowledgement, clean disconnect</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td>Standard</td><td>Minimal plus direct conversations, history retrieval, capability declaration, documented error reporting</td><td><span class="badge b-plan">Planned</span></td></tr>
<tr><td>Extended</td><td>Standard plus tags, optional transport security features, session resume</td><td><span class="badge b-exp">Experimental</span></td></tr>
</tbody>
</table>
</div>
<h3>How compatibility gets proven</h3>
<ul class="tick">
<li><strong>Test vectors.</strong> Recorded exchanges with expected responses, independent of any implementation language.</li>
<li><strong>A conformance harness.</strong> A tool that drives a server through the vectors and reports pass or fail per requirement.</li>
<li><strong>At least two independent implementations.</strong> The reference server and one written in a different language by a different author. One implementation cannot prove interoperability.</li>
</ul>
<h3>Writing a compatible server</h3>
<ol>
<li>Read the protocol specification and the entity model.</li>
<li>Implement the minimal conformance level against the test vectors.</li>
<li>Run the conformance harness until it passes.</li>
<li>Connect the official Rust client and verify that the interface behaves normally.</li>
<li>Declare the capabilities the server actually supports, and nothing else.</li>
</ol>
<p>None of this tooling exists yet. It is scheduled in <span class="badge b-plan">Phase 4</span>, and until it does, interoperability claims are intentions rather than facts.</p>`},
      fa:{title:"تعامل‌پذیری",body:
`<p class="lede">تعامل‌پذیری دلیلِ وجودِ NYX به شکل پروتکل است نه به شکل یک اپلیکیشن. اگر پیاده‌سازی دوم ناممکن باشد، پروژه در همان فرض اولیهٔ خود شکست خورده است.</p>
<h3>سطوح انطباق (پیشنهادی)</h3>
<div class="tablewrap">
<table>
<thead><tr><th>سطح</th><th>نیازمند</th><th>وضعیت</th></tr></thead>
<tbody>
<tr><td>حداقلی</td><td>دست‌دادن، توافق نسخه، احراز هویت، پیوستن و ترک یک کانال، ارسال و دریافت پیام، تأیید، قطع تمیز</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td>استاندارد</td><td>حداقلی به‌علاوهٔ گفتگوی مستقیم، بازیابی تاریخچه، اعلام قابلیت، گزارش خطای مستند</td><td><span class="badge b-plan">برنامه‌ریزی‌شده</span></td></tr>
<tr><td>گسترده</td><td>استاندارد به‌علاوهٔ برچسب‌ها، ویژگی‌های اختیاری امنیت انتقال، ازسرگیری نشست</td><td><span class="badge b-exp">آزمایشی</span></td></tr>
</tbody>
</table>
</div>
<h3>سازگاری چگونه اثبات می‌شود</h3>
<ul class="tick">
<li><strong>بردارهای آزمون.</strong> تبادلات ثبت‌شده با پاسخ‌های مورد انتظار، مستقل از زبان پیاده‌سازی.</li>
<li><strong>ابزار سنجش انطباق.</strong> ابزاری که سرور را از میان بردارها می‌گذراند و به تفکیک هر الزام، قبولی یا رد را گزارش می‌کند.</li>
<li><strong>دست‌کم دو پیاده‌سازی مستقل.</strong> سرور مرجع و یکی نوشته‌شده به زبانی دیگر توسط نویسنده‌ای دیگر. با یک پیاده‌سازی نمی‌توان تعامل‌پذیری را اثبات کرد.</li>
</ul>
<h3>نوشتن یک سرور سازگار</h3>
<ol>
<li>مشخصات پروتکل و مدل موجودیت‌ها را بخوانید.</li>
<li>سطح حداقلی انطباق را بر پایهٔ بردارهای آزمون پیاده‌سازی کنید.</li>
<li>ابزار سنجش انطباق را تا پاس شدن اجرا کنید.</li>
<li>کارخواه رسمی Rust را وصل کنید و بررسی کنید رابط رفتاری عادی دارد.</li>
<li>قابلیت‌هایی را اعلام کنید که سرور واقعاً پشتیبانی می‌کند، و نه بیشتر.</li>
</ol>
<p>هیچ‌کدام از این ابزارها هنوز وجود ندارند. در <span class="badge b-plan">فاز ۴</span> زمان‌بندی شده‌اند و تا آن زمان، ادعای تعامل‌پذیری نیت است نه واقعیت.</p>`}

    {
      id:"roadmap",slug:"roadmap",num:16,
      en:{title:"Roadmap",body:
`<p class="lede">Eight phases, ordered by dependency. There are no dates: the project has one contributor-facing timeline and it moves when the work moves.</p>
<ol class="timeline">
<li class="now"><span class="phase-mark">0</span><div class="phase-body"><h3>Foundation <span class="badge b-plan">In progress</span></h3><ul><li>Define project scope and non-goals</li><li>Write down protocol principles</li><li>Establish the repository structure</li><li>Fix the basic entity model</li></ul></div></li>
<li><span class="phase-mark">1</span><div class="phase-body"><h3>Protocol <span class="badge b-plan">Planned</span></h3><ul><li>Message model and identifiers</li><li>Authentication model</li><li>Connection lifecycle and error semantics</li><li>Capability and tag model</li><li>Version negotiation</li></ul></div></li>
<li><span class="phase-mark">2</span><div class="phase-body"><h3>Rust client <span class="badge b-plan">Planned</span></h3><ul><li>Networking layer</li><li>Terminal interface</li><li>Local configuration and credentials</li><li>Session handling and reconnection</li><li>Local message history</li></ul></div></li>
<li><span class="phase-mark">3</span><div class="phase-body"><h3>Reference server <span class="badge b-plan">Planned</span></h3><ul><li>Minimal conforming server</li><li>Authentication</li><li>Channels and conversations</li><li>Persistence</li><li>Protocol test vectors</li></ul></div></li>
<li><span class="phase-mark">4</span><div class="phase-body"><h3>Interoperability <span class="badge b-plan">Planned</span></h3><ul><li>Example server in Python</li><li>Example server in JavaScript or TypeScript</li><li>Example server in PHP</li><li>Conformance harness and compatibility testing</li></ul></div></li>

      id:"status",slug:"status",num:17,
      en:{title:"Project Status",body:
`<p class="lede">An honest snapshot. Nothing here implies more progress than has actually happened.</p>
<div class="cards cards-2">
<article class="card card-accent"><span class="card-tag">Defined</span><h3>Settled direction</h3>
<ul class="tick"><li>Project scope and non-goals</li><li>Rust as the official client language</li><li>Language-independent server protocol</li><li>Terminal-first philosophy</li><li>Lightweight, single-server architecture</li><li>Core entity model</li></ul></article>
<article class="card card-info"><span class="card-tag">Planned</span><h3>Scoped, not built</h3>
<ul class="tick"><li>Protocol specification</li><li>Reference server</li><li>Rust client implementation</li><li>Interoperability test suite</li><li>Security model and threat model</li><li>Command set finalisation</li></ul></article>
<article class="card card-warn"><span class="card-tag">Experimental</span><h3>Being tried</h3>
<ul class="tick"><li>Optional tags</li><li>Bridges to other networks</li><li>Bots and automated participants</li><li>External services attached through capabilities</li></ul></article>
<article class="card card-fut"><span class="card-tag">Future</span><h3>Out of scope now</h3>
<ul class="tick"><li>Advanced encryption and key management</li><li>Federation between servers</li><li>AI-related integrations</li><li>Decentralised mechanisms</li><li>Richer media handling</li></ul></article>
</div>
<h3>Versioning</h3>
<p>NYX uses plain version numbers for both the project and the protocol, and they are tracked separately. A project release says what the software does; a protocol version says what a peer may send. The protocol version is negotiated at handshake so that an older client and a newer server can still talk.</p>
<p>Earlier experiments in the project history were published between <code>v0.0.1</code> and <code>v0.1.0</code>. Those releases are historical. They do not define the architecture described here; this document is a reduction and restart based on what those versions taught.</p>`},

<ul class="tick"><li>رمزنگاری پیشرفته و مدیریت کلید</li><li>فدراسیون میان سرورها</li><li>یکپارچه‌سازی‌های مربوط به هوش مصنوعی</li><li>سازوکارهای تمرکززدا</li><li>پردازش غنی‌تر رسانه</li></ul></article>
</div>
<h3>نسخه‌گذاری</h3>
<p>NYX برای پروژه و برای پروتکل از شمارهٔ نسخهٔ ساده استفاده می‌کند و این دو جدا نگه داشته می‌شوند. نسخهٔ پروژه می‌گوید نرم‌افزار چه می‌کند؛ نسخهٔ پروتکل می‌گوید یک همتا چه چیزی می‌تواند بفرستد. نسخهٔ پروتکل در دست‌دادن مذاکره می‌شود تا کارخواه قدیمی‌تر و سرور جدیدتر همچنان بتوانند حرف بزنند.</p>
<p>آزمایش‌های پیشینِ تاریخ پروژه میان <code>v0.0.1</code> و <code>v0.1.0</code> منتشر شدند. آن انتشارها تاریخی‌اند و معماری توصیف‌شده در اینجا را تعریف نمی‌کنند؛ این سند یک کاهش و شروع دوباره بر پایهٔ آنچه آن نسخه‌ها آموختند است.</p>`}

    {
      id:"non-goals",slug:"non-goals",num:18,
      en:{title:"Non-Goals",body:
`<p class="lede">This list is as important as the feature list. Each exclusion is intentional and each one buys simplicity somewhere else.</p>
<div class="tablewrap">
<table>
<thead><tr><th>NYX is not trying to be</th><th>Why it is excluded</th></tr></thead>
<tbody>
<tr><td>A Telegram or WhatsApp replacement</td><td>Consumer messengers compete on reach, media and mobile polish. NYX competes on size and implementability.</td></tr>
<tr><td>A social network</td><td>No feeds, no follows, no public discovery. Conversations and channels only.</td></tr>
<tr><td>A blockchain or cryptocurrency</td><td>Consensus machinery contradicts every design rule in section 4 and adds nothing to sending a message.</td></tr>
<tr><td>An AI platform</td><td>AI participants are possible through tags and external programs. No model, inference or agent subsystem belongs in the core.</td></tr>
<tr><td>A decentralised internet</td><td>Distributed routing, naming and trust are enormous problems. NYX is a client–server protocol.</td></tr>
<tr><td>An enterprise messaging platform</td><td>No administration consoles, compliance tooling, directory integration or multi-tenancy in the core.</td></tr>
<tr><td>A feature-maximal graphical messenger</td><td>Rich media, reactions, threads, stories and calls would each multiply the work of every implementer.</td></tr>
<tr><td>A proprietary closed protocol</td><td>The specification is the deliverable. A protocol nobody else may implement is not a protocol.</td></tr>
<tr><td>A reputation or identity economy</td><td>Trust scoring and identity markets introduce incentives that have no place in a message transport.</td></tr>
<tr><td>A microservice architecture</td><td>One server process per deployment is enough. Splitting it up would only make small deployments harder.</td></tr>
</tbody>
</table>
</div>
<div class="note"><p>Keeping the core small is what makes experimentation cheap. Anything on this list can still be built by someone else, on top of the protocol, without NYX changing.</p></div>`},
      fa:{title:"غیراهداف",body:
`<p class="lede">این فهرست به اندازهٔ فهرست ویژگی‌ها مهم است. هر استثنا عمدی است و هرکدام در جایی دیگر سادگی می‌خرد.</p>
<div class="tablewrap">
<table>
<thead><tr><th>NYX در پیِ آن نیست که باشد</th><th>چرا کنار گذاشته شده</th></tr></thead>
<tbody>
<tr><td>جایگزین Telegram یا WhatsApp</td><td>پیام‌رسان‌های مصرف‌کننده روی دسترسی، رسانه و پرداختگی موبایل رقابت می‌کنند. NYX روی کوچکی و قابلیت پیاده‌سازی رقابت می‌کند.</td></tr>
<tr><td>شبکهٔ اجتماعی</td><td>بدون خوراک، بدون دنبال‌کردن، بدون کشف عمومی. تنها گفتگو و کانال.</td></tr>
<tr><td>بلاک‌چین یا رمزارز</td><td>سازوکار اجماع با همهٔ قواعد طراحی بخش ۴ در تضاد است و هیچ چیز به فرستادن یک پیام اضافه نمی‌کند.</td></tr>
<tr><td>سکوی هوش مصنوعی</td><td>شرکت‌کنندگان هوش مصنوعی از راه برچسب‌ها و برنامه‌های بیرونی ممکن‌اند. هیچ زیرسامانهٔ مدل، استنتاج یا عاملی در هسته جای ندارد.</td></tr>
<tr><td>اینترنت تمرکززدا</td><td>مسیریابی، نام‌گذاری و اعتماد توزیع‌شده مسئله‌هایی عظیم‌اند. NYX یک پروتکل کارخواه–سرور است.</td></tr>
<tr><td>سکوی پیام‌رسانی سازمانی</td><td>میز مدیریت، ابزار انطباق، یکپارچه‌سازی با فهرست سازمانی و چندمستأجری در هسته نیست.</td></tr>
<tr><td>پیام‌رسان گرافیکیِ حداکثری</td><td>رسانهٔ غنی، واکنش‌ها، رشته‌ها، استوری و تماس، هرکدام کار هر پیاده‌ساز را چند برابر می‌کنند.</td></tr>
<tr><td>پروتکل اختصاصی و بسته</td><td>مشخصات، خودِ خروجی است. پروتکلی که دیگری نتواند پیاده‌اش کند، پروتکل نیست.</td></tr>
<tr><td>اقتصاد اعتبار یا هویت</td><td>امتیازدهی اعتماد و بازارهای هویت انگیزه‌هایی ایجاد می‌کنند که در یک انتقال پیام جایی ندارند.</td></tr>
<tr><td>معماری میکروسرویس</td><td>یک فرایند سرور برای هر استقرار کافی است. تکه‌تکه کردن آن تنها استقرارهای کوچک را سخت‌تر می‌کند.</td></tr>
</tbody>
</table>
</div>
<div class="note"><p>کوچک نگه داشتن هسته همان چیزی است که آزمایش کردن را ارزان می‌کند. هر مورد این فهرست را هنوز می‌توان روی پروتکل ساخت، بدون اینکه NYX تغییر کند.</p></div>`}

      en:{title:"Open Questions",body:
`<p class="lede">These are unanswered on purpose. Recording them is part of the work; inventing confident answers is not.</p>
<div class="q-group"><h4>Protocol</h4>
<ul class="tick">
<li>What is the exact wire format, and what are the framing and size limits?</li>
<li>How is the protocol version negotiated when the client and server support overlapping but different sets?</li>
<li>How does capability negotiation handle a capability that is mandatory for one side only?</li>
<li>What are the message ordering guarantees, and what happens to order across a reconnect?</li>
<li>Who assigns message identifiers — client, server, or both with a collision rule?</li>
</ul></div>
<div class="q-group"><h4>Identity and authentication</h4>
<ul class="tick">
<li>What authentication mechanisms are in scope for the minimal level?</li>
<li>How is an identity persisted and recovered if the credential is lost?</li>
<li>Can one account hold several identities, and does the protocol need to know?</li>
<li>How are nickname changes and identity changes distinguished?</li>
</ul></div>
<div class="q-group"><h4>Security</h4>
<ul class="tick">
<li>What does the threat model actually say, and what is explicitly out of scope?</li>
<li>If end-to-end encryption is ever added, how does it stay optional without creating two incompatible protocols?</li>
<li>How is key management handled on a machine with no secure key storage?</li>
<li>What integrity and replay protections are cheap enough to be mandatory?</li>
</ul></div>
<div class="q-group"><h4>Servers and storage</h4>
<ul class="tick">
<li>What must a server persist to be conforming, if anything?</li>
<li>How is offline message delivery handled, and for how long?</li>
<li>What are the minimum retention and deletion obligations of a conforming server?</li>
<li>How should rate limiting and spam mitigation be expressed so that implementations stay comparable?</li>
</ul></div>
<div class="q-group"><h4>Ecosystem</h4>
<ul class="tick">
<li>What shape should the interoperability test suite take so that it is language-neutral?</li>
<li>How should tags be assigned, and who is allowed to assign them?</li>
<li>What license should the specification and the reference implementations use?</li>
</ul></div>`},

      id:"future",slug:"future",num:20,
      en:{title:"Future Possibilities",body:
`<p class="lede">Everything in this section is <span class="badge b-fut">Future</span>. None of it is committed, none of it is designed, and none of it should be read as a promise.</p>
<div class="cards cards-2">
<article class="card card-fut"><h3>Federation between servers</h3><p>Possible only after the single-server protocol is stable. It would need routing, identity namespacing and trust decisions that do not exist yet.</p></article>
<article class="card card-fut"><h3>End-to-end encryption</h3><p>Would have to be an optional capability so that a minimal server remains conforming. No scheme has been chosen.</p></article>
<article class="card card-fut"><h3>Bridges</h3><p>External programs connecting NYX to IRC, email or other networks. They are ordinary clients with a tag, not a protocol feature.</p></article>
<article class="card card-fut"><h3>Automation and bots</h3><p>Notification bots, CI reporters, assistants. All are external participants speaking the same protocol.</p></article>
<article class="card card-fut"><h3>Alternative clients</h3><p>A graphical client, a web client or a mobile client could exist without changing the protocol, if someone wants to build one.</p></article>
<article class="card card-fut"><h3>Richer message content</h3><p>Formatting, attachments or structured payloads. Each would need a capability and each would raise the cost of implementation.</p></article>
</div>
<div class="note note-warn"><p>These are recorded so that today's design does not accidentally block them. They are not on any roadmap with an owner or a date.</p></div>`},

      id:"contributing",slug:"contributing",num:21,
      en:{title:"Contributing &amp; Ecosystem",body:
`<p class="lede">NYX is early enough that the most useful contribution is argument, not code. The second most useful is a second implementation.</p>
<h3>Where help actually matters now</h3>
<ul class="tick">
<li><strong>Protocol review.</strong> Pointing out where the entity model is ambiguous or where a decision would block a second implementation.</li>
<li><strong>Specification writing.</strong> Turning this whitepaper into normative text with examples and error tables.</li>
<li><strong>Test vectors and a conformance harness.</strong> Language-neutral fixtures that any server can be checked against.</li>
<li><strong>Reference server work.</strong> A minimal implementation whose only job is to be correct.</li>
<li><strong>Rust client work.</strong> Terminal rendering, input handling and the protocol layer.</li>
<li><strong>Documentation and translation.</strong> This document is bilingual; keeping both halves accurate is ongoing work.</li>
</ul>
<h3>Ecosystem participants</h3>
<p>The ecosystem is made of programs, not subsystems. A bot, a bridge, a notification service or a specialised server is an external program that connects like any client and may carry a tag. Nothing about it needs to be merged into NYX for it to exist.</p>
<h3>Practical notes</h3>
<ul class="tick">
<li>Repository layout, contribution process and issue workflow are being established in Phase 0.</li>
<li>Licensing is undecided. The intent is a permissive license for both specification and reference implementations; the choice is an open question.</li>
<li>Proposals should be small. A change that can be described in a page is more likely to land than one that cannot.</li>
</ul>`},
      fa:{title:"مشارکت و اکوسیستم",body:
`<p class="lede">NYX آن‌قدر در ابتدای راه است که مفیدترین مشارکت، استدلال است نه کد. دومین مشارکت مفید، یک پیاده‌سازی دوم است.</p>
<h3>کمک الان واقعاً کجا به کار می‌آید</h3>
<ul class="tick">
<li><strong>بازبینی پروتکل.</strong> نشان دادن اینکه کجای مدل موجودیت‌ها مبهم است یا کجا یک تصمیم راه پیاده‌سازی دوم را می‌بندد.</li>
<li><strong>نوشتن مشخصات.</strong> تبدیل این سپیدنامه به متن هنجاری با نمونه‌ها و جدول خطاها.</li>
<li><strong>بردارهای آزمون و ابزار سنجش انطباق.</strong> نمونه‌های ثابتِ خنثی نسبت به زبان که هر سروری با آن‌ها سنجیده شود.</li>
<li><strong>کار روی سرور مرجع.</strong> یک پیاده‌سازی حداقلی که تنها وظیفه‌اش درست بودن است.</li>
<li><strong>کار روی کارخواه Rust.</strong> ترسیم پایانه، مدیریت ورودی و لایهٔ پروتکل.</li>
<li><strong>مستندسازی و ترجمه.</strong> این سند دوزبانه است؛ درست نگه داشتن هر دو نیمه کاری پیوسته است.</li>
</ul>
<h3>شرکت‌کنندگان اکوسیستم</h3>
<p>اکوسیستم از برنامه‌ها ساخته می‌شود، نه زیرسامانه‌ها. یک ربات، یک پل، یک سرویس اطلاع‌رسانی یا یک سرور تخصصی، برنامه‌ای بیرونی است که مانند هر کارخواهی متصل می‌شود و می‌تواند برچسب داشته باشد. برای وجود داشتن، هیچ بخشی از آن لازم نیست در NYX ادغام شود.</p>
<h3>یادداشت‌های عملی</h3>
<ul class="tick">
<li>چیدمان مخزن، فرایند مشارکت و گردش کار مسئله‌ها در فاز ۰ در حال برپاسازی است.</li>
<li>مجوز تعیین نشده است. قصد، مجوزی آزاد برای هم مشخصات و هم پیاده‌سازی‌های مرجع است؛ این انتخاب یک پرسش باز است.</li>
<li>پیشنهادهای مشارکت باید کوچک باشند. تغییری که در یک صفحه قابل توصیف باشد، بیشتر از تغییری که نیست پذیرفته می‌شود.</li>
</ul>`}

      id:"conclusion",slug:"conclusion",num:22,
      en:{title:"Conclusion",body:
`<p class="lede">NYX is a small open protocol, a terminal client written in Rust, and the expectation that anyone can write a compatible server in the language they already use.</p>
<p>The project makes few claims. It does not claim to be secure, private, anonymous, federated or widely used, because those claims would require mechanisms that do not exist yet. What it does claim is narrower and achievable: that a communication protocol can still be small enough for one person to hold in their head, that a terminal interface can be the primary experience rather than a fallback, and that a specification can be written so that implementations do not have to imitate each other.</p>
<p>Most of the work ahead is subtraction. Every subsystem that was dropped from earlier experiments — distribution, reputation, built-in intelligence, token economies — was dropped because it made the core harder to implement and harder to trust. What remains is a message model, a connection lifecycle, a set of identities and channels, and a label system for everything else.</p>
<div class="note"><p>Small core. Open protocol. Terminal first. Language independent. Extensible at the edges.</p></div>
<p>If the protocol ends up readable, the client ends up fast, and one independent server ends up passing the same conformance tests as the reference, NYX will have met the standard this document sets. Everything beyond that is optional.</p>`},

<p>پروژه ادعای کمی دارد. ادعا نمی‌کند امن، خصوصی، گمنام، فدره یا پرکاربرد است، چون این ادعاها به سازوکارهایی نیاز دارند که هنوز وجود ندارند. آنچه ادعا می‌کند باریک‌تر و دست‌یافتنی است: اینکه یک پروتکل ارتباطی هنوز می‌تواند آن‌قدر کوچک باشد که یک نفر در ذهنش جا شود، اینکه رابط پایانه می‌تواند تجربهٔ اصلی باشد نه راهِ چارهٔ جایگزین، و اینکه مشخصات را می‌توان چنان نوشت که پیاده‌سازی‌ها ناچار به تقلید از هم نباشند.</p>
<p>بیشترِ کارِ پیش رو کاستن است. هر زیرسامانه‌ای که از آزمایش‌های پیشین کنار گذاشته شد — توزیع، اعتبار، هوش داخلی، اقتصادهای ژتونی — به این دلیل کنار گذاشته شد که پیاده‌سازی هسته را سخت‌تر و اعتماد به آن را دشوارتر می‌کرد. آنچه مانده یک مدل پیام، یک چرخهٔ عمر اتصال، مجموعه‌ای از هویت‌ها و کانال‌ها، و یک سامانهٔ برچسب برای هر چیز دیگر است.</p>

  lang: store.get("nyx.wp.lang","en"),
  theme: store.get("nyx.wp.theme","dark"),
  fs: parseInt(store.get("nyx.wp.fs","16"),10),
  lh: parseFloat(store.get("nyx.wp.lh","1.72")),
  rw: parseInt(store.get("nyx.wp.rw","76"),10)
};
if(state.lang !== "fa"){ state.lang = "en"; }
if(["dark","light","reading"].indexOf(state.theme) === -1){ state.theme = "dark"; }
if(isNaN(state.fs) || state.fs < 14 || state.fs > 21){ state.fs = 16; }
if(isNaN(state.lh) || state.lh < 1.4 || state.lh > 2.1){ state.lh = 1.72; }
if(isNaN(state.rw) || state.rw < 52 || state.rw > 104){ state.rw = 76; }

var docEl = document.getElementById("doc");
var tocEl = document.getElementById("toc");
var sideNote = document.getElementById("sideNote");
var printHead = document.getElementById("printHead");
var progressEl = document.getElementById("progress");
var sidebar = document.getElementById("sidebar");
var backdrop = document.getElementById("backdrop");
var navToggle = document.getElementById("navToggle");
var settingsBtn = document.getElementById("settingsBtn");
var settingsPop = document.getElementById("settingsPop");
var fsRange = document.getElementById("fsRange");
var lhRange = document.getElementById("lhRange");
var rwRange = document.getElementById("rwRange");
var fsOut = document.getElementById("fsOut");
var lhOut = document.getElementById("lhOut");
var rwOut = document.getElementById("rwOut");
var descMeta = document.querySelector('meta[name="description"]');
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
var observer = null;

function t(){ return NYX_DATA.ui[state.lang]; }

function esc(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function pad2(value){
  return value < 10 ? "0" + value : String(value);
}

function applyTypography(){
  root.style.setProperty("--fs", state.fs + "px");
  root.style.setProperty("--lh", String(state.lh));
  root.style.setProperty("--rw", state.rw + "ch");
  fsRange.value = String(state.fs);
  lhRange.value = String(state.lh);
  rwRange.value = String(state.rw);
  fsOut.textContent = state.fs + "px";
  lhOut.textContent = state.lh.toFixed(2);
  rwOut.textContent = state.rw + "ch";
}

function applyTheme(){
  root.setAttribute("data-theme", state.theme);
  var buttons = document.querySelectorAll("[data-theme-btn]");
  for(var i = 0; i < buttons.length; i++){
    buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-theme-btn") === state.theme ? "true" : "false");
  }
}

function applyStaticLabels(){
  var ui = t();
  var nodes = document.querySelectorAll("[data-ui]");
  for(var i = 0; i < nodes.length; i++){
    var key = nodes[i].getAttribute("data-ui");
    if(ui[key] !== undefined){ nodes[i].textContent = ui[key]; }
  }
  var ariaNodes = document.querySelectorAll("[data-ui-aria]");
  for(var j = 0; j < ariaNodes.length; j++){
    var akey = ariaNodes[j].getAttribute("data-ui-aria");
    if(ui[akey] !== undefined){ ariaNodes[j].setAttribute("aria-label", ui[akey]); }
  }
  document.getElementById("settingsPop").setAttribute("aria-label", ui.settings);
  document.getElementById("langSwitch").setAttribute("aria-label", ui.settings);
  sidebar.setAttribute("aria-label", ui.tocTitle);
  sideNote.textContent = ui.sideNote;
  printHead.textContent = ui.printTitle;
  document.querySelectorAll("[data-lang-btn]").forEach(function(btn){
    btn.setAttribute("aria-pressed", btn.getAttribute("data-lang-btn") === state.lang ? "true" : "false");
  });
}

function sectionMarkup(section){
  var data = section[state.lang];
  var kicker = section.cover
    ? (state.lang === "fa" ? "سپیدنامه · پیش‌نویس" : "Whitepaper · Draft")
    : pad2(section.num) + " · " + section.slug.replace(/-/g," ");
  var title = section.cover ? "" : '<h2>' + data.title + '</h2>';
  var cls = section.cover ? "sec cover" : "sec";
  var heading = section.cover
    ? ""
    : title;
  return '<section class="' + cls + '" id="' + section.id + '" aria-labelledby="h-' + section.id + '">' +
    '<header class="sec-head">' +
    (section.cover ? "" : '<p class="sec-kicker">' + kicker + '</p>') +
    (section.cover ? '<h2 class="visually-hidden" id="h-' + section.id + '">' + esc(data.title) + '</h2>' : '<h2 id="h-' + section.id + '">' + data.title + '</h2>') +
    '</header>' +
    '<div class="sec-body">' + data.body + '</div>' +
    '</section>' + heading.replace(heading,"");
}

function renderDoc(){
  var html = "";
  for(var i = 0; i < NYX_DATA.sections.length; i++){
    html += sectionMarkup(NYX_DATA.sections[i]);
  }
  html += '<footer class="doc-footer">' +
    '<p>' + (state.lang === "fa"
      ? "NYX — هستهٔ کوچک، پروتکل باز، اولویت با پایانه، مستقل از زبان، گسترش در لبه‌ها. این سند پیش‌نویس است و وضعیت را همان‌طور که هست ثبت می‌کند."
      : "NYX — small core, open protocol, terminal first, language independent, extensible at the edges. This document is a draft and records status as it stands.") + '</p>' +
    '<a class="top-link" href="#top">' + esc(t().top) + ' ↑</a>' +
    '</footer>';
  var head = printHead.outerHTML;
  docEl.innerHTML = head + html;
}

function renderToc(){
  var ui = t();
  var html = "";
  for(var i = 0; i < NYX_DATA.sections.length; i++){
    var section = NYX_DATA.sections[i];
    var label = section.cover ? ui.coverLabel : section[state.lang].title;
    var num = section.cover ? "—" : pad2(section.num);
    html += '<li><a href="#' + section.id + '"><span class="toc-num">' + num + '</span><span class="toc-label">' + label + '</span></a></li>';
  }
  tocEl.innerHTML = html;
}

function decorateCode(scope){
  var ui = t();
  var wraps = scope.querySelectorAll(".codewrap");
  for(var i = 0; i < wraps.length; i++){
    var wrap = wraps[i];
    if(wrap.querySelector(".codebar")){ continue; }
    var bar = document.createElement("div");
    bar.className = "codebar";
    var label = document.createElement("span");
    label.className = "codelabel";
    var key = wrap.getAttribute("data-label");
    label.textContent = (ui.code && ui.code[key]) ? ui.code[key] : key;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copybtn";
    btn.textContent = ui.copy;
    btn.setAttribute("aria-label", ui.copyCode);
    btn.addEventListener("click", makeCopyHandler(btn, wrap));
    bar.appendChild(label);
    bar.appendChild(btn);
    wrap.insertBefore(bar, wrap.firstChild);
  }
}

function makeCopyHandler(btn, wrap){
  return function(){
    var target = wrap.querySelector("pre");
    if(!target){ return; }
    var text = target.innerText;
    var done = function(){
      btn.textContent = t().copied;
      window.setTimeout(function(){ btn.textContent = t().copy; }, 1600);
    };
    var failed = function(){
      btn.textContent = "×";
      window.setTimeout(function(){ btn.textContent = t().copy; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ legacyCopy(text, done, failed); });
    }else{
      legacyCopy(text, done, failed);
    }
  };
}

function legacyCopy(text, done, failed){
  var area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly","readonly");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(err){ ok = false; }
  document.body.removeChild(area);
  if(ok){ done(); }else{ failed(); }
}

function observeSections(){
  if(observer){ observer.disconnect(); }
  if(!("IntersectionObserver" in window)){ return; }
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        setActive(entry.target.id);
      }
    });
  }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
  var sections = docEl.querySelectorAll("section.sec");
  for(var i = 0; i < sections.length; i++){ observer.observe(sections[i]); }
}

function setActive(id){
  var links = tocEl.querySelectorAll("a");
  for(var i = 0; i < links.length; i++){
    var isCurrent = links[i].getAttribute("href") === "#" + id;
    if(isCurrent){ links[i].setAttribute("aria-current","true"); }
    else{ links[i].removeAttribute("aria-current"); }
  }
}

function updateProgress(){
  var doc = document.documentElement;
  var max = doc.scrollHeight - window.innerHeight;
  var ratio = max > 0 ? window.scrollY / max : 0;
  progressEl.style.width = (Math.min(1, Math.max(0, ratio)) * 100) + "%";
}

function closeSidebar(){
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
  backdrop.hidden = true;
  navToggle.setAttribute("aria-expanded","false");
}

function openSidebar(){
  sidebar.classList.add("open");
  backdrop.hidden = false;
  window.requestAnimationFrame(function(){ backdrop.classList.add("show"); });
  navToggle.setAttribute("aria-expanded","true");
}

function closeSettings(){
  settingsPop.classList.remove("open");
  settingsBtn.setAttribute("aria-expanded","false");
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
  root.setAttribute("data-lang", state.lang);
  document.title = NYX_DATA.meta[state.lang].title;
  descMeta.setAttribute("content", NYX_DATA.meta[state.lang].desc);
  applyStaticLabels();
  renderDoc();
  renderToc();
  decorateCode(docEl);
  observeSections();
  updateProgress();
}

fsRange.addEventListener("input", function(){
  state.fs = parseInt(fsRange.value,10);
  store.set("nyx.wp.fs", String(state.fs));
  applyTypography();
});
lhRange.addEventListener("input", function(){
  state.lh = parseFloat(lhRange.value);
  store.set("nyx.wp.lh", String(state.lh));
  applyTypography();
});
rwRange.addEventListener("input", function(){
  state.rw = parseInt(rwRange.value,10);
  store.set("nyx.wp.rw", String(state.rw));
  applyTypography();
});
document.getElementById("resetBtn").addEventListener("click", function(){
  state.fs = 16; state.lh = 1.72; state.rw = 76;
  store.set("nyx.wp.fs","16"); store.set("nyx.wp.lh","1.72"); store.set("nyx.wp.rw","76");
  applyTypography();
});
document.querySelectorAll("[data-theme-btn]").forEach(function(btn){
  btn.addEventListener("click", function(){
    state.theme = btn.getAttribute("data-theme-btn");
    store.set("nyx.wp.theme", state.theme);
    applyTheme();
  });
});
document.querySelectorAll("[data-lang-btn]").forEach(function(btn){
  btn.addEventListener("click", function(){
    var next = btn.getAttribute("data-lang-btn");
    if(next === state.lang){ return; }
    state.lang = next;
    store.set("nyx.wp.lang", state.lang);
    render();
    closeSettings();
    closeSidebar();
  });
});
document.getElementById("printBtn").addEventListener("click", function(){
  window.print();
});
settingsBtn.addEventListener("click", function(event){
  event.stopPropagation();
  var isOpen = settingsPop.classList.toggle("open");
  settingsBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  if(isOpen){ closeSidebar(); }
});
settingsPop.addEventListener("click", function(event){ event.stopPropagation(); });
navToggle.addEventListener("click", function(){
  if(sidebar.classList.contains("open")){ closeSidebar(); }else{ openSidebar(); closeSettings(); }
});
backdrop.addEventListener("click", closeSidebar);
document.addEventListener("click", function(){ closeSettings(); });
document.addEventListener("keydown", function(event){
  if(event.key === "Escape"){ closeSettings(); closeSidebar(); }
});
tocEl.addEventListener("click", function(event){
  if(window.innerWidth <= 1000){ closeSidebar(); }
});
var scrollQueued = false;
window.addEventListener("scroll", function(){
  if(scrollQueued){ return; }
  scrollQueued = true;
  window.requestAnimationFrame(function(){ updateProgress(); scrollQueued = false; });
}, { passive:true });
window.addEventListener("resize", updateProgress);
reduceMotion.addEventListener("change", function(){
  root.style.scrollBehavior = reduceMotion.matches ? "auto" : "smooth";
});

applyTypography();
applyTheme();
render();
root.style.scrollBehavior = reduceMotion.matches ? "auto" : "smooth";
if(window.location.hash){
  var target = document.getElementById(window.location.hash.slice(1));
  if(target){
    window.setTimeout(function(){
      target.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block:"start" });
    }, 60);
  }
}
updateProgress();

})();
</script>
</body>
</html>
